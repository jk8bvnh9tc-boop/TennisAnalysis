<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Tennis Analysis</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f3;color:#151515}.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:88px}.top{display:flex;justify-content:space-between;align-items:center;padding:18px 16px 8px}.top h1{font-size:20px;margin:0}.content{padding:8px 16px}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 1px 4px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button,select,input{font:inherit}button{border:0;border-radius:14px;padding:14px;min-height:54px;background:#fff;font-weight:650;box-shadow:0 1px 3px #0002}.primary{background:#111827;color:#fff;width:100%}.secondary{background:#e8e8e5}.selected{outline:3px solid #111827}.section{font-size:12px;font-weight:800;letter-spacing:.08em;color:#6b7280;text-transform:uppercase;margin:16px 0 8px}.muted{color:#6b7280;font-size:13px}.input{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:12px;background:white}.score{text-align:center;font-size:40px;font-weight:800}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(4,1fr);padding:7px 6px max(7px,env(safe-area-inset-bottom));z-index:5}.nav button{box-shadow:none;background:transparent;font-size:12px;min-height:48px;padding:8px 2px}.nav .active{background:#efefec}.court{position:relative;aspect-ratio:1.05/1;background:#e9eef0;border:3px solid #111;border-radius:8px;overflow:hidden;margin:12px 0}.court:after{content:"";position:absolute;left:0;right:0;top:50%;border-top:4px solid #111}.zone{position:absolute;width:33.333%;height:50%;border-right:1px solid #777;border-bottom:1px solid #777}.z1{left:0;top:0}.z2{left:33.333%;top:0}.z3{left:66.666%;top:0;border-right:0}.z4{left:0;top:50%}.z5{left:33.333%;top:50%}.z6{left:66.666%;top:50%;border-right:0}.marker{position:absolute;width:28px;height:28px;border-radius:50%;background:#111827;border:4px solid white;transform:translate(-50%,-50%);z-index:3}.list{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #eee}.pill{font-size:12px;background:#eee;padding:5px 8px;border-radius:99px}.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 16px;border-radius:12px;z-index:20}
</style>
</head>
<body><div id="app"></div>
<script>
const K="ta_single_v1";
let S=JSON.parse(localStorage.getItem(K)||"null")||{players:[{name:"Mia",hand:"Rechts",lk:"20.8"}],matches:[],settings:{start:"0:0",ad:true,third:"match-tiebreak"}};
const save=()=>localStorage.setItem(K,JSON.stringify(S)),app=document.querySelector("#app");
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function shell(t,b,a="matches"){app.innerHTML='<div class="app"><header class="top"><h1>'+esc(t)+'</h1><button onclick="settings()">⚙</button></header><main class="content">'+b+'</main><nav class="nav">'+[['matches','Matches'],['analysis','Analyse'],['development','Entwicklung'],['opponents','Gegner']].map(x=>'<button class="'+(a==x[0]?'active':'')+'" onclick="'+x[0]+'()">'+x[1]+"</button>").join("")+"</nav></div>"}
function toast(t){let x=document.createElement("div");x.className="toast";x.textContent=t;document.body.append(x);setTimeout(()=>x.remove(),1400)}
function home(){let m=S.matches.at(-1);shell("Tennis Analysis",'<div class="card"><div class="section">Spielerin</div><select class="input"><option>Mia · LK '+esc(S.players[0].lk)+"</option></select><button class=\"primary\" style=\"margin-top:14px;font-size:20px\" onclick=\"newMatch()\">＋ MATCH</button></div>"+(m?'<div class="card"><div class="section">Letztes Match</div><h2>'+esc(m.player)+" – "+esc(m.opponent)+'</h2><div class="score">'+esc(m.score)+'</div><div class="muted">'+new Date(m.date).toLocaleDateString("de-DE")+'</div><button style="width:100%;margin-top:10px" onclick="detail(\''+m.id+'\')">Match ansehen</button></div>':""))}
let mods={court:false,rally:false,serve:false,opponent:false},oppHand="";
function newMatch(){mods={court:false,rally:false,serve:false,opponent:false};oppHand="";shell("Neues Match",'<div class="card"><div class="section">Spielerin</div><div class="input">Mia · '+esc(S.players[0].hand)+" · LK "+esc(S.players[0].lk)+'</div><div class="section">Gegnerin</div><input id="opp" class="input" placeholder="Name optional"><div class="section">Spielhand Gegnerin</div><div class="grid"><button onclick="pickHand(this,\'Rechts\')">Rechts</button><button onclick="pickHand(this,\'Links\')">Links</button></div><div class="section">LK Gegnerin</div><input id="lk" class="input" placeholder="optional"><div class="section">Matchtyp</div><select id="type" class="input"><option value="">Nicht angegeben</option><option>Turnier</option><option>Punktspiel</option><option>Trainingsspiel</option></select><div class="section">Module</div><div class="grid">'+[['court','Court'],['rally','Rally'],['serve','Aufschlag'],['opponent','Gegner']].map(x=>'<button id="m_'+x[0]+'" onclick="toggleMod(\''+x[0]+'\')">'+x[1]+"</button>").join("")+'</div><div class="card"><b>Matchregeln</b><div class="muted">'+S.settings.start+" · "+(S.settings.ad?"Ad":"No-Ad")+" · "+(S.settings.third==="normal"?"3. Satz normal":"Match-Tie-Break bis 10")+'</div></div><button class="primary" onclick="startMatch()">MATCH STARTEN</button></div>")}
function pickHand(b,v){oppHand=v;document.querySelectorAll("[onclick^='pickHand']").forEach(x=>x.classList.remove("selected"));b.classList.add("selected")}
function toggleMod(v){mods[v]=!mods[v];document.querySelector("#m_"+v).classList.toggle("selected",mods[v])}
function startMatch(){S.current={id:crypto.randomUUID(),date:Date.now(),player:"Mia",playerLK:S.players[0].lk,playerHand:S.players[0].hand,opponent:document.querySelector("#opp").value||"Gegnerin",opponentLK:document.querySelector("#lk").value,opponentHand:oppHand,type:document.querySelector("#type").value,mods:{...mods},score:S.settings.start,points:[]};renderMatch()}
function renderMatch(){let c=S.current;shell(c.player+" – "+c.opponent,'<div class="score">'+esc(c.score)+'</div><div class="card"><div class="section">Wer hat den Punkt gemacht?</div><div class="grid"><button onclick="chooseWinner(\'player\')">'+esc(c.player)+'</button><button onclick="chooseWinner(\'opponent\')">'+esc(c.opponent)+'</button></div>'+(c.winner?'<div class="section">Winner oder Fehler?</div><div class="grid"><button onclick="chooseKind(\'Winner\')">Winner</button><button onclick="chooseKind(\'Fehler\')">Fehler</button></div>':"")+(c.kind?'<div class="section">Schlag</div><div class="grid">'+(c.serveTurn?["Aufschlag","Vorhand","Rückhand","Volley"]:["Return","Vorhand","Rückhand","Volley"]).map(x=>'<button onclick="chooseShot(\''+x+'\')">'+x+"</button>").join("")+"</div>":"")+(c.shot&&c.mods.serve&&c.serveTurn?'<div class="section">Aufschlag</div><div class="grid"><button onclick="chooseServe(\'1Sa\')">Erster Aufschlag</button><button onclick="chooseServe(\'1Sb\')">Zweiter Aufschlag</button></div>':"")+'</div><button class="secondary" style="width:100%;margin-bottom:8px" onclick="undo()">↩ Zurück</button><button class="primary" onclick="confirmPoint()">BESTÄTIGEN</button>');c.serveTurn=true}
function chooseWinner(v){S.current.winner=v;renderMatch()}function chooseKind(v){S.current.kind=v;renderMatch()}function chooseShot(v){S.current.shot=v;renderMatch()}function chooseServe(v){S.current.serve=v;confirmPoint()}
function confirmPoint(){let c=S.current;if(!c.winner||!c.kind||!c.shot)return toast("Punkt bitte vollständig erfassen.");c.points.push({winner:c.winner,kind:c.kind,shot:c.shot,serve:c.serve||null});let[a,b]=c.score.split(":").map(Number);c.score=(c.winner==="player"?a+1:a)+":"+(c.winner==="opponent"?b+1:b);delete c.winner;delete c.kind;delete c.shot;delete c.serve;save();if(c.mods.court)renderCourt();else if(c.mods.rally)renderRally();else renderMatch()}
function renderCourt(){shell("Court",'<div class="card"><div class="section">Ballplatzierung</div><div class="court" id="court">'+[1,2,3,4,5,6].map(i=>'<div class="zone z'+i+'"></div>').join("")+'</div><div class="grid"><button onclick="setCourt(\'Netz\')">Netz</button><button onclick="setCourt(\'Lang\')">Lang</button><button onclick="setCourt(\'Seitenaus links\')">Seitenaus links</button><button onclick="setCourt(\'Seitenaus rechts\')">Seitenaus rechts</button></div><button style="width:100%;margin-top:10px" onclick="setCourt(\'Nicht gesehen\')">NICHT GESEHEN</button></div><button class="primary" onclick="continueAfterModule()">BESTÄTIGEN</button><button style="width:100%;margin-top:8px" onclick="renderMatch()">↩ ZURÜCK</button>")}
function setCourt(v){if(v==="Nicht gesehen"||v==="Netz"||v==="Lang"||v.includes("Seitenaus"))S.current.court=v;else{let r=document.querySelector("#court").getBoundingClientRect();S.current.court={x:(event.clientX-r.left)/r.width,y:(event.clientY-r.top)/r.height}}}
function continueAfterModule(){if(S.current.mods.rally)renderRally();else renderMatch()}
function renderRally(){shell("Rally",'<div class="card"><div class="section">Ballwechsel</div><div class="grid">'+["1","2–3","4–6","7+"].map(x=>'<button onclick="setRally(\''+x+'\')">'+x+" Schläge</button>").join("")+'</div><button style="width:100%;margin-top:10px" onclick="setRally(\'Nicht gesehen\')">NICHT GESEHEN</button></div><button class="primary" onclick="continueAfterRally()">BESTÄTIGEN</button><button style="width:100%;margin-top:8px" onclick="renderMatch()">↩ ZURÜCK</button>")}
function setRally(v){S.current.rally=v}function continueAfterRally(){renderMatch()}
function undo(){S.current.points.pop();save();renderMatch()}
function detail(id){let m=S.matches.find(x=>x.id===id);S.view=m;shell("Matchdetail",'<div class="card"><h2>'+esc(m.player)+" – "+esc(m.opponent)+'</h2><div class="score">'+esc(m.score)+'</div><div class="muted">'+new Date(m.date).toLocaleDateString("de-DE")+" · "+esc(m.type||"Match")+'</div><div class="section">Analyse auswählen</div><select class="input" onchange="toast(this.value.includes(\'🔒\')?\'Noch nicht freigeschaltet.\':\'Analyse: \'+this.value)"><option>Matchübersicht</option><option>Heatmap</option><option>Platzierung</option><option>Fehleranalyse</option><option>Rally</option><option>Vorhand / Rückhand</option><option>Entwicklung 🔒</option><option>Aufschlag 🔒</option><option>Gegner 🔒</option></select><div class="section">Mini-Analyse</div><p>'+m.points.length+" Punkte erfasst. Die endgültigen Visualisierungen werden nach dem Funktionsprototyp ergänzt.</p></div>")}
function finish(){if(S.current){S.matches.push({...S.current});delete S.current;save()}home()}
function analysis(){shell("Analyse",'<div class="card"><h2>Gezielte Auswertung</h2><p>Wähle ein Match aus und anschließend die gewünschte Analyse.</p><button class="primary" onclick="home()">MATCH AUSWÄHLEN</button></div>','analysis')}
function development(){shell("Entwicklung",'<div class="card"><h2>Muster & Trends</h2><p><b>2 Datenmengen:</b> Trend<br><b>3 Datenmengen:</b> Muster<br><b>ab 4:</b> Trend belastbarer.</p><div class="grid"><button>Siege</button><button>Niederlagen</button><button>Turnier</button><button>Punktspiel</button><button>Training</button><button>LK</button></div><p class="muted">'+S.matches.length+" Matches gespeichert.</p></div>","development")}
function opponents(){let ns=[...new Set(S.matches.map(m=>m.opponent))];shell("Gegner",'<div class="card"><h2>Gegnerinnen</h2>'+(ns.length?ns.map(n=>'<div class="list"><span>'+esc(n)+'</span><span class="pill">'+S.matches.filter(m=>m.opponent===n).length+" Matches</span></div>").join(""):"<p class=\"muted\">Noch keine Gegnerdaten.</p>")+"</div>","opponents")}
function settings(){shell("Einstellungen",'<div class="card"><div class="section">Startstand</div><select id="start" class="input"><option>0:0</option><option>2:2</option></select><div class="section">Punktwertung</div><select id="ad" class="input"><option value="1">Ad</option><option value="0">No-Ad</option></select><div class="section">Dritter Satz</div><select id="third" class="input"><option value="match-tiebreak">Match-Tie-Break bis 10</option><option value="normal">Ganzer Satz</option></select><button class="primary" style="margin-top:14px" onclick="saveSettings()">SPEICHERN</button></div><div class="card"><b>Mia</b><p>Spielhand: '+esc(S.players[0].hand)+" · LK "+esc(S.players[0].lk)+"</p></div>")}
function saveSettings(){S.settings.start=document.querySelector("#start").value;S.settings.ad=document.querySelector("#ad").value==="1";S.settings.third=document.querySelector("#third").value;save();toast("Gespeichert")}
home();
</script></body></html>
