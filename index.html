.net{position:absolute;left:0;right:0;top:50%;border-top:4px solid #111;z-index:2}.marker{position:absolute;width:28px;height:28px;border-radius:50%;background:#111827;border:4px solid #fff;transform:translate(-50%,-50%);z-index:3}
.modal{position:fixed;z-index:30;inset:0;background:#0007;display:flex;align-items:flex-end}.modalbox{width:100%;max-width:720px;margin:auto 0 0;background:#fff;border-radius:22px 22px 0 0;padding:22px 16px 30px}.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.v8-court-wrap{max-width:560px;margin:12px auto}.v8-court-half{position:relative;width:100%;aspect-ratio:.66;border:3px solid #222;background:#5f855c;border-radius:5px;overflow:hidden}.v8-net{position:absolute;left:0;right:0;top:0;height:4%;background:#d7d7d7;border-bottom:3px solid #222;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#222;z-index:2}.v8-court-lines{position:absolute;left:7%;right:7%;top:4%;bottom:2.5%;z-index:1;border-left:2px solid #fff;border-right:2px solid #fff;border-bottom:3px solid #fff}.v8-service-line{position:absolute;left:0;right:0;top:53.85%;border-top:2px solid #fff}.v8-center-line{position:absolute;left:50%;top:0;height:53.85%;border-left:2px solid #fff}.v8-court-grid{position:absolute;left:7%;right:7%;top:4%;bottom:2.5%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);z-index:4}.v8-cell{min-width:0;min-height:0;padding:0;border-radius:0;background:transparent;box-shadow:none;border:1px dashed rgba(255,255,255,.55)}.v8-cell.selected-cell{background:rgba(255,255,255,.38);box-shadow:inset 0 0 0 4px #fff}.v8-serve-grid{position:absolute;left:7%;right:7%;top:4%;height:30%;display:grid;grid-template-columns:repeat(3,1fr);z-index:5}.v8-serve-grid .v8-cell{border:2px solid rgba(255,255,255,.8)}.v8-serve-grid .v8-cell.selected-cell{background:rgba(255,255,255,.42)}.v8-serve-target{position:absolute;top:4%;height:50.35%;width:43%;z-index:6;display:grid;grid-template-columns:repeat(3,1fr)}.v8-serve-target.left{left:7%}.v8-serve-target.right{right:7%}.v8-serve-target .v8-cell{border:2px solid rgba(255,255,255,.9);border-radius:0}.v8-serve-target .v8-cell.selected-cell{background:rgba(255,255,255,.42);box-shadow:inset 0 0 0 3px #fff}.v8-court-caption{text-align:center;margin-top:8px;font-size:13px}.v8-disabled{opacity:.38;cursor:not-allowed!important}

/* V31 Serve dashboard UI */
.serve-hero{background:linear-gradient(180deg,#f7faf8 0%,#ffffff 100%);border:1px solid #dce5df}
.serve-hero .section{margin-bottom:8px}

.serve-kpi-value{font-size:26px;font-weight:900;letter-spacing:-.02em;margin-top:4px}
.serve-kpi-sub{font-size:11px;color:#7c847f;margin-top:3px}
.serve-section-card{border:1px solid #e0e6e2;border-radius:16px;background:#fff;overflow:hidden}
.serve-section-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #edf1ee;background:#fafcfb}

.serve-pill{font-size:11px;font-weight:800;padding:4px 8px;border-radius:999px;background:#edf4ef}
.serve-side{padding:12px 14px}
.serve-side+.serve-side{border-top:1px solid #edf1ee}
.serve-side-title{font-size:13px;font-weight:800;margin-bottom:8px}
.serve-row{margin:10px 0}
.serve-row-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.serve-row-label{font-size:13px;font-weight:800}

.serve-bar>span{display:block;height:100%;background:#1f4d3a;border-radius:999px}
.serve-empty{font-size:12px;color:#7b827d;padding:4px 0}

/* V32: visual variety for Serve analysis */
.serve-columns{display:flex;align-items:flex-end;justify-content:space-around;gap:12px;height:190px;padding:18px 10px 8px}
.serve-column-item{flex:1;min-width:0;text-align:center}

/* V57.1 dark-mode fixes: live score + court orientation */

/* Live match scoreboard: remove the bright white block in dark mode */
body.dark .score-block{
  background:#1d261f!important;
  border:1px solid #3b4940!important;
  box-shadow:0 2px 10px rgba(0,0,0,.28)!important;
}
body.dark .score-value,
body.dark .point-value,
body.dark .score-label{
  color:#dbe4de!important;
}
body.dark .v8-score-row{
  color:#dbe4de!important;
}

/* Court capture: make the real tennis-court lines visible again in dark mode */
body.dark .v8-court-half{
  background:#315f43!important;
  border-color:#9aa8a0!important;
}
body.dark .v8-court-lines{
  border-left-color:#eef2ef!important;
  border-right-color:#eef2ef!important;
  border-bottom-color:#eef2ef!important;
}
body.dark .v8-service-line{
  border-top-color:#eef2ef!important;
}
body.dark .v8-center-line{
  border-left-color:#eef2ef!important;
}
body.dark .v8-net{
  background:#cdd5d0!important;
  border-bottom-color:#eef2ef!important;
  color:#1a211d!important;
}

/* Keep 3×3 assistance visible without overpowering the real court */
body.dark .v8-cell{
  border-color:rgba(238,242,239,.42)!important;
}
body.dark .v8-court-grid .v8-cell{
  border-style:dashed!important;
}

}
body.dark .v8-serve-target .v8-cell{
  border-color:rgba(238,242,239,.70)!important;
}

/* V57 — Dark-mode court grid transparency fix
   Keep 3×3 cells interactive but transparent so the real court lines remain visible before selection. */
body.dark .v8-court-grid .v8-cell{
  background:transparent!important;
  border-color:rgba(238,242,239,.42)!important;
}

}
body.dark .v8-court-grid .v8-cell.selected-cell{
  background:rgba(238,242,239,.22)!important;
  box-shadow:inset 0 0 0 3px #eef2ef!important;
}

/* V57 — Court orientation marker */
.court-player-anchor{
  position:absolute;
  left:50%;
  bottom:1.4%;
  transform:translateX(-50%);
  z-index:7;
  display:flex;
  flex-direction:column;
  align-items:center;
  pointer-events:none;
  min-width:96px;
}
.court-person{
  position:relative;
  width:34px;
  height:54px;
  display:block;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.28));
}
.court-person:before{
  content:"";
  position:absolute;
  left:10px;
  top:0;
  width:14px;
  height:14px;
  border-radius:50%;
  background:#17251d;
  box-shadow:
    0 16px 0 -2px #17251d,
    -8px 24px 0 -4px #17251d,
    8px 24px 0 -4px #17251d,
    -6px 40px 0 -4px #17251d,
    6px 40px 0 -4px #17251d;
}
.court-player-label{
  margin-top:1px;
  padding:2px 6px;
  border-radius:999px;
  background:rgba(246,249,247,.92);
  border:1px solid rgba(27,54,39,.28);
  color:#173024;
  font-size:8px;
  line-height:1.2;
  font-weight:950;
  max-width:110px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  box-shadow:0 1px 3px rgba(0,0,0,.12);
}
body.dark .court-person:before{
  background:#e0e7e2;
  box-shadow:
    0 16px 0 -2px #e0e7e2,
    -8px 24px 0 -4px #e0e7e2,
    8px 24px 0 -4px #e0e7e2,
    -6px 40px 0 -4px #e0e7e2,
    6px 40px 0 -4px #e0e7e2;
}
body.dark .court-player-label{
  background:rgba(25,34,29,.94);
  border-color:rgba(225,234,228,.38);
  color:#e2e9e4;
}

/* V57 — finish dialog contrast + larger handed court figure */

/* Match beenden: normal options need the same strong dark-mode green hierarchy. */
body.dark .finish-choice{
  background:#28312c;
  border-color:#48554d;
}
body.dark .finish-choice b{
  color:#72c98b!important;
}
body.dark .finish-choice span{
  color:#b7c2bb!important;
}
body.dark .finish-choice.danger{

  border-color:#76504b;
}
body.dark .finish-choice.danger b{
  color:#df958c!important;
}
body.dark .finish-choice.danger span{
  color:#c4aaa6!important;
}

/* Court figure: slightly larger than V57 and equipped with a handed racket. */
.court-player-anchor{
  min-width:108px;
}
.court-person{
  width:40px;
  height:64px;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.30));
}
.court-person:before{
  left:12px;
  width:16px;
  height:16px;
  box-shadow:
    0 19px 0 -2px #17251d,
    -9px 29px 0 -4px #17251d,
    9px 29px 0 -4px #17251d,
    -7px 48px 0 -4px #17251d,
    7px 48px 0 -4px #17251d;
}
.court-racket{
  position:absolute;
  top:25px;
  width:16px;
  height:23px;
  border:2px solid #17251d;
  border-radius:50%;
  box-sizing:border-box;
}
.court-racket:after{
  content:"";
  position:absolute;
  width:2px;
  height:18px;
  background:#17251d;
  left:50%;
  top:19px;
  transform-origin:top center;
}
.court-racket.right{
  right:-8px;
  transform:rotate(18deg);
}
.court-racket.right:after{
  transform:translateX(-50%) rotate(-18deg);
}
.court-racket.left{
  left:-8px;
  transform:rotate(-18deg);
}
.court-racket.left:after{
  transform:translateX(-50%) rotate(18deg);
}
body.dark .court-person:before{
  background:#e0e7e2;
  box-shadow:
    0 19px 0 -2px #e0e7e2,
    -9px 29px 0 -4px #e0e7e2,
    9px 29px 0 -4px #e0e7e2,
    -7px 48px 0 -4px #e0e7e2,
    7px 48px 0 -4px #e0e7e2;
}
body.dark .court-racket{
  border-color:#e0e7e2;
}
body.dark .court-racket:after{
  background:#e0e7e2;
}

/* V57 — stable handed court figure with low racket grip */
.court-player-svg{
  width:48px;
  height:76px;
  display:block;
  overflow:visible;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.28));
}
.court-player-svg .body-stroke,
.court-player-svg .racket-stroke{stroke:#17251d}
.court-player-svg .head-fill{fill:#17251d}
body.dark .court-player-svg .body-stroke,
body.dark .court-player-svg .racket-stroke{stroke:#e0e7e2}
body.dark .court-player-svg .head-fill{fill:#e0e7e2}

/* V57 V57D — readable one-screen tracking */
.tracking-mode{height:100dvh;min-height:100dvh;overflow:hidden}
.tracking-mode .top{height:48px;min-height:48px;padding:6px 12px}
.tracking-mode .top h1{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tracking-mode .gear{width:36px;height:36px;min-height:36px;padding:4px;font-size:17px}
.tracking-mode .nav{display:none}
.tracking-mode .content{
  height:calc(100dvh - 48px - env(safe-area-inset-bottom));
  box-sizing:border-box;overflow:hidden;padding:6px 12px 10px;transform-origin:top center;
}
.tracking-mode .section{margin:9px 0 6px;font-size:12px}
.tracking-mode button{min-height:54px;padding:11px 9px;font-size:14px;font-weight:800;line-height:1.15}
.tracking-mode .grid{gap:9px}
.tracking-mode h2{font-size:20px}
.tracking-mode .muted{font-size:11px;line-height:1.35}

/* Compact but readable score: Spiele | Spielstand | Sätze */
.tracking-score{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:5px 0 7px}
.tracking-score-box{background:#fff;border:1px solid #e0e7e2;border-radius:12px;padding:7px 4px;text-align:center}
.tracking-score-label{font-size:9px;font-weight:850;color:#718078;text-transform:uppercase;letter-spacing:.04em}
.tracking-score-value{font-size:21px;line-height:1.05;font-weight:950;color:#203d30;margin-top:2px;white-space:nowrap}
.tracking-server{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:5px;min-height:27px;padding:3px 8px;border-radius:9px;background:#eef4f0;font-size:10px;font-weight:850;color:#42564a}

/* Question stage deliberately has NO card/background */
.tracking-stage{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:4px 2px;
}
.tracking-context{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tracking-context-chip{display:inline-flex;align-items:center;min-height:27px;padding:4px 8px;border-radius:999px;background:#eef4f0;border:1px solid #d8e3dc;color:#456052;font-size:10px;font-weight:850}
.tracking-question{font-size:17px;line-height:1.3;font-weight:900;color:#263f33;margin:4px 0 12px}
.tracking-choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tracking-choice-grid button{min-height:64px;font-size:15px}

/* Utility icons */
.tracking-subactions{display:grid;grid-template-columns:repeat(3,48px);justify-content:center;gap:14px;margin-top:8px}
.tracking-subactions.two{grid-template-columns:repeat(2,50px)}
.tracking-icon-btn{width:48px!important;min-width:48px!important;height:48px!important;min-height:48px!important;padding:0!important;border-radius:50%!important;font-size:20px!important;display:flex!important;align-items:center!important;justify-content:center!important}
.tracking-icon-btn.abort{color:#8d3e35!important;border-color:#c89891!important;background:#f5e8e6!important}
body.dark .tracking-icon-btn.abort{color:#f0b0a9!important;border-color:#84544e!important;background:#3d2926!important}

/* Court layout remains the compact geometry from original Test 2 */
.tracking-mode.court-tracking .card{padding:10px;margin:6px 0}
.tracking-mode.court-tracking .section{margin:7px 0 4px}
.tracking-mode.court-tracking button{min-height:40px;padding:8px 7px;font-size:11px}
.tracking-mode.court-tracking .v8-court-wrap{width:min(72vw,245px);margin:4px auto}
.tracking-mode.court-tracking .court-question{font-size:11px;margin-bottom:4px}
.tracking-mode.court-tracking .court-half-owner{margin:0 0 4px}
.tracking-mode.court-tracking .court-half-owner span{font-size:9px}
.tracking-mode.court-tracking .v8-court-caption{margin-top:3px;font-size:9px}
.tracking-mode.court-tracking .court-player-anchor{transform:translateX(-50%) scale(.82);transform-origin:bottom center;bottom:.5%}
.tracking-court-actions{display:grid;grid-template-columns:54px 1fr;gap:10px;align-items:center;margin-top:7px}
.tracking-court-actions .tracking-icon-btn{width:54px!important;min-width:54px!important;height:46px!important;min-height:46px!important;border-radius:14px!important}
.tracking-court-actions .primary{margin:0!important;min-height:46px}

/* Use vertical space, not a large white container */
.tracking-mode:not(.court-tracking) .content{display:flex;flex-direction:column}
.tracking-mode:not(.court-tracking) .content>.tracking-stage{flex:1 1 auto}

/* Dark */
body.dark .tracking-score-box{background:#202923;border-color:#3b4940}
body.dark .tracking-score-label{color:#9fb0a6}
body.dark .tracking-score-value{color:#d7e0da}
body.dark .tracking-server{background:#29362f;color:#bfcac3}
body.dark .tracking-context-chip{background:#29372f;border-color:#415047;color:#bfcac3}
body.dark .tracking-question{color:#dce5df}

/* Emergency compression, still readable */
.tracking-mode.track-tight button{min-height:50px;font-size:13px}
.tracking-mode.track-tight .tracking-choice-grid button{min-height:58px;font-size:14px}
.tracking-mode.track-tightest button{min-height:46px;font-size:12px}
.tracking-mode.track-tightest .tracking-choice-grid button{min-height:54px;font-size:13px}

.tracking-finish-modal .modalbox{max-height:calc(100dvh - 24px);overflow:hidden;padding:12px}
.tracking-finish-modal .modalbox h3{margin:2px 0 5px}
.tracking-finish-modal .modalbox>p{margin:4px 0 6px;font-size:10px;line-height:1.3}

/* V57E — serve placement must always show the full court and action row */
.tracking-mode.court-tracking .tracking-score{
  margin:2px 0 4px;
}
.tracking-mode.court-tracking .tracking-score-box{
  padding:4px 3px;
}
.tracking-mode.court-tracking .tracking-score-label{
  font-size:8px;
}
.tracking-mode.court-tracking .tracking-score-value{
  font-size:17px;
}
.tracking-mode.court-tracking .tracking-server{
  min-height:21px;
  font-size:9px;
}
.tracking-mode.court-tracking .card{
  margin:3px 0;
  padding:8px;
}
.tracking-mode.court-tracking .v8-court-wrap{
  width:min(68vw,225px);
  margin:2px auto;
}
.tracking-mode.court-tracking .court-player-anchor{
  transform:translateX(-50%) scale(.76);
}
.tracking-mode.court-tracking .tracking-court-actions{
  margin-top:4px;
}

/* V57F — centered match title + consistent tracking footer */
.tracking-mode .top{
  position:relative;
  justify-content:center;
}
.tracking-mode .top h1{
  width:calc(100% - 88px);
  text-align:center;
  margin:0 auto;
}
.tracking-mode .top .gear{
  position:absolute;
  right:12px;
  top:6px;
}
.tracking-subactions,
.tracking-subactions.two{
  grid-template-columns:repeat(3,48px)!important;
  justify-content:center;
  gap:14px;
}

/* V57 — brief visual confirmation before automatic screen advance */
.tracking-mode button.selected{
  transform:scale(.985);
  box-shadow:inset 0 0 0 2px rgba(24,69,45,.32);
}
body.dark .tracking-mode button.selected{
  box-shadow:inset 0 0 0 2px rgba(235,243,238,.38);
}
.tracking-mode .v8-cell.selected-cell{
  transition:background .08s ease,box-shadow .08s ease;
}

/* V57 — compact profile actions */
.settings-profile-actions{
  display:flex;
  align-items:center;
  gap:8px;
}
.profile-icon-action{
  width:40px!important;
  min-width:40px!important;
  height:40px!important;
  min-height:40px!important;
  padding:8px!important;
  border-radius:12px!important;
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
  box-shadow:none!important;
}
.profile-icon-action svg{
  width:20px;
  height:20px;
  display:block;
}
.profile-icon-action.select{
  color:#2f6f49;
  background:#eef6f0!important;
  border-color:#bcd3c4!important;
}
.profile-icon-action.edit{
  color:#526159;
  background:#f5f7f5!important;
  border-color:#d7ded9!important;
}
.profile-icon-action:active{

}
body.dark .profile-icon-action.select{
  color:#8ed2a2!important;
  background:#26382d!important;
  border-color:#53715f!important;
}
body.dark .profile-icon-action.edit{
  color:#d0d9d3!important;
  background:#303934!important;
  border-color:#4b5750!important;
}
/* V57.1 — professional analysis / development navigation icons */
.nav button{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  line-height:1.05;
}
.nav-svg{
  width:22px;
  height:22px;
  display:block;
}
.nav-icon-fallback{

}

}

/* V57.2 — Satzüberschriften im Detailverlauf der Drucksituationen */
.pressure-set-group + .pressure-set-group{
  margin-top:14px;
  padding-top:8px;
  border-top:1px solid #e6ece8;
}
.pressure-set-heading{
  width:max-content;
  margin:2px 0 7px auto;
  padding:4px 7px;
  border-radius:999px;
  background:#1f4d3a;
  color:#fff;
  font-size:9px;
  font-weight:900;
  line-height:1;
}

  border-top-color:#3b4740;
}
body.dark .pressure-set-heading{
  background:#315d42;
  color:#fff;
}
/* V58 — Development overview + 3 drill-down analyses */
.dev58-landing{display:flex;flex-direction:column;gap:10px;padding:4px 0 8px}
.dev58-section-label{margin:5px 2px 0;font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#65736b}
.dev58-focus-card,.dev58-tile{
  width:100%;text-align:left;border-radius:17px;border:1px solid #dbe4de;background:#fff;padding:14px;box-shadow:0 1px 4px #0000000d
}
.dev58-focus-card{border-left:5px solid #4f8d67;background:linear-gradient(135deg,#f4faf6,#fff)}
.dev58-focus-card.warn{border-left-color:#b99342}
.dev58-focus-card.bad{border-left-color:#b96a61}
.dev58-focus-card.empty{border-left-color:#7d8b83}
.dev58-focus-top,.dev58-tile-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.dev58-focus-kicker,.dev58-kicker{font-size:9px;font-weight:900;letter-spacing:.075em;text-transform:uppercase;color:#6d7a72}
.dev58-focus-status{font-size:9px;font-weight:850;padding:4px 7px;border-radius:999px;background:#e8f1eb;color:#3e684d}
.dev58-focus-title{font-size:20px;font-weight:950;line-height:1.1;color:#203d30;margin-top:6px}
.dev58-focus-copy{font-size:10px;line-height:1.4;color:#68756d;margin-top:8px}
.dev58-focus-kpis{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:12px}
.dev58-focus-kpis>div:not(.arrow){padding:9px;border-radius:11px;background:#fff;border:1px solid #e2e9e4}
.dev58-focus-kpis span{display:block;font-size:8px;color:#77827c;font-weight:800;text-transform:uppercase}
.dev58-focus-kpis b{display:block;font-size:21px;color:#274533;margin-top:2px}
.dev58-focus-kpis .arrow{font-size:20px;color:#6a796f}
.dev58-focus-link{font-size:10px;font-weight:950;color:#3d6e50;margin-top:10px}
.dev58-tile{padding:13px 14px}
.dev58-title{font-size:17px;font-weight:950;color:#263f33;margin-top:3px}

function removeCurrentStoredMatch(m){
  if(!m)return;
  if(isScoutMatch(m))state.opponentMatches=(state.opponentMatches||[]).filter(x=>x.id!==m.id);
  else state.matches=state.matches.filter(x=>x.id!==m.id);
}
function scoutMatchModules(m){
  const out=[];
  if(m?.mods?.court)out.push('Court');
  if(m?.mods?.rally)out.push('Ballwechsel');
  if(m?.mods?.serve)out.push('Aufschlag');
  return out;
}
function scoutMatchCapturedCounts(m){
  const pts=m?.points||[];
  return {
    points:pts.length,
    serve:pts.filter(p=>p.serveDetail?.complete).length,
    court:pts.filter(p=>p.court&&p.court!=='ns').length,
    rally:pts.filter(p=>p.rally&&p.rally!=='ns').length,
    ownErrors:pts.filter(p=>p.winner==='opponent'&&p.kind==='error').length,
    winners:pts.filter(p=>p.winner==='player'&&p.kind==='winner').length
  };
}

function match(){
  const m=state.matches.find(m=>m.id===state.currentMatchId)||(state.opponentMatches||[]).find(m=>m.id===state.currentMatchId)||null;
  if(m){
    if(!m.currentSet)m.currentSet=Math.max(1,m.sets[0]+m.sets[1]+1);
    if(!m.setGames)m.setGames=[[...(m.games||[0,0])],[0,0],[0,0]];
    if(!m.completedSets)m.completedSets=[];
  }
  return m;
}

function fitTrackingScreen(){
  const root=document.querySelector('.tracking-mode'),content=root?.querySelector('.content');
  if(!root||!content)return;
  root.classList.remove('track-tight','track-tightest');
  content.style.transform='';content.style.width='';
  requestAnimationFrame(()=>{
    if(content.scrollHeight>content.clientHeight+2)root.classList.add('track-tight');
    requestAnimationFrame(()=>{
      if(content.scrollHeight>content.clientHeight+2)root.classList.add('track-tightest');
      requestAnimationFrame(()=>{
        if(content.scrollHeight>content.clientHeight+2){
          const scale=Math.max(.92,Math.min(1,(content.clientHeight-2)/content.scrollHeight));
          if(scale<.995){content.style.transform=`scale(${scale})`;content.style.width=`calc(100% / ${scale})`}
        }
      })
    })
  })
}

function trackingBackPoint(stage){
  const m=match();if(!m)return;
  if(stage==='kind'){renderPointStage('winner');return}
  if(stage==='shot'){renderPointStage('kind');return}

}
function trackingBackFromError(){
  const m=match(),p=m?.pending;
  if(isOwnReturnError(m,p)){returnErrorSideMask();return}
  renderPointStage('shot');
}
function trackingPointUsesCourt(m,p){
  if(!m?.mods?.court||!p)return false;
  if(p.kind==='winner')return true;
  if(p.kind!=='error')return false;
  const serveCausedReturnError=p.winner==='player'&&p.shot==='Aufschlag'&&m.mods.serve;
  return p.winner==='player'&&p.shot!=='Doppelfehler'&&!serveCausedReturnError;
}
function trackingBackFromCourt(){
  const m=match(),p=m?.pending;if(!m||!p)return;
  if(p.kind==='error'){errorMask();return}
  renderPointStage('shot');
}
function trackingBackFromRally(){
  const m=match(),p=m?.pending;if(!m||!p)return;
  if(trackingPointUsesCourt(m,p)){court();return}
  if(p.kind==='error'){errorMask();return}
  renderPointStage('shot');
}

function trackingServePlacementPick(ev,stage,value){
  if(ev){ev.preventDefault();ev.stopPropagation()}
  const m=match(),d=serveDraft(m),el=ev?.currentTarget;
  trackingConfirmCell(el,()=>{
    if(stage==='firstPlacement')d.first.placement=value;
    else if(stage==='secondPlacement')d.second.placement=value;
    save();
    servePlacementNext(stage);
  });
}
function trackingOpenEditedPoint(last){
  const m=match();if(!m||!last)return;
  m.pending={
    winner:last.winner||null,
    kind:last.kind||null,
    shot:last.shot||null,
    serve:last.serve||null,
    errorType:last.errorType||null,
    returnSide:last.returnSide||null
  };
  m.court=last.court??null;
  m.rally=last.rally??null;
  m.serveDraft=last.serveDetail?JSON.parse(JSON.stringify(last.serveDetail)):null;
  save();

  if(isOwnReturnError(m,m.pending)&&!m.pending.returnSide){returnErrorSideMask();return}

  const sd=m.serveDraft;
  if(sd&&last.shot==='Aufschlag'&&last.kind==='winner'&&last.winner==='player'){
    const serveKey=last.serve==='second'?'second':'first';
    if(sd[serveKey]?.effect==='direct'){
      sd.stage=serveKey==='second'?'secondEffect':'firstEffect';
      sd.complete=false;
      save();serveCapture();return;
    }
  }
  if(sd&&last.shot==='Doppelfehler'){
    sd.stage='secondError';sd.complete=false;save();serveCapture();return;
  }
  if(m.mods.rally&&last.rally!==null&&last.rally!==undefined){rally();return}
  if(trackingPointUsesCourt(m,m.pending)&&last.court!==null&&last.court!==undefined){court();return}
  if(last.kind==='error'&&last.errorType){errorMask();return}
  renderPointStage('shot');
}
function trackingEditPreviousPoint(){
  const m=match();if(!m)return;
  if(!m.points.length){toast('Noch kein vorheriger Punkt vorhanden.');return}
  m.serveDraft=null;m.pending=null;m.court=null;m.rally=null;
  const last=m.points.pop();
  rebuild(m);
  trackingOpenEditedPoint(last);
}

function leave(saveIt,x){
  const m=match();
  if(saveIt&&m){
    m.status='nicht beendet';m.navParked=true;m.paused=true;state.currentMatchId=null;save()
  }else if(m){
    removeCurrentStoredMatch(m);state.currentMatchId=null;save()
  }
  document.querySelector('.modal')?.remove();go(x)
}

function formatBerlinDateTime(value=Date.now()){
  try{return new Intl.DateTimeFormat('de-DE',{timeZone:APP_TIME_ZONE,day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date(value))}catch(e){return '—'}
}
function diagnosticPlatform(){
  const ua=navigator.userAgent||'';
  if(/iPad|iPhone|iPod/i.test(ua))return 'iOS';
  if(/Android/i.test(ua))return 'Android';
  if(/Macintosh|Mac OS X/i.test(ua))return 'macOS / Web';
  if(/Windows/i.test(ua))return 'Windows / Web';
  return 'Web';
}
function diagnosticMatchCount(){
  const ids=new Set([...(state.matches||[]),...(state.matchArchive||[])].map(m=>m?.id).filter(Boolean));
  return ids.size;
}
function diagnosticStorageBytes(){
  try{const s=localStorage.getItem(KEY)||'';return typeof TextEncoder!=='undefined'?new TextEncoder().encode(s).length:s.length*2}catch(e){return 0}
}
function diagnosticStorageText(){
  const b=diagnosticStorageBytes();
  if(b<1024)return `${b} B`;
  if(b<1024*1024)return `${(b/1024).toFixed(1).replace('.',',')} KB`;
  return `${(b/1024/1024).toFixed(2).replace('.',',')} MB`;
}
function diagnosticText(){
  return [
    `MatchDNA Tennis ${APP_VERSION}`,
    `Build: ${APP_BUILD_TYPE}`,
    `Zugriff: ${INTERNAL_BETA_ACCESS?'Premium-Beta':planName()}`,
    `Plattform: ${diagnosticPlatform()}`,
    `Spielerprofile: ${(state.players||[]).length}`,
    `Lokal gespeicherte Matches: ${diagnosticMatchCount()}`,
    `Lokaler Speicher: ${diagnosticStorageText()}`,
    `Letzter technischer Fehler: ${lastTechnicalError?lastTechnicalError.time+' · '+lastTechnicalError.message:'Keiner in dieser Sitzung erfasst'}`
  ].join('\n');
}
function copyDiagnostics(){
  const value=diagnosticText();
  if(navigator.clipboard?.writeText){navigator.clipboard.writeText(value).then(()=>toast('Diagnosedaten kopiert.')).catch(()=>fallbackCopyDiagnostics(value));return}
  fallbackCopyDiagnostics(value);
}
function fallbackCopyDiagnostics(value){
  const ta=document.createElement('textarea');ta.value=value;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();

function savePlayerSettings(playerId){
  const n=document.getElementById('pn').value.trim(),by=document.getElementById('pby').value.trim();
  if(!n||!hand){toast('Name und Spielhand erforderlich.');return}
  if(by&&(!/^\d{4}$/.test(by)||Number(by)<1900||Number(by)>currentYear())){toast('Geburtsjahr prüfen.');return}
  const rules={startScore:document.getElementById('start').value,ad:document.getElementById('ad').value==='1',thirdSet:document.getElementById('third').value};
  let p=playerId==='new'?null:state.players.find(x=>x.id===playerId);
  if(!p&& !canCreateAnotherProfile()){toast('Das aktuelle Profil-Limit ist erreicht.');return}
  if(!p){
    p={id:id(),name:n,hand,birthYear:by?Number(by):null,rules};state.players.push(p);state.activePlayerId=p.id;
  }else{
    const oldName=p.name;
    [...state.matches,...(state.matchArchive||[])].forEach(m=>{if(!m.playerId&&m.player===oldName)m.playerId=p.id});
    p.name=n;p.hand=hand;p.birthYear=by?Number(by):null;p.rules=rules;
  }
  save();settings();
}

  const vhErr=devMetricSeries(matches,m=>focusMetricRaw(m,'vhError'));

  const ownErr=devOwnErrorSeries(matches);
  const vhRows=dev60OwnErrorRows(matches,'Vorhand');
  const rhRows=dev60OwnErrorRows(matches,'Rückhand');
  const v=dev581Percent(vhErr), r=dev581Percent(rhErr), o=dev581Percent(ownErr);

  let title='Eigenfehler aktuell ohne klare Schieflage';
  let sub='Vorhand- und Rückhandfehler liegen derzeit relativ nah beieinander.';
  if(v!==null && r!==null && Math.abs(v-r)>=10){
    const side=v>r?'Vorhand':'Rückhand';

function developmentReturnDetail(){
  const matches=devRecentMatches();

  const err=dev59ReturnErrorSeries(matches);

  const iv=dev581Percent(inPlay),wv=dev581Percent(win),av=dev581Percent(impact),ev=dev581Percent(err);
  const impactTrend=devTrend(impact,false);
  const errorTrend=devTrend(err,true);

  let title='Returnwirkung noch ohne klare Tendenz';
  let copy='Mit weiteren Matches wird sichtbar, ob der Return zunehmend direkte Wirkung erzeugt oder hauptsächlich sicher ins Spiel gebracht wird.';
  if(av!==null&&ev!==null){
    if(impactTrend.key==='up'&&errorTrend.key!=='down'){
      title='Die direkte Returnwirkung entwickelt sich positiv';
      copy=`Aktuell führen ${av}% der gegnerischen Aufschlagpunkte unmittelbar über den Return zu einem positiven Punktende.`;
    }else if(ev>=25){
      title='Returnfehler begrenzen aktuell die Wirkung';
      copy=`Die Returnfehlerquote liegt bei ${ev}%. Bevor mehr Druck entsteht, ist die Stabilität des ersten Kontakts ein wichtiger Hebel.`;
    }else if(av<=15&&ev<20){
      title='Der Return ist stabil, erzeugt aber noch wenig direkte Wirkung';
      copy=`Returnfehler sind mit ${ev}% eher begrenzt; direkte Returnwirkung entsteht aktuell bei ${av}% der gegnerischen Aufschlagpunkte.`;
    }else{
      title='Returnwirkung und Sicherheit sind aktuell relativ ausgeglichen';
      copy=`Direkte Returnwirkung liegt bei ${av}%, Returnfehler bei ${ev}%.`;

      )}
      ${dev591ReturnImpactCard(impact)}
    </div>

    <div class="card">

function saveDevelopmentSelection(){
  const ids=[...document.querySelectorAll('.dev-match-check:checked')].map(x=>x.value);

  }else if(stage==='kind'){
    context.push(p.winner==='player'?m.player:m.opponent);
    question=p.winner==='player'?'Wie wurde der Punkt gewonnen?':'Wie gewann die Gegnerin den Punkt?';

             <button class="${p.kind==='error'?'selected':''}" onclick="trackingPickKind('error',this)">${p.winner==='player'?'Gegnerfehler':pn+'-Fehler'}</button>`;
  }else{
    context.push(p.winner==='player'?m.player:m.opponent);
    context.push(p.kind==='winner'?'Winner':'Fehler');
    let label='',shotHtml='';
    if(p.kind==='error'){

        ? 'Nach welchem Schlag von '+pn+' machte die Gegnerin den Fehler?'

      if(p.winner==='player'){

        const arr=[['Aufschlag',playerIsServer&&!neutralServeRally],['Return',!playerIsServer],['Vorhand',true],['Rückhand',true],['Volley',true],['Doppelfehler',!playerIsServer]];
        shotHtml=arr.map(([x,active])=>active

        const arr=[['Aufschlag',false],['Return',!playerIsServer],['Vorhand',true],['Rückhand',true],['Volley',true],['Doppelfehler',playerIsServer&&!m.mods.serve]];
        shotHtml=arr.map(([x,active])=>active
          ? `<button class="${p.shot===x?'selected':''}" onclick="trackingShot('${x}',this)">${x}</button>`

      }
    }else{
      const winnerIsServer=p.winner===server;

      const inactiveShot=primaryShot==='Aufschlag'?'Return':'Aufschlag';
      const neutralOwnServeWinner=!!(p.winner==='player'&&server==='player'&&trackingNeutralServeRally(m));
      label=p.winner==='player'?'Welcher Schlag von '+pn+'?':'Welcher Schlag der Gegnerin?';
      if(neutralOwnServeWinner){
        shotHtml=`<button disabled class="v8-disabled">Aufschlag</button>`
          +['Vorhand','Rückhand','Volley'].map(x=>`<button class="${p.shot===x?'selected':''}" onclick="trackingShot('${x}',this)">${x}</button>`).join('')

        shotHtml=[primaryShot,'Vorhand','Rückhand','Volley'].map(x=>`<button class="${p.shot===x?'selected':''}" onclick="trackingShot('${x}',this)">${x}</button>`).join('')
          +`<button disabled class="v8-disabled">${inactiveShot}</button>`;
      }
    }
    question=label;choices=shotHtml;
  }

  const backAction=stage==='winner'?'trackingEditPreviousPoint()':`trackingBackPoint('${stage}')`;
  trackingShell(trackingMatchTitle(m),trackingScore(m)+`
    <div class="tracking-stage">
      ${context.length?`<div class="tracking-context">${context.map(x=>`<span class="tracking-context-chip">${esc(x)}</span>`).join('')}</div>`:''}
      <div class="tracking-question">${esc(question)}</div>

function serveDraft(m){

}

function servePlacementPick(ev,stage,value){
  if(ev){ev.preventDefault();ev.stopPropagation();}
  const m=match(),d=serveDraft(m);
  if(stage==='firstPlacement')d.first.placement=value;
  else if(stage==='secondPlacement')d.second.placement=value;
  save();

  // Auswahl nur sichtbar markieren. Kein Rendern, kein automatischer Maskenwechsel.
  document.querySelectorAll('[data-serve-zone]').forEach(b=>b.classList.remove('selected-cell'));
  const btn=ev?.currentTarget;
  if(btn)btn.classList.add('selected-cell');
}
function servePlacementNext(stage){
  const m=match(),d=serveDraft(m);
  const selected=stage==='firstPlacement'?d.first.placement:d.second.placement;
  if(!selected){toast('Bitte Platzierung auswählen.');return}
  if(stage==='firstPlacement'){
    d.first.side=serveSide(m);
    d.stage='firstEffect';
  }else{
    d.second.side=serveSide(m);
    d.stage='secondEffect';
  }
  save();
  serveCapture();
}

function trackingServeCaptureSet(el,stage,value){
  trackingConfirmButton(el,()=>serveCaptureSet(stage,value));
}
function serveCaptureSet(stage,value){
  const m=match(),d=serveDraft(m);
  if(stage==='firstOutcome'){
    if(value==='in'){d.first={in:true};d.stage='firstPlacement'}
    else{d.first={in:false};d.stage='firstError'}
  }else if(stage==='firstError'){
    d.first.errorType=value;d.stage='secondOutcome';
  }else if(stage==='secondOutcome'){
    if(value==='in'){d.second={in:true};d.stage='secondPlacement'}
    else{d.second={in:false};d.stage='secondError'}
  }else if(stage==='secondError'){
    d.second.errorType=value;d.complete=true;
    m.pending={winner:'opponent',kind:'error',shot:'Doppelfehler',serve:'second',errorType:value};
    save();finishPoint();return;
  }else if(stage==='firstPlacement'||stage==='secondPlacement'){
    // V29: Platzierung darf ausschließlich über servePlacementPick + WEITER erfolgen.
    return;
  }else if(stage==='firstEffect'){
    d.first.effect=value;d.complete=true;
    if(value==='direct'){
      m.pending={winner:'player',kind:'winner',shot:'Aufschlag',serve:'first',errorType:null};
      if(m.mods.rally)m.rally='1';
      save();finishPoint();return;
    }
  }else if(stage==='secondEffect'){
    d.second.effect=value;d.complete=true;
    if(value==='direct'){
      m.pending={winner:'player',kind:'winner',shot:'Aufschlag',serve:'second',errorType:null};
      if(m.mods.rally)m.rally='1';
      save();finishPoint();return;
    }
  }
  save();
  if(d.complete)point();else serveCapture();
}
function serveCaptureBack(){
  const m=match(),d=serveDraft(m);
  const prev={
    firstError:'firstOutcome',
    firstPlacement:'firstOutcome',
    firstEffect:'firstPlacement',
    secondOutcome:'firstError',
    secondError:'secondOutcome',
    secondPlacement:'secondOutcome',
    secondEffect:'secondPlacement'
  };
  if(prev[d.stage]){
    d.stage=prev[d.stage];
    save();serveCapture();return
  }
  m.serveDraft=null;save();trackingEditPreviousPoint();
}
function winner(x){const m=match();m.pending={winner:x,kind:null,shot:null,serve:null,errorType:null};save();point()}function kind(x){const m=match();m.pending={...m.pending,kind:x,shot:null,serve:null,errorType:null};save();point()}function shot(x){const m=match();m.pending={...m.pending,shot:x};save();point()}function serve(x){const m=match();m.pending={...m.pending,serve:x};save();point()}
function nextPoint(){const m=match(),p=m.pending;if(!p||!p.winner||!p.kind||!p.shot){toast('Bitte alle erforderlichen Angaben auswählen.');return}if(p.shot==='Doppelfehler')p.serve='second';if(p.kind==='error'){if(isOwnReturnError(m,p)&&!p.returnSide){returnErrorSideMask();return}errorMask();return}if(m.mods.court){court();return}if(m.mods.rally){rally();return}finishPoint()}function errorMask(){
  const m=match(),p=m.pending;
  trackingShell(trackingMatchTitle(m),trackingScore(m)+`<div class="tracking-stage"><div class="tracking-question">Welche Fehlerart?</div><div class="tracking-choice-grid">${['Netz','Seitenaus','Längenaus','Sonstiger Fehler'].map(x=>`<button class="${p.errorType===x?'selected':''}" onclick="trackingErrorPick('${x}',this)">${x}</button>`).join('')}</div><button class="${p.errorType==='ns'?'selected':''}" style="width:100%;margin-top:10px" onclick="trackingErrorPick('ns',this)">NICHT GESEHEN</button></div>${trackingFooter("trackingBackFromError()")}`)
}function errorPick(x){match().pending.errorType=x;save();errorMask()}function errorNext(){const m=match(),p=m.pending;if(!p.errorType){toast('Bitte Fehlerart auswählen.');return}
  // Gegnerfehler nach eigenem Aufschlag:

}

function cell(x){const m=match();m.court=x;save();court()}
function courtNext(){const m=match();if(m.court===null||m.court===undefined){toast('Bitte Feld auswählen oder Nicht gesehen.');return}m.mods.rally?rally():finishPoint()}
function rally(){
  const m=match(),p=m.pending;
  const neutralServeRally=trackingNeutralServeRally(m);
  const directWinner=!!(p&&p.kind==='winner'&&(p.shot==='Aufschlag'||p.shot==='Return'));
  if(directWinner&&!neutralServeRally){m.rally='1';save();finishPoint();return}

  const forcedServeReturnError=!!(p&&p.winner==='player'&&p.kind==='error'&&p.shot==='Aufschlag'&&serverForCurrentState(m)==='player');
  const forcedOpponentErrorAfterReturn=!!(p&&p.winner==='player'&&p.kind==='error'&&p.shot==='Return'&&serverForCurrentState(m)==='opponent');
  const forcedOwnReturnError=!!(p&&p.winner==='opponent'&&p.kind==='error'&&p.shot==='Return'&&serverForCurrentState(m)==='opponent');
  const forcedOneStroke=forcedServeReturnError||forcedOpponentErrorAfterReturn||forcedOwnReturnError;
  if(forcedOneStroke){
    m.rally='1';save();
    trackingShell(trackingMatchTitle(m),trackingScore(m)+`<div class="tracking-stage">
      <div class="tracking-question">Dauer des Ballwechsels (eigene Schlagzahl)</div>
      <div class="tracking-choice-grid">
        <button class="selected" onclick="trackingRallyPick('1',this)">1 Schlag</button>
        <button disabled class="v8-disabled">2–3 Schläge</button>
        <button disabled class="v8-disabled">4–6 Schläge</button>
        <button disabled class="v8-disabled">7+ Schläge</button>
      </div>
      <button disabled class="v8-disabled" style="width:100%;margin-top:10px">NICHT GESEHEN</button>
    </div>${trackingFooter("trackingBackFromRally()")}`);
    return;
  }

  if(neutralServeRally){
    if(!['2–3','4–6','7+','ns'].includes(m.rally))m.rally=null;
    save();
    trackingShell(trackingMatchTitle(m),trackingScore(m)+`<div class="tracking-stage">
      <div class="tracking-question">Dauer des Ballwechsels (eigene Schlagzahl)</div>
      <div class="tracking-choice-grid">
        <button disabled class="v8-disabled">1 Schlag</button>
        ${['2–3','4–6','7+'].map(x=>`<button class="${m.rally===x?'selected':''}" onclick="trackingRallyPick('${x}',this)">${x} Schläge</button>`).join('')}
      </div>
      <button class="${m.rally==='ns'?'selected':''}" style="width:100%;margin-top:10px" onclick="trackingRallyPick('ns',this)">NICHT GESEHEN</button>
    </div>${trackingFooter("trackingBackFromRally()")}`);
    return;
  }

  const opponentServeLaterMiaWinner=!!(
    p&&serverForCurrentState(m)==='opponent'&&p.winner==='player'&&p.kind==='winner'&&
    ['Vorhand','Rückhand','Volley'].includes(p.shot)
  );
  const opponentServeLaterMiaError=!!(
    p&&serverForCurrentState(m)==='opponent'&&p.winner==='opponent'&&p.kind==='error'&&
    ['Vorhand','Rückhand','Volley'].includes(p.shot)
  );
  const opponentServeMinTwoOwnStrokes=opponentServeLaterMiaWinner||opponentServeLaterMiaError;
  if(opponentServeMinTwoOwnStrokes){
    if(!['2–3','4–6','7+','ns'].includes(m.rally))m.rally=null;
    save();
    trackingShell(trackingMatchTitle(m),trackingScore(m)+`<div class="tracking-stage">
      <div class="tracking-question">Dauer des Ballwechsels (eigene Schlagzahl)</div>
      <div class="tracking-choice-grid">
        <button disabled class="v8-disabled">1 Schlag</button>
        ${['2–3','4–6','7+'].map(x=>`<button class="${m.rally===x?'selected':''}" onclick="trackingRallyPick('${x}',this)">${x} Schläge</button>`).join('')}
      </div>
      <button class="${m.rally==='ns'?'selected':''}" style="width:100%;margin-top:10px" onclick="trackingRallyPick('ns',this)">NICHT GESEHEN</button>
    </div>${trackingFooter("trackingBackFromRally()")}`);
    return;
  }

  trackingShell(trackingMatchTitle(m),trackingScore(m)+`<div class="tracking-stage"><div class="tracking-question">Dauer des Ballwechsels (eigene Schlagzahl)</div><div class="tracking-choice-grid">${['1','2–3','4–6','7+'].map(x=>`<button class="${m.rally===x?'selected':''}" onclick="trackingRallyPick('${x}',this)">${x} Schläge</button>`).join('')}</div><button class="${m.rally==='ns'?'selected':''}" style="width:100%;margin-top:10px" onclick="trackingRallyPick('ns',this)">NICHT GESEHEN</button></div>${trackingFooter("trackingBackFromRally()")}`)
}

function rallyPick(x){match().rally=x;save();rally()}function rallyNext(){if(!match().rally){toast('Bitte Ballwechseldauer wählen.');return}finishPoint()}
function finishPoint(){const m=match(),p=m.pending;const serveDetail=m.serveDraft?.complete?JSON.parse(JSON.stringify(m.serveDraft)):null;m.points.push({...p,court:m.court??null,rally:m.rally??null,serveDetail});if(m.tiebreak){const i=p.winner==='player'?0:1;m.tiebreakPoints[i]++;const total=m.tiebreakPoints[0]+m.tiebreakPoints[1];const wasMatchTiebreak=!!m.matchTiebreak;const target=wasMatchTiebreak?10:7;if((m.tiebreakPoints[i]>=target&&m.tiebreakPoints[i]-m.tiebreakPoints[1-i]>=2)){const tbFinal=[m.tiebreakPoints[0],m.tiebreakPoints[1]];const finishedSetIndex=Math.max(0,(m.currentSet||1)-1);if(wasMatchTiebreak){m.completedSets.push(tbFinal)}else{const setFinal=i===0?[7,6]:[6,7];m.completedSets.push(setFinal);m.completedSetTiebreaks=m.completedSetTiebreaks||[];m.completedSetTiebreaks[finishedSetIndex]=tbFinal;m.setGames=m.setGames||[[0,0],[0,0],[0,0]];m.setGames[finishedSetIndex]=setFinal}m.sets[i]++;m.currentSet++;
const nextStart=wasMatchTiebreak?[0,0]:normalSetStartGames(m);
m.games=[...nextStart];
m.gamePoints=[0,0];
if(!wasMatchTiebreak){
  m.setGames=m.setGames||[[0,0],[0,0],[0,0]];
  m.setGames[m.currentSet-1]=[...nextStart];
}
m.tiebreak=false;m.tiebreakPending=false;m.matchTiebreak=false;m.tiebreakPoints=[0,0];
if(!wasMatchTiebreak){
  m.server=m.server==='player'?'opponent':'player';
  if(m.sets[0]===1&&m.sets[1]===1&&matchRules(m).thirdSet==='match-tiebreak'){
    m.currentSet=3;m.games=[0,0];m.gamePoints=[0,0];m.setGames[2]=[0,0];
    m.tiebreak=true;m.matchTiebreak=true;m.tiebreakPending=false;m.tiebreakPoints=[0,0]
  }
}}else{if(total%2===1)m.server=m.server==='player'?'opponent':'player'}}else{addPoint(m,p.winner)}m.pending=null;m.court=null;m.rally=null;m.serveDraft=null;if(m.sets[0]>=2||m.sets[1]>=2){m.finished=true;m.status='beendet';m.completedAt=Date.now();state.currentMatchId=null;save();finishView(m);return}save();point()}

function normalSetStartGames(m){
  if(Array.isArray(m?.startGames)&&m.startGames.length===2)return [...m.startGames];
  const configured=String(matchRules(m).startScore||'0:0').split(':').map(Number);
  return configured.length===2&&configured.every(Number.isFinite)?configured:[0,0];
}
function addPoint(m,w){

    if(g[i]===4){game(m,i);return}
    g[0]=3;g[1]=3;return
  }
  g[i]++;if(g[i]>=4&&g[i]>g[o])game(m,i)

function game(m,i){m.games[i]++;if(!m.setGames)m.setGames=[[0,0],[0,0],[0,0]];m.setGames[m.currentSet-1]=[...m.games];m.gamePoints=[0,0];m.server=m.server==='player'?'opponent':'player';if(m.games[i]>=6&&m.games[i]-m.games[1-i]>=2)setWon(m,i);else if(m.games[0]===6&&m.games[1]===6){m.tiebreakPending=true;m.tiebreak=true;m.tiebreakPoints=[0,0]}}function setWon(m,i){

function scoreSnapshot(m){
  return {
    sets:[...(m.sets||[0,0])],
    currentSet:m.currentSet||1,
    completedSets:(m.completedSets||[]).map(x=>[...x]),
    setGames:(m.setGames||[[0,0],[0,0],[0,0]]).map(x=>[...(x||[0,0])]),
    games:[...(m.games||[0,0])],
    gamePoints:[...(m.gamePoints||[0,0])],
    tiebreak:!!m.tiebreak,
    matchTiebreak:!!m.matchTiebreak,
    tiebreakPoints:[...(m.tiebreakPoints||[0,0])],
    server:m.server||null

}
function snapshotKey(s){
  return JSON.stringify({
    sets:s.sets,currentSet:s.currentSet,completedSets:s.completedSets,setGames:s.setGames,
    games:s.games,gamePoints:s.gamePoints,tiebreak:s.tiebreak,matchTiebreak:s.matchTiebreak,
    tiebreakPoints:s.tiebreakPoints

}
function snapshotScoreText(s){

  if(s.tiebreak)return `Sätze ${s.sets[0]}:${s.sets[1]} · Spiele ${s.games[0]}:${s.games[1]} · TB ${s.tiebreakPoints[0]}:${s.tiebreakPoints[1]}`;

  const p0=gp[0]>=4?'AD':names[Math.min(gp[0],3)],p1=gp[1]>=4?'AD':names[Math.min(gp[1],3)];

}
function registerCaptureGap(m,before,after){
  if(snapshotKey(before)===snapshotKey(after))return;
  m.captureGaps=m.captureGaps||[];
  const pointIndex=(m.points||[]).length;
  const lastPause=(m.pauseSnapshots||[]).slice().reverse().find(x=>x.pointIndex===pointIndex);
  const existing=m.captureGaps.find(g=>g.pointIndex===pointIndex&&snapshotKey(g.after)===snapshotKey(after));
  if(!existing)m.captureGaps.push({
    pointIndex,
    before:lastPause?.state||before,
    after,
    label:`Erfassungslücke · weiter bei ${snapshotScoreText(after)}`,
    ts:Date.now()

}
function pauseCapture(){const m=match();if(!m)return;

function inferServer(m,setNo){
  if(m.server) return m.server;
  const first=m.setFirstServers?.[setNo-1]||m.firstServer;
  if(!first) return null;
  const games=(m.setGames?.[setNo-1]||m.games||[0,0]);
  const gamesPlayed=(games[0]||0)+(games[1]||0);
  if(m.tiebreak){
    const total=(m.tiebreakPoints?.[0]||0)+(m.tiebreakPoints?.[1]||0);
    if(total===0) return first;
    return total===1 ? (first==='player'?'opponent':'player') : (total%2===0 ? (first==='player'?'opponent':'player') : first);
  }
  return gamesPlayed%2===0 ? first : (first==='player'?'opponent':'player');
}

function normalizedCompletedSet(m,i){
  const cs=m.completedSets?.[i];
  const sg=m.setGames?.[i];
  const tb=m.completedSetTiebreaks?.[i];

  // New-format data: a recorded set tiebreak always represents a 7:6 / 6:7 set.
  if(tb){
    return Number(tb[0])>Number(tb[1]) ? [7,6] : [6,7];
  }

  // Migration for older matches: the set was at 6:6 and the stored
  // "completedSets" value is actually the tie-break score.
  if(sg && Number(sg[0])===6 && Number(sg[1])===6 && cs){
    if(Number(cs[0])>Number(cs[1])) return [7,6];
    if(Number(cs[1])>Number(cs[0])) return [6,7];
  }

  // Another legacy pattern: impossible normal set results such as 7:0..7:4
  // were previously tie-break scores. Normalize only unambiguous cases.
  if(cs){
    const a=Number(cs[0]),b=Number(cs[1]);
    if(a===7 && b>=0 && b<=4) return [7,6];
    if(b===7 && a>=0 && a<=4) return [6,7];

}
function correctionMaxSet(m){

function correctionIsFinalScore(s0,s1){

function scoreCorrection(){
  const m=match();
  if(!m)return;
  const gp=m.gamePoints||[0,0];
  const setNo=Math.min(3,Math.max(1,m.currentSet||m.sets[0]+m.sets[1]+1));

        <select id="rcurrentset" class="input"></select>
      </div>

      <div id="correctionSets"></div>

      <div id="normalPointCorrection">

        <div class="grid">
          <select id="rp0" class="input"><option>0</option><option>15</option><option>30</option><option>40</option><option>AD</option></select>
          <select id="rp1" class="input"><option>0</option><option>15</option><option>30</option><option>40</option><option>AD</option></select>

      </div>

          <button id="rsrvo" class="${m.server==='opponent'?'selected':''}" onclick="pickResumeServer('opponent')">🎾 ${esc(m.opponent)}</button>
        </div>
      </div>

      <button id="correctionActionBtn" class="primary" style="margin-top:14px" onclick="applyScoreCorrection()">STAND ÜBERNEHMEN UND FORTSETZEN</button>
    </div>`,
  );

  document.getElementById('rs0').onchange=updateCorrectionSetOptions;
  document.getElementById('rs1').onchange=updateCorrectionSetOptions;
  document.getElementById('rcurrentset').onchange=()=>renderCorrectionSetFields(m,Number(document.getElementById('rcurrentset').value));

    document.getElementById('rcurrentset').value=String(setNo);

    if(!isMTB){

function pickResumeServer(x){match().server=x;document.getElementById('rsrvp').classList.toggle('selected',x==='player');document.getElementById('rsrvo').classList.toggle('selected',x==='opponent');save()}
function applyScoreCorrection(){
  const m=match(),beforeCorrection=scoreSnapshot(m),map={'0':0,'15':1,'30':2,'40':3,'AD':4};
  const setNo=+document.getElementById('rcurrentset').value;
  const s0=+document.getElementById('rs0').value;
  const s1=+document.getElementById('rs1').value;

  if(!Number.isInteger(s0)||!Number.isInteger(s1)||s0<0||s1<0||s0>2||s1>2){
    toast('Bitte gültigen Satzstand eingeben.');
    return;
  }

  if(correctionIsFinalScore(s0,s1)){
    const count=(s0===2&&s1===1)||(s0===1&&s1===2)?3:2;
    const finals=[];
    for(let i=0;i<count;i++){
      const a=Number(document.getElementById('rfinal'+i+'p')?.value);
      const b=Number(document.getElementById('rfinal'+i+'o')?.value);
      if(!Number.isInteger(a)||!Number.isInteger(b)){
        toast('Bitte alle Satzergebnisse vollständig erfassen.');
        return;
      }
      finals.push([a,b]);
    }

    // Basic consistency check: the entered set winners must match the final set score.
    let wp=0,wo=0;
    finals.forEach((v,i)=>{
      if(i===2&&matchRules(m).thirdSet==='match-tiebreak'){
        if(v[0]>v[1])wp++;else if(v[1]>v[0])wo++;
      }else{
        if(v[0]>v[1])wp++;else if(v[1]>v[0])wo++;
      }
    });
    if(wp!==s0||wo!==s1){
      toast('Satzergebnisse passen nicht zum eingegebenen Satzstand.');
      return;
    }

    m.sets=[s0,s1];
    m.completedSets=finals.map(v=>[...v]);
    m.manualSets=finals.map(v=>[...v]);
    m.setGames=m.setGames||[[0,0],[0,0],[0,0]];
    finals.forEach((v,i)=>{
      if(!(i===2&&matchRules(m).thirdSet==='match-tiebreak'))m.setGames[i]=[...v];
    });
    m.games=finals[finals.length-1]?[...finals[finals.length-1]]:[0,0];
    m.gamePoints=[0,0];
    m.tiebreak=false;
    m.matchTiebreak=false;
    m.tiebreakPending=false;
    m.tiebreakPoints=[0,0];
    m.finished=true;
    m.status='beendet';
    m.paused=false;
    m.navParked=false;
    registerCaptureGap(m,beforeCorrection,scoreSnapshot(m));
    state.currentMatchId=null;
    save();
    finishView(m);
    return;
  }

  if(!m.setGames) m.setGames=[[0,0],[0,0],[0,0]];
  m.sets=[s0,s1];
  m.currentSet=setNo;
  m.completedSets=[];

  for(let i=0;i<setNo-1;i++){
    const a=+document.getElementById('rcg'+i+'p').value;
    const b=+document.getElementById('rcg'+i+'o').value;
    if(!Number.isInteger(a)||!Number.isInteger(b)){
      toast('Bitte alle beendeten Sätze vollständig erfassen.');
      return;
    }
    m.completedSets.push([a,b]);
    m.setGames[i]=[a,b];
  }

  const isMTB=setNo===3&&matchRules(m).thirdSet==='match-tiebreak'&&s0===1&&s1===1;

  if(isMTB){
    const a=+document.getElementById('rcmtp').value;
    const b=+document.getElementById('rcmto').value;
    if(!Number.isInteger(a)||!Number.isInteger(b)||a<0||b<0){
      toast('Bitte gültigen Match-Tie-Break-Stand eingeben.');
      return;
    }
    m.games=[0,0];
    m.setGames[2]=[0,0];
    m.gamePoints=[0,0];
    m.tiebreak=true;
    m.matchTiebreak=true;
    m.tiebreakPending=false;
    m.tiebreakPoints=[a,b];
  }else{
    const cg0=+document.getElementById('rcgp').value;
    const cg1=+document.getElementById('rcgo').value;

    if(!Number.isInteger(cg0)||!Number.isInteger(cg1)){
      toast('Bitte Spiele des aktuellen Satzes erfassen.');
      return;
    }

    m.setGames[setNo-1]=[cg0,cg1];
    m.games=[cg0,cg1];

    const isSetTB=cg0===6&&cg1===6;

    if(isSetTB){
      const a=+document.getElementById('rcstbp').value;
      const b=+document.getElementById('rcstbo').value;
      if(!Number.isInteger(a)||!Number.isInteger(b)||a<0||b<0){
        toast('Bitte gültigen Satz-Tie-Break-Stand eingeben.');
        return;
      }
      m.gamePoints=[0,0];
      m.tiebreak=true;
      m.matchTiebreak=false;
      m.tiebreakPending=true;
      m.tiebreakPoints=[a,b];
    }else{
      m.gamePoints=[
        map[document.getElementById('rp0').value],
        map[document.getElementById('rp1').value]
      ];
      m.tiebreak=false;
      m.matchTiebreak=false;
      m.tiebreakPending=false;
      m.tiebreakPoints=[0,0];
    }
  }

  if(!m.server){
    toast('Bitte Aufschläger auswählen.');
    return;
  }

  m.paused=false;
  m.navParked=false;

    month:'2-digit',
    year:'numeric'
  }).format(d);

function matchTimestamp(m){
  if(Number.isFinite(Number(m?.createdAt)))return Number(m.createdAt);
  // Alte Matches hatten noch keinen sicheren Zeitstempel.
  // Ihre Reihenfolge wird deshalb über die gespeicherte Match-Reihenfolge bestimmt.
  return 0;
}
function analysisSort(matches){
  return [...matches].sort((a,b)=>{
    const ta=matchTimestamp(a),tb=matchTimestamp(b);
    if(tb!==ta)return tb-ta;
    return state.matches.indexOf(b)-state.matches.indexOf(a);
  });
}
function latestFinishedMatchId(){
  const visible=visiblePlayerMatches(),finished=analysisSort(visible.filter(m=>m.finished));
  return finished[0]?.id||analysisSort(visible)[0]?.id||null;
}
function analysisCapabilities(m){
  const pts=m?.points||[];
  return {
    match:pts.length>0,
    flow:pts.length>0||(m.captureGaps||[]).length>0,
    strokes:pts.some(p=>['Vorhand','Rückhand','Volley'].includes(p.shot)),
    court:typeof placementSuccessRows==='function'&&placementSuccessRows(m).length>0,
    rally:pts.some(p=>p.rally&&p.rally!=='ns'),
    serve:typeof serveRows==='function'&&serveRows(m).length>0,
    errors:pts.some(p=>p.winner==='opponent'&&p.kind==='error'&&['Vorhand','Rückhand','Return','Volley'].includes(p.shot)&&DEV60_ERROR_TYPES.includes(p.errorType))
  };

function matchOverviewInsights(m){
  const rows=matchOverviewRows(m),n=rows.length;
  if(!n)return [];
  const ownWinner=rows.filter(p=>p.winner==='player'&&p.kind==='winner').length;
  const oppErr=rows.filter(p=>p.winner==='player'&&p.kind==='error').length;
  const oppWinner=rows.filter(p=>p.winner==='opponent'&&p.kind==='winner').length;
  const ownErr=rows.filter(p=>p.winner==='opponent'&&p.kind==='error').length;
  const positive=ownWinner+oppErr,lost=ownErr+oppWinner,notes=[];

  if(positive>lost)notes.push({
    tone:'plus',
    fact:`${positive} Punkte gingen über eigene Winner oder Fehler der Gegnerin an ${m.player}.`,
    interp:`${m.player} hat das Spiel damit stark selbst geprägt. Nicht jeder Gegnerfehler muss dabei erzwungen gewesen sein.`
  });
  else if(positive<lost)notes.push({
    tone:'minus',
    fact:`${lost} verlorenen Punktentscheidungen stehen ${positive} positiv endende Punkte gegenüber.`,
    interp:`In diesem Match reichte die eigene Wirkung noch nicht aus, um die verlorenen Punkte auszugleichen.`
  });
  else notes.push({
    tone:'balance',
    fact:`Positive und negative Punktentscheidungen sind mit ${positive}:${lost} ausgeglichen.`,
    interp:`Das Match zeigt damit kein klares Übergewicht bei der Art, wie die Punkte entschieden wurden.`
  });

  if(positive>ownErr&&ownErr>oppWinner)notes.push({
    tone:'alert',
    fact:`${ownErr} Punkte gingen durch eigene Fehler verloren.`,
    interp:`Trotz guter Wirkung ist das die größte sichtbare Baustelle. Ziel wäre nicht weniger offensiv zu spielen, sondern die vorhandene Wirkung mit weniger eigenen Fehlern zu behalten.`
  });
  else if(positive>ownErr)notes.push({
    tone:'plus',
    fact:`Die positive Wirkung ist deutlich größer als die Zahl der eigenen Fehler.`,
    interp:`Das ist ein effizientes Matchbild. Andere Baustellen können deshalb zunächst wichtiger sein.`
  });
  else if(ownErr>positive)notes.push({
    tone:'minus',
    fact:`Die eigenen Fehler (${ownErr}) übersteigen die positiv endenden Punkte (${positive}).`,
    interp:`Hier liegt die deutlichste Begrenzung im Match: Es geht zu viel Wirkung durch eigene Fehler verloren.`
  });
  else notes.push({
    tone:'balance',
    fact:`Positive Wirkung und eigene Fehler liegen gleichauf.`,
    interp:`Aus diesem Match allein ergibt sich daraus noch keine klare Priorität.`
  });

  if(oppWinner<=Math.max(1,Math.round(lost*.15))&&ownErr>oppWinner)notes.push({
    tone:'alert',
    fact:`Die Gegnerin erzielte nur ${oppWinner} ${oppWinner===1?'direkten Winner':'direkte Winner'}.`,
    interp:`These für dieses Match: Sie konnte ${m.player} nur selten direkt ausspielen; viele verlorene Punkte endeten vorher durch eigene Fehler.`
  });
  else if(oppWinner>ownErr)notes.push({
    tone:'alert',
    fact:`Die Gegnerin erzielte mehr direkte Winner (${oppWinner}) als ${m.player} eigene Fehler machte (${ownErr}).`,
    interp:`These für dieses Match: Die Gegnerin konnte selbst viel Wirkung erzeugen. Gegnerqualität, eigene Ballqualität oder Feldabdeckung können dabei eine Rolle spielen.`
  });
  else notes.push({
    tone:'balance',
    fact:`Eigene Fehler und Gegner-Winner liegen bei den verlorenen Punkten relativ nah beieinander.`,
    interp:`Es gibt damit keinen einzelnen klaren Grund, wie die verlorenen Punkte entstanden.`
  });
  return notes.slice(0,3);
}

function strokeDecisionRows(m,shot){

    (p.winner==='player'&&p.kind==='winner')||

}

  const w=rows.filter(p=>p.winner==='player'&&p.kind==='winner').length;
  const ge=rows.filter(p=>p.winner==='player'&&p.kind==='error').length;
  const e=rows.filter(p=>p.winner==='opponent'&&p.kind==='error').length;

}

function strokeImpactInsight(stats){
  const valid=stats.filter(s=>s.n);
  const total=valid.reduce((a,b)=>a+b.n,0);
  if(total<6)return {fact:`Kleine Stichprobe (n=${total}): Die Schlagwirkung ist noch nicht belastbar einzuordnen.`,interp:'Noch keine Schlagseite als Stärke oder Baustelle festlegen.'};
  const eligible=valid.filter(s=>s.n>=3).sort((a,b)=>b.eff-a.eff||b.n-a.n);
  if(eligible.length>=2&&eligible[0].eff-eligible[1].eff>=15){
    const a=eligible[0],b=eligible[1];
    return {fact:`${a.shot} hat die stärkste positive Punktwirkung: ${a.eff}% gegenüber ${b.eff}% bei ${b.shot}.`,interp:`Das spricht für eine klare ${a.shot}-Stärke in diesem Match. Die schwächere Seite kann tatsächlich weniger wirksam sein, aber auch häufiger aus schwierigeren Situationen gespielt worden sein. Die starke Seite sollte nicht künstlich nivelliert werden.`};
  }
  return {fact:'Bei der positiven Punktwirkung hebt sich keine Schlagseite klar ab.',interp:'Das spricht für ein ausgeglicheneres Schlagprofil; daraus ergibt sich aktuell keine klare Priorität allein aus VH/RH.'};
}
function strokeBalanceInsight(stats){
  const valid=stats.filter(s=>s.n>=3);
  if(!valid.length)return {fact:'Noch zu wenige punktentscheidende Aktionen für eine belastbare Schlagbilanz.',interp:'Keine Entwicklungspriorität aus diesem Block ableiten.'};
  const weak=[...valid].sort((a,b)=>a.eff-b.eff)[0];
  if(weak.eff<40)return {fact:`${weak.shot} fällt in der Bilanz auf: Positive Punktentscheidungen sind seltener als eigene Fehler.`,interp:'Das kann auf geringere Wirkung oder höhere Fehleranfälligkeit hindeuten. Mögliche Ursachen sind unter anderem Technik, Risiko, Positionierung oder schwierigere Spielsituationen; die Matchdaten unterscheiden das nicht.'};
  return {fact:'Keine Schlagseite zeigt aktuell eine klar negative Bilanz.',interp:'Die vorhandenen Schlagseiten wirken in den punktentscheidenden Aktionen insgesamt tragfähig; andere Baustellen können vorerst wichtiger sein.'};
}
function strokeDir(m,shot,court){
  if(!Number.isInteger(court)||court<0||court>8)return null;
  const col=court%3,row=Math.floor(court/3);
  const depth=['kurz','mittel','tief'][row];
  if(col===1)return {dir:'Mitte',depth};
  const right=col===2,hand=m.playerHand||'Rechts';
  let cross=false;
  if(hand==='Rechts')cross=shot==='Vorhand'?right:!right;
  else cross=shot==='Vorhand'?!right:right;
  return {dir:cross?'Cross':'Longline',depth};
}
function strokeInsights(m){
  const shots=['Vorhand','Rückhand','Volley'],notes=[];
  const ss=shots.map(s=>({name:s,shot:s,...strokeStats(m,s)})).filter(x=>x.n);
  const total=ss.reduce((a,b)=>a+b.n,0);
  if(ss.length){
    if(total<6){
      notes.push(`Kleine Stichprobe (n=${total}): noch keine belastbare Schlagstärke ableitbar.`);
    }else{
      const sorted=[...ss].sort((a,b)=>b.eff-a.eff||b.n-a.n);
      const best=sorted[0],second=sorted[1];
      const lead=second?best.eff-second.eff:best.eff;
      if(best.n>=3&&lead>=15)notes.push(`${best.shot} ist bei punktentscheidenden Schlägen auffällig effizient: ${best.eff}% positiv (${best.w} Winner, ${best.e} Fehler).`);
      else notes.push('Ausgeglichenes Schlagbild: keine Schlagseite hebt sich bei den punktentscheidenden Aktionen klar ab.');
    }
  }

  const ground=['Vorhand','Rückhand'];
  const dirs=[];
  ground.forEach(shot=>{
    const winners=(m.points||[]).filter(p=>p.winner==='player'&&p.kind==='winner'&&p.shot===shot&&Number.isInteger(p.court));
    ['Cross','Mitte','Longline'].forEach(dir=>{
      const n=winners.filter(p=>strokeDir(m,shot,p.court)?.dir===dir).length;
      if(n)dirs.push({name:`${shot} ${dir.toLowerCase()}`,n});
    });
  });
  const dirTotal=dirs.reduce((a,b)=>a+b.n,0);
  if(dirTotal>=6){
    const a=patternAssessment(dirs,dirTotal);
    if(a.level==='tendency'||a.level==='clear')notes.push(`${a.level==='clear'?'Klares':'Leichtes'} Winner-Muster: ${a.top.name} tritt am häufigsten auf (${a.share}%, n=${a.top.n}).`);
  }

  const rallyData=[];
  ground.forEach(shot=>{
    const rows=strokeDecisionRows(m,shot).filter(p=>p.rally&&p.rally!=='ns');
    ['1','2–3','4–6','7+'].forEach(r=>{
      const a=rows.filter(p=>p.rally===r);
      if(a.length>=3){
        const w=a.filter(p=>p.winner==='player'&&p.kind==='winner').length;
        rallyData.push({shot,r,n:a.length,eff:pct(w,a.length)});
      }
    });
  });
  if(rallyData.length>=2){
    const sorted=[...rallyData].sort((a,b)=>a.eff-b.eff||b.n-a.n);
    const low=sorted[0],next=sorted[1];
    if(low.eff<50&&next&&next.eff-low.eff>=15)notes.push(`${low.shot} ist bei ${low.r} eigenen Schlägen auffällig: ${low.eff}% der punktentscheidenden Aktionen enden positiv (n=${low.n}).`);
  }
  return notes.slice(0,3);
}

function strokeCourtInsight(m){
  const rows=(m.points||[]).filter(p=>p.winner==='player'&&['winner','error'].includes(p.kind)&&Number.isInteger(p.court)&&['Vorhand','Rückhand'].includes(p.shot));
  if(rows.length<6)return {fact:`Kleine Stichprobe (n=${rows.length}): Noch kein belastbares Platzierungsmuster.`,interp:'Richtung und Tiefe vorerst nur beschreiben, nicht bewerten.'};
  const dirs=['Cross','Mitte','Longline'].map(name=>({name,n:rows.filter(p=>strokeDir(m,p.shot,p.court)?.dir===name).length}));
  const a=patternAssessment(dirs,rows.length);
  if(a.level==='tendency'||a.level==='clear')return {fact:`${a.top.name} dominiert bei den punkterzeugenden Grundschlägen (${a.share}%).`,interp:'Das ist zunächst ein erfolgreich sichtbares Spielmuster, keine Erfolgsquote dieser Richtung. Eine dominante Richtung kann eine Stärke sein; erst über mehrere Matches wird relevant, ob zusätzliche erfolgreiche Optionen fehlen.'};
  return {fact:'Die punkterzeugenden Grundschläge sind in der Richtung weitgehend ausgeglichen.',interp:'Es gibt in diesem Match keine starke Richtungsdominanz unter den positiv endenden Bällen.'};
}
function strokeRallyInsight(m){
  const data=[];
  ['Vorhand','Rückhand'].forEach(shot=>['1','2–3','4–6','7+'].forEach(r=>{
    const a=strokeDecisionRows(m,shot).filter(p=>p.rally===r);
    if(a.length>=3){const pos=a.filter(p=>p.winner==='player').length;data.push({shot,r,n:a.length,rate:pct(pos,a.length)})}
  }));
  if(data.length<2)return {fact:'Noch zu wenige Daten, um die Schlagwirkung nach Ballwechsellänge sinnvoll zu vergleichen.',interp:'Noch keine Aussage darüber treffen, ob eine Schlagseite nur früh oder auch in längeren Rallys trägt.'};
  const hi=[...data].sort((a,b)=>b.rate-a.rate)[0],lo=[...data].sort((a,b)=>a.rate-b.rate)[0];
  if(hi.rate-lo.rate>=20)return {fact:`${hi.shot} bei ${hi.r} eigenen Schlägen zeigt die höchste positive Punktwirkung (${hi.rate}%), ${lo.shot} bei ${lo.r} die niedrigste (${lo.rate}%).`,interp:'Das kann auf eine unterschiedliche Rolle des Schlages im Punkt hindeuten: frühe Initiative, Rallystabilität oder situative Belastung. Die Daten zeigen das Muster, nicht die Ursache.'};
  return {fact:'Die positive Schlagwirkung verändert sich über die erfassten Ballwechsellängen nicht deutlich.',interp:'Die Schlagwirkung wirkt über verschiedene Punktlängen relativ stabil.'};
}
function strokeDirectionBlock(m,shot){
  const winners=(m.points||[]).filter(p=>p.winner==='player'&&['winner','error'].includes(p.kind)&&p.shot===shot&&Number.isInteger(p.court));

  const dirs=['Cross','Mitte','Longline'],depths=['kurz','mittel','tief'];

    <div class="serve-side"><table class="stroke-table"><thead><tr><th>Schlag</th><th>1</th><th>2–3</th><th>4–6</th><th>7+</th></tr></thead><tbody>

function dev601ErrorCountSeries(matches,shot=null,returnSide=null,errorType=null){
  return (matches||[]).map(m=>{
    const value=(m?.points||[]).filter(p=>
      p.winner==='opponent'&&p.kind==='error'&&
      (!shot||p.shot===shot)&&
      (!returnSide||p.returnSide===returnSide)&&
      (!errorType||p.errorType===errorType)
    ).length;
    return {match:m,value};
  });
}
function dev601CountAverage(series){
  if(!series||!series.length)return null;
  return series.reduce((s,x)=>s+(Number(x.value)||0),0)/series.length;
}
function dev601CountTrend(series){
  if(!series||series.length<4)return {key:'none',label:series?.length===3?'Erste Tendenz möglich':'Noch zu wenig Verlauf',delta:null};
  const vals=series.map(x=>Number(x.value)||0);
  const half=Math.floor(vals.length/2);
  const mean=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:0;
  const early=mean(vals.slice(0,half));
  const recent=mean(vals.slice(half));
  const diff=recent-early;
  const tolerance=Math.max(0.35,Math.max(early,recent)*0.15);
  if(Math.abs(diff)<=tolerance)return {key:'stable',label:'Fehlerzahl weitgehend stabil',delta:diff};
  return diff<0
    ? {key:'up',label:'Fehler nehmen ab',delta:diff}
    : {key:'down',label:'Fehler nehmen zu',delta:diff};
}
function dev601CountTrendPill(series){
  const t=dev601CountTrend(series);
  const delta=t.delta===null?'':` · ${t.delta>0?'+':''}${dev59Decimal(t.delta)}/Match`;
  return `<span class="dev581-pill ${t.key}">${esc(devTrendSymbol(t.key))} ${esc(t.label)}${esc(delta)}</span>`;
}
function dev601CountSparkline(series){
  if(!series||!series.length)return `<div class="dev58-empty-line">Noch keine Verlaufsdaten</div>`;
  const vals=series.map(x=>Math.max(0,Number(x.value)||0));
  const w=240,h=54,p=6;
  const max=Math.max(1,...vals);
  const hi=Math.max(1,max*1.18);
  const pts=vals.map((v,i)=>{
    const x=vals.length===1?w/2:p+i*(w-2*p)/(vals.length-1);
    const y=h-p-(v/hi)*(h-2*p);
    return [x,y];
  });
  const d=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  let trend='';
  if(vals.length>=2){
    const n=vals.length;
    const sx=(n-1)*n/2;
    const sy=vals.reduce((a,b)=>a+b,0);
    const sxx=(n-1)*n*(2*n-1)/6;
    const sxy=vals.reduce((s,v,i)=>s+i*v,0);
    const den=n*sxx-sx*sx;
    const slope=den?(n*sxy-sx*sy)/den:0;
    const intercept=(sy-slope*sx)/n;
    const clamp=v=>Math.max(0,Math.min(hi,v));
    const a=clamp(intercept),b=clamp(intercept+slope*(n-1));
    const y1=h-p-(a/hi)*(h-2*p);
    const y2=h-p-(b/hi)*(h-2*p);
    trend=`<line x1="${p}" y1="${y1.toFixed(1)}" x2="${w-p}" y2="${y2.toFixed(1)}" class="dev601-count-spark-trend"/>`;
  }
  return `<svg class="dev601-count-spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <line x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}" class="dev601-count-spark-axis"/>
    <path d="${d}" class="dev601-count-spark-line"/>
    ${trend}
    ${pts.map(q=>`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="2.6"/>`).join('')}
  </svg>`;
}
function dev601CountTrendBlock(series){
  if(!series||!series.length)return '';
  const avg=dev601CountAverage(series);
  const first=series[0]?.match,last=series[series.length-1]?.match;
  return `<div class="dev601-count-trend">
    <div class="dev601-count-trend-head">
      <div class="dev601-count-trend-title">Fehler pro Match im Verlauf</div>
      <div class="dev601-count-trend-value">Ø ${dev59Decimal(avg)} / Match</div>
    </div>
    ${dev601CountSparkline(series)}
    ${series.length>1&&first&&last?`<div class="dev601-count-points"><span>${esc(formatMatchDate(first))}</span><span>${esc(formatMatchDate(last))}</span></div>`:''}
    <div style="margin-top:7px">${dev601CountTrendPill(series)}</div>
  </div>`;
}

const DEV60_ERROR_TYPES=['Netz','Seitenaus','Längenaus','Sonstiger Fehler'];

function dev60OwnErrorRows(matches,shot=null,returnSide=null){
  return (matches||[]).flatMap(m=>(m?.points||[]).filter(p=>
    p.winner==='opponent'&&p.kind==='error'&&
    (!shot||p.shot===shot)&&
    (!returnSide||p.returnSide===returnSide)
  ));
}
function dev60ErrorProfile(rows){
  const all=rows||[];
  const known=all.filter(p=>DEV60_ERROR_TYPES.includes(p.errorType));
  const counts=Object.fromEntries(DEV60_ERROR_TYPES.map(x=>[x,known.filter(p=>p.errorType===x).length]));
  return {total:all.length,known:known.length,unknown:all.length-known.length,counts};
}
function dev60ErrorTargetText(type){
  if(type==='Netz')return 'ins Netz';
  if(type==='Seitenaus')return 'ins Seitenaus';
  if(type==='Längenaus')return 'ins Längenaus';
  return 'in die Kategorie „Sonstiger Fehler“';
}
function dev60ErrorInsight(profile,label){
  if(profile.known<3)return `Noch zu wenige konkret erfasste ${label}-Fehler für ein belastbares Fehlermuster.`;
  const ranked=DEV60_ERROR_TYPES.map(type=>({type,n:profile.counts[type]})).sort((a,b)=>b.n-a.n);
  const top=ranked[0],second=ranked[1],share=pct(top.n,profile.known);
  if(top.n===profile.known)return `Alle ${profile.known} konkret erfassten ${label}-Fehler gingen ${dev60ErrorTargetText(top.type)}.`;
  if(top.n>second.n&&share>=60)return `${top.n} von ${profile.known} konkret erfassten ${label}-Fehlern (${share}%) gingen ${dev60ErrorTargetText(top.type)}.`;
  return `Bei den ${profile.known} konkret erfassten ${label}-Fehlern gibt es aktuell keinen einzelnen klar dominierenden Fehlertyp.`;
}
function dev60ErrorProfilePanel(label,rows,foot='',matches=null,shot=null,returnSide=null){
  const p=dev60ErrorProfile(rows);
  const scope=matches||[];
  const matchCount=scope.length;
  const countSeries=matchCount?dev601ErrorCountSeries(scope,shot,returnSide):[];
  const avgAll=matchCount?p.total/matchCount:null;

  if(!p.total)return `<div class="dev60-error-panel">
    <div class="dev60-error-panel-head"><div class="dev60-error-panel-title">${esc(label)}</div><div class="dev60-error-panel-n">n=0</div></div>
    <div class="pressure-empty">Noch keine passenden Fehler erfasst.</div>
    ${matchCount?`<div class="dev601-error-frequency"><b>Ø 0,0 Fehler/Match</b><span>${matchCount} ausgewertete Match${matchCount===1?'':'es'}</span></div>${dev601CountTrendBlock(countSeries)}`:''}
  </div>`;

  return `<div class="dev60-error-panel">
    <div class="dev60-error-panel-head">
      <div class="dev60-error-panel-title">${esc(label)}</div>
      <div class="dev60-error-panel-n">${p.known} konkret · ${p.total} gesamt</div>
    </div>
    <p class="dev60-error-insight">${esc(dev60ErrorInsight(p,label))}</p>
    ${matchCount?`<div class="dev601-error-frequency">
      <b>Ø ${dev59Decimal(avgAll)} Fehler/Match</b>
      <span>${p.total} Fehler über ${matchCount} Match${matchCount===1?'':'es'}</span>
    </div>`:''}
    ${DEV60_ERROR_TYPES.map(type=>{
      const n=p.counts[type],share=p.known?pct(n,p.known):0;
      const avgType=matchCount?n/matchCount:null;
      return `<div class="dev60-error-row">
        <div class="dev60-error-name">${esc(type==='Sonstiger Fehler'?'Sonstiges':type)}</div>
        <div class="dev60-error-track"><div class="dev60-error-fill" style="width:${share}%"></div></div>
        <div class="dev60-error-value"><b>${n} · ${share}%</b>${matchCount?`<span>Ø ${dev59Decimal(avgType)}/M</span>`:''}</div>
      </div>`;
    }).join('')}
    ${matchCount?dev601CountTrendBlock(countSeries):''}
    ${(p.unknown||foot)?`<div class="dev60-error-foot">${p.unknown?`${p.unknown} Fehler ohne konkrete Fehlerart. `:''}${esc(foot)}</div>`:''}
  </div>`;
}

function dev60ReturnErrorDetail(matches){
  const scope=matches||[];
  const rows=dev60OwnErrorRows(scope,'Return');
  const vh=rows.filter(p=>p.returnSide==='Vorhand');
  const rh=rows.filter(p=>p.returnSide==='Rückhand');
  const knownSide=vh.length+rh.length;
  const vhShare=knownSide?pct(vh.length,knownSide):0;
  const rhShare=knownSide?pct(rh.length,knownSide):0;
  const mc=scope.length;
  const vhAvg=mc?vh.length/mc:null;
  const rhAvg=mc?rh.length/mc:null;

  let sideInsight='Für die VH/RH-Verteilung fehlen noch neue V60-Daten.';
  if(knownSide>=3){
    if(vh.length===knownSide)sideInsight=`Alle ${knownSide} Returnfehler mit erfasster Schlagseite passierten per Vorhand.`;
    else if(rh.length===knownSide)sideInsight=`Alle ${knownSide} Returnfehler mit erfasster Schlagseite passierten per Rückhand.`;
    else if(Math.max(vhShare,rhShare)>=65){
      const side=vhShare>rhShare?'Vorhand':'Rückhand',n=Math.max(vh.length,rh.length),share=Math.max(vhShare,rhShare);
      sideInsight=`${n} von ${knownSide} Returnfehlern mit erfasster Schlagseite (${share}%) passierten per ${side}.`;
    }else sideInsight='Vorhand- und Rückhand-Returnfehler sind bei den bisher erfassten Seiten relativ ausgeglichen.';
  }

  return `<div class="dev60-error-stack">
    <div class="dev60-error-panel">
      <div class="dev60-error-panel-head">
        <div class="dev60-error-panel-title">VH oder RH beim Returnfehler?</div>
        <div class="dev60-error-panel-n">${knownSide} mit Seite · ${rows.length} gesamt</div>
      </div>

        <div class="dev60-return-side-box">

          <span>${knownSide?vhShare+'%':'—'}${mc?` · Ø ${dev59Decimal(vhAvg)}/Match`:''}</span>
        </div>
        <div class="dev60-return-side-box">
          <span>Rückhand-Return</span><b>${rh.length}</b>
          <span>${knownSide?rhShare+'%':'—'}${mc?` · Ø ${dev59Decimal(rhAvg)}/Match`:''}</span>
        </div>
      </div>
      <div class="dev60-error-foot">Die Schlagseite des Returnfehlers wird ab V60 erfasst. Ältere Returnfehler bleiben in der Gesamtzahl enthalten, können aber keiner Seite zugeordnet werden.</div>
    </div>
    ${dev60ErrorProfilePanel('Return',rows,'Fehlerart über alle Returnfehler.',scope,'Return')}
    ${knownSide?dev60ErrorProfilePanel('Vorhand-Return',vh,'Nur Returnfehler mit erfasster Vorhand-Seite.',scope,'Return','Vorhand') : ''}
    ${knownSide?dev60ErrorProfilePanel('Rückhand-Return',rh,'Nur Returnfehler mit erfasster Rückhand-Seite.',scope,'Return','Rückhand') : ''}
  </div>`;
}

function dev60OverallErrorInsight(matches){
  const defs=[
    ['Vorhand',dev60OwnErrorRows(matches,'Vorhand')],
    ['Rückhand',dev60OwnErrorRows(matches,'Rückhand')],
    ['Return',dev60OwnErrorRows(matches,'Return')]
  ].map(([label,rows])=>({label,profile:dev60ErrorProfile(rows)}))
   .filter(x=>x.profile.known>=3);
  if(!defs.length)return 'Noch zu wenige konkret erfasste Fehler für ein belastbares Gesamtmuster.';
  const candidates=defs.map(x=>{
    const ranked=DEV60_ERROR_TYPES.map(type=>({type,n:x.profile.counts[type]})).sort((a,b)=>b.n-a.n);
    return {...x,top:ranked[0],share:pct(ranked[0].n,x.profile.known)};
  }).sort((a,b)=>b.share-a.share||b.profile.known-a.profile.known);
  const x=candidates[0];
  if(x.share>=60)return `${x.label}: ${x.top.n} von ${x.profile.known} konkret erfassten Fehlern (${x.share}%) gingen ${dev60ErrorTargetText(x.top.type)}.`;
  return 'Die erfassten Fehler verteilen sich aktuell ohne ein einzelnes dominantes Muster.';
}
