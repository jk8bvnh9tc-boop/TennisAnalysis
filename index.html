<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Tennis Analysis V13</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f3;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:88px}.top{height:64px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between}.top h1{font-size:20px;margin:0}.gear{border:0;background:transparent;box-shadow:none;font-size:22px;min-width:44px}
.content{padding:0 16px}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 1px 4px #0001}
.section{margin:15px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;color:#6b7280}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.input{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:12px;background:#fff}
button{font:inherit;border:0;border-radius:14px;padding:14px;min-height:52px;background:#fff;box-shadow:0 1px 3px #0002;font-weight:650;color:#111827}
button.primary{background:#111827;color:#fff;width:100%}button.secondary{background:#e5e7eb;width:100%}button.selected{background:#e5e7eb;outline:3px solid #111827}
.muted{color:#6b7280;font-size:13px;line-height:1.45}.score{text-align:center;font-size:32px;font-weight:800;margin:4px 0 12px}
.nav{position:fixed;z-index:10;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px max(6px,env(safe-area-inset-bottom))}
.nav button{box-shadow:none;background:transparent;min-height:48px;font-size:12px;padding:7px 2px}.nav button.active{background:#eee}
.court{position:relative;width:100%;aspect-ratio:1;border:3px solid #111;background:#eef2f3;border-radius:8px;overflow:hidden;touch-action:none}
.zone{position:absolute;width:33.3333%;height:33.3333%;border-right:1px solid #777;border-bottom:1px solid #777}.z1{left:0;top:0}.z2{left:33.3333%;top:0}.z3{left:66.6667%;top:0;border-right:0}.z4{left:0;top:33.3333%}.z5{left:33.3333%;top:33.3333%}.z6{left:66.6667%;top:33.3333%;border-right:0}.z7{left:0;top:66.6667%;border-bottom:0}.z8{left:33.3333%;top:66.6667%;border-bottom:0}.z9{left:66.6667%;top:66.6667%;border-right:0;border-bottom:0}
.net{position:absolute;left:0;right:0;top:50%;border-top:4px solid #111;z-index:2}.marker{position:absolute;width:28px;height:28px;border-radius:50%;background:#111827;border:4px solid #fff;transform:translate(-50%,-50%);z-index:3}
.modal{position:fixed;z-index:30;inset:0;background:#0007;display:flex;align-items:flex-end}.modalbox{width:100%;max-width:720px;margin:auto 0 0;background:#fff;border-radius:22px 22px 0 0;padding:22px 16px 30px}.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;z-index:50;top:15px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 15px;border-radius:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #eee}
.badge{font-size:12px;background:#eee;border-radius:8px;padding:4px 7px}
.score-block{text-align:center!important;position:relative;background:#fff;border-radius:18px;padding:15px 10px;margin:8px 0 20px;box-shadow:0 1px 4px #0001}.score-value{font-size:24px;font-weight:800}.point-value{font-size:36px}.v8-score-row{position:relative;display:flex;justify-content:center;align-items:center;min-height:44px}.v8-server-indicator{position:absolute;top:50%;transform:translateY(-50%);font-size:8px;line-height:1}.v8-server-indicator.left{left:18%}.v8-server-indicator.right{right:18%}.server-ball{font-size:8px;margin-right:3px;vertical-align:middle}
.v8-court-wrap{max-width:560px;margin:12px auto}.v8-court-half{position:relative;width:100%;aspect-ratio:.66;border:3px solid #222;background:#5f855c;border-radius:5px;overflow:hidden}.v8-net{position:absolute;left:0;right:0;top:0;height:4%;background:#d7d7d7;border-bottom:3px solid #222;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#222;z-index:2}.v8-court-lines{position:absolute;left:7%;right:7%;top:4%;bottom:2.5%;z-index:1;border-left:2px solid #fff;border-right:2px solid #fff;border-bottom:3px solid #fff}.v8-service-line{position:absolute;left:0;right:0;top:53.85%;border-top:2px solid #fff}.v8-center-line{position:absolute;left:50%;top:0;height:53.85%;border-left:2px solid #fff}.v8-court-grid{position:absolute;left:7%;right:7%;top:4%;bottom:2.5%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);z-index:4}.v8-cell{min-width:0;min-height:0;padding:0;border-radius:0;background:transparent;box-shadow:none;border:1px dashed rgba(255,255,255,.55)}.v8-cell.selected-cell{background:rgba(255,255,255,.38);box-shadow:inset 0 0 0 4px #fff}.v8-serve-grid{position:absolute;left:7%;right:7%;top:4%;height:30%;display:grid;grid-template-columns:repeat(3,1fr);z-index:5}.v8-serve-grid .v8-cell{border:2px solid rgba(255,255,255,.8)}.v8-serve-grid .v8-cell.selected-cell{background:rgba(255,255,255,.42)}.v8-serve-target{position:absolute;top:4%;height:50.35%;width:43%;z-index:6;display:grid;grid-template-columns:repeat(3,1fr)}.v8-serve-target.left{left:7%}.v8-serve-target.right{right:7%}.v8-serve-target .v8-cell{border:2px solid rgba(255,255,255,.9);border-radius:0}.v8-serve-target .v8-cell.selected-cell{background:rgba(255,255,255,.42);box-shadow:inset 0 0 0 3px #fff}.v8-court-caption{text-align:center;margin-top:8px;font-size:13px}.v8-disabled{opacity:.38;cursor:not-allowed!important}
</style></head><body><div id="app"></div><script>
'use strict';
const KEY='tennis-analysis-v6';
const app=document.getElementById('app');
const D={players:[],activePlayerId:null,matches:[],currentMatchId:null,settings:{startScore:'0:0',ad:true,thirdSet:'match-tiebreak'}};
let state=load(),hand=null,oppHand=null,mods={court:false,rally:false,serve:false,opponent:false};
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');return x?{...D,...x,settings:{...D.settings,...(x.settings||{})}}:JSON.parse(JSON.stringify(D));}catch(e){return JSON.parse(JSON.stringify(D));}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1500)}
function player(){return state.players.find(p=>p.id===state.activePlayerId)||null}
function match(){const m=state.matches.find(m=>m.id===state.currentMatchId)||null;if(m){if(!m.currentSet)m.currentSet=Math.max(1,m.sets[0]+m.sets[1]+1);if(!m.setGames)m.setGames=[[...(m.games||[0,0])],[0,0],[0,0]];if(!m.completedSets)m.completedSets=[]}return m}
function running(){const m=match();return !!m&&!m.finished}
function shell(title,body,active='matches'){app.innerHTML=`<div class="app"><header class="top"><h1>${esc(title)}</h1><button class="gear" onclick="settings()">⚙</button></header><main class="content">${body}</main><nav class="nav"><button class="${active==='matches'?'active':''}" onclick="nav('matches')">Matches</button><button class="${active==='analysis'?'active':''}" onclick="nav('analysis')">Analyse</button><button class="${active==='development'?'active':''}" onclick="nav('development')">Entwicklung</button><button class="${active==='opponents'?'active':''}" onclick="nav('opponents')">Gegner</button></nav></div>`}
function nav(x){const m=match();if(m&&!m.finished&&!m.navParked){parkPrompt(x);return}go(x)}
function parkPrompt(x){const e=document.createElement('div');e.className='modal';e.innerHTML='<div class="modalbox"><h3>Laufendes Match</h3><p class="muted">Das Match wird einmalig gespeichert. Du kannst es anschließend im Menüpunkt Matches fortsetzen.</p><div class="modal-actions"><button onclick="this.closest(\'.modal\').remove()">Abbrechen</button><button class="primary" onclick="leave(true,\'${x}\')">Speichern</button></div><button class="secondary" style="margin-top:8px" onclick="leave(false,\'${x}\')">Verwerfen</button></div>';e.querySelector('.primary').onclick=()=>leave(true,x);e.querySelector('.secondary').onclick=()=>leave(false,x);document.body.appendChild(e)}
function leave(saveIt,x){const m=match();if(saveIt&&m){m.status='nicht beendet';m.navParked=true;m.paused=true;state.currentMatchId=null;save()}else if(m){state.matches=state.matches.filter(a=>a.id!==m.id);state.currentMatchId=null;save()}document.querySelector('.modal')?.remove();go(x)}
function go(x){if(x==='matches')home();else if(x==='analysis')analysis();else if(x==='development')development();else opponents()}
function settings(){if(running()){nav('settings');return}const p=player();hand=p?.hand||null;shell('Einstellungen',`<div class="card"><div class="section">Aktive Spieler/-in</div><input id="pn" class="input" value="${esc(p?.name||'')}" placeholder="Name"><div class="section">Spielhand</div><div class="grid"><button id="hr" class="${hand==='Rechts'?'selected':''}" onclick="pickHand('Rechts')">Rechtshändig</button><button id="hl" class="${hand==='Links'?'selected':''}" onclick="pickHand('Links')">Linkshändig</button></div><div class="section">LK</div><input id="plk" class="input" inputmode="decimal" value="${esc(p?.lk||'')}" placeholder="z. B. 20.8"><button class="primary" style="margin-top:14px" onclick="savePlayer()">SPIELER/-IN SPEICHERN</button></div><div class="card"><div class="section">Matchregeln</div><select id="start" class="input"><option value="0:0">0:0</option><option value="2:2">2:2</option></select><div class="section">Punktwertung</div><select id="ad" class="input"><option value="1">Mit Ad</option><option value="0">Ohne Ad (No-Ad)</option></select><div class="section">Dritter Satz</div><select id="third" class="input"><option value="match-tiebreak">Match-Tie-Break bis 10</option><option value="normal">Ganzer Satz</option></select><button class="primary" style="margin-top:14px" onclick="saveRules()">REGELN SPEICHERN</button></div>`,'') ;document.getElementById('start').value=state.settings.startScore;document.getElementById('ad').value=state.settings.ad?'1':'0';document.getElementById('third').value=state.settings.thirdSet}
function pickHand(x){hand=x;document.getElementById('hr').classList.toggle('selected',x==='Rechts');document.getElementById('hl').classList.toggle('selected',x==='Links')}
function savePlayer(){const n=document.getElementById('pn').value.trim(),lk=document.getElementById('plk').value.trim().replace(',','.');if(!n||!hand){toast('Name und Spielhand erforderlich.');return}let p=player();if(!p){p={id:id(),name:n,hand,lk};state.players.push(p);state.activePlayerId=p.id}else{p.name=n;p.hand=hand;p.lk=lk}save();home()}
function saveRules(){state.settings.startScore=document.getElementById('start').value;state.settings.ad=document.getElementById('ad').value==='1';state.settings.thirdSet=document.getElementById('third').value;save();toast('Gespeichert')}
function home(){const p=player(),u=state.matches.filter(m=>!m.finished);shell('Tennis Analysis',`<div class="card"><div class="section">Aktive Spieler/-in</div>${p?`<div class="input"><b>${esc(p.name)}</b> · ${esc(p.hand)} · LK ${esc(p.lk||'—')}</div><button class="primary" style="margin-top:14px;font-size:20px" onclick="newMatch()">＋ MATCH</button>`:'<button class="primary" onclick="settings()">Spieler/-in anlegen</button>'}</div>${u.length?'<div class="card"><div class="section">Nicht beendete Matches</div>'+u.map(m=>`<div class="row"><span>${esc(m.player)} – ${esc(m.opponent)}<br><span class="badge">nicht beendet</span></span><button onclick="resume('${m.id}')">Fortsetzen</button></div>`).join('')+'</div>':''}`,'matches')}
function newMatch(){if(!player()){settings();return}mods={court:false,rally:false,serve:false,opponent:false};oppHand=null;shell('Neues Match',`<div class="card"><div class="section">Spieler/-in</div><div class="input">${esc(player().name)} · ${esc(player().hand)} · LK ${esc(player().lk||'—')}</div><div class="section">Gegner/-in</div><input id="on" class="input" placeholder="Name optional"><div class="section">Spielhand Gegner/-in</div><div class="grid"><button id="or" onclick="pickOpp('Rechts')">Rechtshändig</button><button id="ol" onclick="pickOpp('Links')">Linkshändig</button></div><div class="section">LK Gegner/-in</div><input id="olk" class="input" inputmode="decimal" placeholder="optional"><div class="section">Matchtyp</div><select id="type" class="input"><option value="">Nicht angegeben</option><option>Turnier</option><option>Punktspiel</option><option>Trainingsspiel</option></select><div class="section">Zusatzmodule</div><div class="grid"><button id="mc" onclick="mod('court')">Court</button><button id="mr" onclick="mod('rally')">Ballwechsel</button><button id="ms" onclick="mod('serve')">Aufschlag</button><button id="mo" onclick="mod('opponent')">Gegner</button></div><button class="primary" style="margin-top:14px" onclick="start()">MATCH STARTEN</button></div>`,'matches')}
function pickOpp(x){oppHand=x;document.getElementById('or').classList.toggle('selected',x==='Rechts');document.getElementById('ol').classList.toggle('selected',x==='Links')}
function mod(k){mods[k]=!mods[k];document.getElementById('m'+({court:'c',rally:'r',serve:'s',opponent:'o'}[k])).classList.toggle('selected',mods[k])}
function askFirstServer(){const m=match();shell('Matchbeginn',`<div class="card"><h2 style="text-align:center">Wer schlägt zuerst auf?</h2><p class="muted" style="text-align:center">Der Aufschläger wechselt nach jedem Spiel.</p><div class="grid"><button class="${m.server==='player'?'selected':''}" onclick="chooseServer('player')">🎾 ${esc(m.player)}</button><button class="${m.server==='opponent'?'selected':''}" onclick="chooseServer('opponent')">🎾 ${esc(m.opponent)}</button></div><button class="primary" style="margin-top:14px" onclick="confirmFirstServer()">MATCH STARTEN</button></div>`,'matches')}
function chooseServer(x){const m=match();m.server=x;m.firstServer=x;m.setFirstServers=m.setFirstServers||[];m.setFirstServers[0]=x;m.currentSet=1;save();askFirstServer()}
function confirmFirstServer(){if(!match().server){toast('Bitte Aufschläger auswählen.');return}point()}
function start(){const p=player(),g=state.settings.startScore.split(':').map(Number),m={id:id(),player:p.name,playerLK:p.lk,playerHand:p.hand,opponent:document.getElementById('on').value.trim()||'Gegner/-in',opponentLK:document.getElementById('olk').value.trim().replace(',','.'),opponentHand:oppHand,type:document.getElementById('type').value,mods:{...mods},sets:[0,0],games:g,gamePoints:[0,0],points:[],finished:false,status:'nicht beendet',paused:false,pending:null,court:null,rally:null,server:null,currentSet:1,setGames:[[...g],[0,0],[0,0]],completedSets:[],firstServer:null,setFirstServers:[],tiebreak:false,tiebreakPoints:[0,0]};state.matches.push(m);state.currentMatchId=m.id;save();askFirstServer()}
function resume(x){state.currentMatchId=x;const m=match();if(!m)return;m.paused=true;m.navParked=false;save();scoreCorrection()}
function scorePointText(m){const a=m.gamePoints[0],b=m.gamePoints[1],v=['0','15','30','40'];if(a>=3&&b>=3){if(state.settings.ad){if(a===b)return '40 : 40';if(a===4)return 'AD : 40';if(b===4)return '40 : AD'}return '40 : 40'}return v[Math.min(a,3)]+' : '+v[Math.min(b,3)]}
function serverForCurrentState(m){return m.server||'player'}
function score(m){const pt=scorePointText(m),srv=serverForCurrentState(m),name=srv==='player'?m.player:m.opponent,side=srv==='player'?'left':'right';return `<div class="score-block"><div class="score-label">Sätze</div><div class="score-value">${m.sets[0]} : ${m.sets[1]}</div><div class="score-label">Spiele</div><div class="score-value">${m.games[0]} : ${m.games[1]}</div><div class="score-label">Spielstand</div><div class="v8-score-row"><span class="v8-server-indicator ${side}">🎾</span><span class="score-value point-value">${pt}</span></div><div class="muted small">Aufschlag: ${esc(name||'—')}</div></div>`}
function serveSide(m){
  const srv=serverForCurrentState(m);
  // Determine the service side from the total point number, not from the server's own score.
  // Normal game: even total -> deuce, odd total -> ad.
  // Tie-break: same side sequence (first point deuce, then ad/deuce/ad...).
  const total=(m.gamePoints?.[0]||0)+(m.gamePoints?.[1]||0);
  const deuce=total%2===0;
  // Court is displayed from Mia's perspective; the opponent's court is mirrored.
  if(srv==='player') return deuce?'right':'left';
  return deuce?'left':'right';
}
function point(){const m=match();if(!m)return home();if(m.paused)return pause();const p=m.pending||{},pn=esc(m.player),serverIsPlayer=serverForCurrentState(m)==='player';const activeShots=serverIsPlayer?['Aufschlag','Vorhand','Rückhand','Volley']:['Return','Vorhand','Rückhand','Volley'];const inactiveShot=serverIsPlayer?'Return':'Aufschlag';const label=p.winner==='player'&&p.kind==='error'?'Nach welchem Schlag von '+pn+'?':p.winner==='opponent'&&p.kind==='error'?'Welcher Schlag von '+pn+' war der Fehler?':p.winner==='opponent'&&p.kind==='winner'?'Welcher Schlag der Gegnerin?':'Welcher Schlag von '+pn+'?';shell(`${pn} – ${esc(m.opponent)}`,score(m)+`<div class="card"><div class="section">Wer hat den Punkt gemacht?</div><div class="grid"><button class="${p.winner==='player'?'selected':''}" onclick="winner('player')">${pn}</button><button class="${p.winner==='opponent'?'selected':''}" onclick="winner('opponent')">${esc(m.opponent)}</button></div>${p.winner?`<div class="section">${p.winner==='player'?'Wie hat '+pn+' den Punkt gewonnen?':'Wie hat die Gegnerin den Punkt gewonnen?'}</div><div class="grid"><button class="${p.kind==='winner'?'selected':''}" onclick="kind('winner')">${p.winner==='player'?pn+'-Winner':'Gegner-Winner'}</button><button class="${p.kind==='error'?'selected':''}" onclick="kind('error')">${p.winner==='player'?'Gegnerfehler':pn+'-Fehler'}</button></div>`:''}${p.kind?`<div class="section">${label}</div><div class="grid">${activeShots.map(x=>`<button class="${p.shot===x?'selected':''}" onclick="shot('${x}')">${x}</button>`).join('')}<button disabled class="v8-disabled">${inactiveShot}</button></div>`:''}${p.shot==='Aufschlag'&&m.mods.serve?`<div class="section">Aufschlag</div><div class="grid"><button class="${p.serve==='first'?'selected':''}" onclick="serve('first')">Erster Aufschlag</button><button class="${p.serve==='second'?'selected':''}" onclick="serve('second')">Zweiter Aufschlag</button></div>`:''}</div><button class="primary" onclick="nextPoint()">WEITER</button><button class="secondary" style="margin-top:8px" onclick="pauseCapture()">ERFASSUNGS-PAUSE</button><button style="width:100%;margin-top:8px" onclick="undoAsk()">↩ ZURÜCK</button>`,'matches')}
function winner(x){const m=match();m.pending={winner:x};save();point()}function kind(x){const m=match();m.pending={...m.pending,kind:x};save();point()}function shot(x){const m=match();m.pending={...m.pending,shot:x};save();point()}function serve(x){const m=match();m.pending={...m.pending,serve:x};save();point()}
function nextPoint(){const m=match(),p=m.pending;if(!p||!p.winner||!p.kind||!p.shot){toast('Bitte alle erforderlichen Angaben auswählen.');return}if(p.shot==='Aufschlag'&&m.mods.serve&&!p.serve){toast('Bitte Erster oder Zweiter Aufschlag auswählen.');return}if(p.kind==='error'){errorMask();return}if(m.mods.court){court();return}if(m.mods.rally){rally();return}finishPoint()}function errorMask(){const m=match(),p=m.pending;shell('Fehlerart',`<div class="card"><div class="section">Welche Fehlerart?</div><div class="grid">${['Netz','Seitenaus','Längenaus','Sonstiger Fehler'].map(x=>`<button class="${p.errorType===x?'selected':''}" onclick="errorPick('${x}')">${x}</button>`).join('')}</div><button class="${p.errorType==='ns'?'selected':''}" style="width:100%;margin-top:10px" onclick="errorPick('ns')">NICHT GESEHEN</button></div><button class="primary" onclick="errorNext()">WEITER</button><button style="width:100%;margin-top:8px" onclick="point()">↩ ZURÜCK</button>`,'matches')}function errorPick(x){match().pending.errorType=x;save();errorMask()}function errorNext(){const m=match(),p=m.pending;if(!p.errorType){toast('Bitte Fehlerart auswählen.');return}if(p.winner==='player'&&p.kind==='error'){finishPoint();return}if(p.winner==='opponent'&&p.kind==='error'){finishPoint();return}if(m.mods.court){court();return}if(m.mods.rally&&p.shot!=='Aufschlag'){rally();return}finishPoint()}
function court(){const m=match(),p=m.pending;const isServeWinner=p.shot==='Aufschlag'&&p.kind==='winner';const side=serveSide(m);let label='Ballplatzierung';let half='';if(p.winner==='player'&&p.kind==='winner'){label='Ballplatzierung von '+m.player+'s '+p.shot;half='Feldhälfte Gegnerin'}if(p.winner==='opponent'&&p.kind==='winner'){label='Ballplatzierung der Gegnerin';half='Feldhälfte Mia'}if(p.winner==='opponent'&&p.kind==='error'){label='Ballplatzierung vor Mias Fehler';half='Feldhälfte Gegnerin'}if(p.winner==='player'&&p.kind==='error'){label='Ballplatzierung vor dem Fehler der Gegnerin';half='Feldhälfte Mia'}let grid;if(isServeWinner){grid=`<div class="v8-serve-target ${side}">${Array.from({length:3},(_,i)=>`<button class="v8-cell ${m.court===('S'+side+i)?'selected-cell':''}" onclick="cell('S${side}${i}')"></button>`).join('')}</div>`}else{grid=`<div class="v8-court-grid">${Array.from({length:9},(_,i)=>`<button class="v8-cell ${m.court===i?'selected-cell':''}" onclick="cell(${i})"></button>`).join('')}</div>`}shell('Court',`<div class="card"><div class="section">${esc(label)}</div>${half?`<div style="text-align:center;font-weight:800;margin:-2px 0 8px">${esc(half)}</div>`:''}<div class="v8-court-wrap"><div class="v8-court-half"><div class="v8-net">NETZ</div><div class="v8-court-lines"><div class="v8-service-line"></div><div class="v8-center-line"></div></div>${grid}</div></div><div class="v8-court-caption">${isServeWinner?'Aufschlagfeld: '+(side==='right'?'rechts':'links')+' – links / Mitte / rechts':'Feld auswählen'}</div><button class="${m.court==='ns'?'selected':''}" style="width:100%;margin-top:10px" onclick="cell('ns')">NICHT GESEHEN</button></div><button class="primary" onclick="courtNext()">WEITER</button><button style="width:100%;margin-top:8px" onclick="point()">↩ ZURÜCK</button>`,'matches')}
function cell(x){const m=match();m.court=x;save();court()}
function courtNext(){const m=match();if(m.court===null||m.court===undefined){toast('Bitte Feld auswählen oder Nicht gesehen.');return}m.mods.rally?rally():finishPoint()}
function rally(){const m=match();shell('Ballwechsel',`<div class="card"><div class="section">Dauer des Ballwechsels (eigene Schlagzahl)</div><div class="grid">${['1','2–3','4–6','7+'].map(x=>`<button class="${m.rally===x?'selected':''}" onclick="rallyPick('${x}')">${x} Schläge</button>`).join('')}</div><button class="${m.rally==='ns'?'selected':''}" style="width:100%;margin-top:10px" onclick="rallyPick('ns')">NICHT GESEHEN</button></div><button class="primary" onclick="rallyNext()">BESTÄTIGEN</button><button style="width:100%;margin-top:8px" onclick="point()">↩ ZURÜCK</button>`,'matches')}
function rallyPick(x){match().rally=x;save();rally()}function rallyNext(){if(!match().rally){toast('Bitte Ballwechseldauer wählen.');return}finishPoint()}
function finishPoint(){const m=match(),p=m.pending;m.points.push({...p,court:m.court??null,rally:m.rally??null});if(m.tiebreak){const i=p.winner==='player'?0:1;m.tiebreakPoints[i]++;const total=m.tiebreakPoints[0]+m.tiebreakPoints[1];if((m.tiebreakPoints[i]>=7&&m.tiebreakPoints[i]-m.tiebreakPoints[1-i]>=2)){m.completedSets.push([m.tiebreakPoints[0],m.tiebreakPoints[1]]);m.sets[i]++;m.currentSet++;m.games=[0,0];m.setGames[m.currentSet-1]=[0,0];m.gamePoints=[0,0];m.tiebreak=false;m.tiebreakPending=false;m.tiebreakPoints=[0,0];m.server=m.server==='player'?'opponent':'player'}else{if(total%2===1)m.server=m.server==='player'?'opponent':'player'} } else {addPoint(m,p.winner)}m.pending=null;m.court=null;m.rally=null;if(m.sets[0]>=2||m.sets[1]>=2){m.finished=true;m.status='beendet';state.currentMatchId=null;save();finishView(m);return}save();point()}
function addPoint(m,w){const i=w==='player'?0:1,o=1-i,g=m.gamePoints;if(g[0]>=3&&g[1]>=3){if(!state.settings.ad){game(m,i);return}if(g[0]===g[1]){g[i]=4;g[o]=3;return}if(g[i]===4){game(m,i);return}g[0]=3;g[1]=3;return}g[i]++;if(g[i]>=4&&g[i]>g[o])game(m,i)}
function game(m,i){m.games[i]++;if(!m.setGames)m.setGames=[[0,0],[0,0],[0,0]];m.setGames[m.currentSet-1]=[...m.games];m.gamePoints=[0,0];m.server=m.server==='player'?'opponent':'player';if(m.games[i]>=6&&m.games[i]-m.games[1-i]>=2)setWon(m,i);else if(m.games[0]===6&&m.games[1]===6){m.tiebreakPending=true;m.tiebreak=true;m.tiebreakPoints=[0,0]}}function setWon(m,i){m.completedSets.push([...m.games]);m.sets[i]++;m.currentSet++;m.games=[0,0];m.setGames[m.currentSet-1]=[0,0];m.gamePoints=[0,0];m.tiebreakPending=false;m.tiebreak=false;m.tiebreakPoints=[0,0];m.setFirstServers=m.setFirstServers||[];m.setFirstServers[m.currentSet-1]=m.server}
function finishView(m){const rows=(m.manualSets||m.completedSets||[]).map((x,i)=>x?`<div class="row"><span>Satz ${i+1}</span><b>${x[0]} : ${x[1]}</b></div>`:'').join('');shell('Match beendet',`<div class="card"><h2>${esc(m.player)} – ${esc(m.opponent)}</h2><div class="score-block"><div class="score-label">Sätze</div><div class="score-value point-value">${m.sets[0]} : ${m.sets[1]}</div></div>${rows||`<div class="row"><span>Spiele</span><b>${m.games[0]} : ${m.games[1]}</b></div>`}<button class="primary" onclick="analysis()">ANALYSE ÖFFNEN</button></div>`,'matches')}
function pauseCapture(){const m=match();m.paused=true;m.navParked=false;m.status='pausiert';save();pause()}
function pause(){shell('Erfassungspause',`<div class="card"><h2 style="text-align:center">Erfassung pausiert</h2><p class="muted">Die bisherigen Daten sind gespeichert. Beim Fortsetzen wird zuerst der aktuelle Spielstand abgefragt.</p><button class="primary" onclick="resumeCurrent()">FORTSETZEN / SPIELSTAND PRÜFEN</button><button class="secondary" style="margin-top:8px" onclick="finishManual()">MATCH BEENDEN</button></div>`,'matches')}
function resumeCurrent(){scoreCorrection()}
function inferServer(m,setNo){
  if(m.server) return m.server;
  const first=m.setFirstServers?.[setNo-1]||m.firstServer;
  if(!first) return null;
  const games=(m.setGames?.[setNo-1]||m.games||[0,0]);
  const gamesPlayed=(games[0]||0)+(games[1]||0);
  if(m.tiebreak){
    const total=(m.tiebreakPoints?.[0]||0)+(m.tiebreakPoints?.[1]||0);
    if(total===0) return first;
    return total===1 ? (first==='player'?'opponent':'player') : (total%2===0 ? (first==='player'?'opponent':'player') : first);
  }
  return gamesPlayed%2===0 ? first : (first==='player'?'opponent':'player');
}
function correctionMaxSet(m){
  const s0=Number(document.getElementById('rs0')?.value||m.sets[0]||0),s1=Number(document.getElementById('rs1')?.value||m.sets[1]||0);
  return Math.min(3,Math.max(1,s0+s1+1));
}
function renderCorrectionSetFields(m,setNo){
  const prior=[];
  for(let i=0;i<setNo-1;i++){
    const v=m.completedSets?.[i]||m.setGames?.[i]||[0,0];
    prior.push(`<div class="section">Satz ${i+1} – beendet</div><div class="grid"><input id="rcg${i}p" class="input" type="number" min="0" value="${v[0]??0}"><input id="rcg${i}o" class="input" type="number" min="0" value="${v[1]??0}"></div>`);
  }
  const cur=(m.setGames?.[setNo-1]||m.games||[0,0]);
  document.getElementById('correctionSets').innerHTML=prior.join('')+`<div class="section">Aktueller Satz ${setNo} – Spiele</div><div class="grid"><input id="rcgp" class="input" type="number" min="0" value="${cur[0]??0}"><input id="rcgo" class="input" type="number" min="0" value="${cur[1]??0}"></div>`;
}
function updateCorrectionSetOptions(){
  const m=match(),sel=document.getElementById('rcurrentset');if(!m||!sel)return;
  const max=correctionMaxSet(m),old=Number(sel.value||m.currentSet||1);
  sel.innerHTML=Array.from({length:max},(_,i)=>`<option value="${i+1}">Satz ${i+1}${i+1===max?' – aktuell':''}</option>`).join('');
  const next=(old===1&&max>1)?max:Math.min(Math.max(1,old),max);sel.value=String(next);renderCorrectionSetFields(m,next);
}
function scoreCorrection(){const m=match();if(!m)return;const gp=m.gamePoints||[0,0],setNo=Math.min(3,Math.max(1,m.currentSet||m.sets[0]+m.sets[1]+1));m.server=inferServer(m,setNo);shell('Spielstand prüfen',`<div class="card"><h2 style="text-align:center">Aktueller Spielstand</h2><p class="muted">Bereits beendete Sätze und der laufende Satz können separat erfasst werden.</p><div class="section">Sätze</div><div class="grid"><input id="rs0" class="input" type="number" min="0" max="2" value="${m.sets[0]}"><input id="rs1" class="input" type="number" min="0" max="2" value="${m.sets[1]}"></div><div class="section">Satz auswählen</div><select id="rcurrentset" class="input"></select><div id="correctionSets"></div><div class="section">Aktueller Spielstand</div><div class="grid"><select id="rp0" class="input"><option>0</option><option>15</option><option>30</option><option>40</option><option>AD</option></select><select id="rp1" class="input"><option>0</option><option>15</option><option>30</option><option>40</option><option>AD</option></select></div><div class="section">Aufschläger</div><div class="grid"><button id="rsrvp" class="${m.server==='player'?'selected':''}" onclick="pickResumeServer('player')">🎾 ${esc(m.player)}</button><button id="rsrvo" class="${m.server==='opponent'?'selected':''}" onclick="pickResumeServer('opponent')">🎾 ${esc(m.opponent)}</button></div><button class="primary" style="margin-top:14px" onclick="applyScoreCorrection()">STAND ÜBERNEHMEN UND FORTSETZEN</button></div>`,'matches');
  document.getElementById('rs0').oninput=updateCorrectionSetOptions;document.getElementById('rs1').oninput=updateCorrectionSetOptions;document.getElementById('rcurrentset').onchange=()=>renderCorrectionSetFields(m,Number(document.getElementById('rcurrentset').value));
  document.getElementById('rs0').value=m.sets[0];document.getElementById('rs1').value=m.sets[1];updateCorrectionSetOptions();document.getElementById('rcurrentset').value=String(setNo);renderCorrectionSetFields(m,setNo);document.getElementById('rp0').value=gp[0]>=4?'AD':['0','15','30','40'][Math.min(gp[0],3)];document.getElementById('rp1').value=gp[1]>=4?'AD':['0','15','30','40'][Math.min(gp[1],3)]}
function pickResumeServer(x){match().server=x;document.getElementById('rsrvp').classList.toggle('selected',x==='player');document.getElementById('rsrvo').classList.toggle('selected',x==='opponent');save()}
function applyScoreCorrection(){const m=match(),map={'0':0,'15':1,'30':2,'40':3,'AD':4},setNo=+document.getElementById('rcurrentset').value;const s0=+document.getElementById('rs0').value,s1=+document.getElementById('rs1').value;if(!Number.isInteger(s0)||!Number.isInteger(s1)||s0<0||s1<0||s0>2||s1>2){toast('Bitte gültigen Satzstand eingeben.');return}if(!m.setGames)m.setGames=[[0,0],[0,0],[0,0]];m.sets=[s0,s1];m.currentSet=setNo;m.completedSets=[];for(let i=0;i<setNo-1;i++){const a=+document.getElementById('rcg'+i+'p').value,b=+document.getElementById('rcg'+i+'o').value;if(!Number.isInteger(a)||!Number.isInteger(b)){toast('Bitte alle beendeten Sätze vollständig erfassen.');return}m.completedSets.push([a,b]);m.setGames[i]=[a,b]}const cg0=+document.getElementById('rcgp').value,cg1=+document.getElementById('rcgo').value;if(!Number.isInteger(cg0)||!Number.isInteger(cg1)){toast('Bitte Spiele des aktuellen Satzes erfassen.');return}m.setGames[setNo-1]=[cg0,cg1];m.games=[cg0,cg1];m.gamePoints=[map[document.getElementById('rp0').value],map[document.getElementById('rp1').value]];if(!m.server){toast('Bitte Aufschläger auswählen.');return}m.paused=false;m.navParked=false;m.status='nicht beendet';save();point()}
function finishManual(){const m=match();if(!m)return;shell('Match abschließen',`<div class="card"><p class="muted">Endstand des unvollständig erfassten Matches nachtragen.</p><div class="section">Sätze</div><div class="grid"><input id="sp" class="input" placeholder="Spieler/-in" inputmode="numeric"><input id="so" class="input" placeholder="Gegner/-in" inputmode="numeric"></div><div id="setGames"></div><button class="primary" style="margin-top:14px" onclick="manualDone()">ABSCHLIESSEN</button></div>`,'matches');document.getElementById('sp').oninput=renderSetGameFields;document.getElementById('so').oninput=renderSetGameFields;renderSetGameFields()}function renderSetGameFields(){const sp=document.getElementById('sp').value,so=document.getElementById('so').value,third=(sp==='1'&&so==='2')||(sp==='2'&&so==='1');document.getElementById('setGames').innerHTML=`<div class="section">Satz 1 – Spiele</div><div class="grid"><input id="g10" class="input" placeholder="Spieler/-in" inputmode="numeric"><input id="g11" class="input" placeholder="Gegner/-in" inputmode="numeric"></div><div class="section">Satz 2 – Spiele</div><div class="grid"><input id="g20" class="input" placeholder="Spieler/-in" inputmode="numeric"><input id="g21" class="input" placeholder="Gegner/-in" inputmode="numeric"></div>${third?'<div class="section">Satz 3 – Spiele</div><div class="grid"><input id="g30" class="input" placeholder="Spieler/-in" inputmode="numeric"><input id="g31" class="input" placeholder="Gegner/-in" inputmode="numeric"></div>':''}`}
function manualDone(){const m=match(),sp=+document.getElementById('sp').value,so=+document.getElementById('so').value;const vals=['g10','g11','g20','g21'].map(id=>document.getElementById(id)?.value);if(!Number.isInteger(sp)||!Number.isInteger(so)||(sp+so===0)||vals.some(x=>x===''||x==null||isNaN(Number(x)))){toast('Bitte Satzergebnis und Spiele der ersten zwei Sätze vollständig eingeben.');return}const third=(sp===1&&so===2)||(sp===2&&so===1);if(third){const a=document.getElementById('g30')?.value,b=document.getElementById('g31')?.value;if(a===''||b===''||a==null||b==null||isNaN(Number(a))||isNaN(Number(b))){toast('Bitte auch das Ergebnis von Satz 3 eingeben.');return}m.manualSets=[[+vals[0],+vals[1]],[+vals[2],+vals[3]],[+a,+b]]}else m.manualSets=[[+vals[0],+vals[1]],[+vals[2],+vals[3]]];m.sets=[sp,so];m.games=m.manualSets[m.manualSets.length-1];m.finished=true;m.status='beendet';m.paused=false;state.currentMatchId=null;save();finishView(m)}
function undoAsk(){const m=match();if(!m.points.length){toast('Noch kein bestätigter Punkt.');return}const e=document.createElement('div');e.className='modal';e.innerHTML='<div class="modalbox"><h3>Wirklich zurück?</h3><p class="muted">Der letzte bestätigte Punkt wird gelöscht.</p><div class="modal-actions"><button onclick="this.closest(\'.modal\').remove()">Abbrechen</button><button class="primary" onclick="undo()">Zurück</button></div></div>';document.body.appendChild(e)}
function undo(){document.querySelector('.modal')?.remove();const m=match();m.points.pop();rebuild(m);save();point()}
function rebuild(m){const fs=m.firstServer||m.server||'player';m.sets=[0,0];m.games=m.startGames?[...m.startGames]:state.settings.startScore.split(':').map(Number);m.gamePoints=[0,0];m.server=fs;m.currentSet=1;m.setGames=[[...m.games],[0,0],[0,0]];m.completedSets=[];m.tiebreak=false;m.tiebreakPending=false;m.tiebreakPoints=[0,0];for(const p of m.points)addPoint(m,p.winner)}
function analysis(){shell('Analyse',`<div class="card"><div class="section">Analyse auswählen</div><select class="input" onchange="analysisPick(this.value)"><option value="">Bitte auswählen</option><option>Matchübersicht</option><option>Vorhand / Rückhand / Volley</option><option>Ballplatzierung</option><option>Ballwechsel</option><option>Aufschlag 🔒</option><option>Gegner 🔒</option></select></div><div class="card"><div class="section">Matches</div>${state.matches.length?state.matches.map(m=>`<div class="row"><span>${esc(m.player)} – ${esc(m.opponent)}<br><span class="badge">${m.finished?'beendet':'nicht beendet'}</span></span><span>${m.sets[0]}:${m.sets[1]}</span></div>`).join(''):'<p class="muted">Noch keine Matches.</p>'}`,'analysis')}
function analysisPick(x){if(x)toast('Auswahl: '+x)}
function development(){shell('Entwicklung','<div class="card"><h2>Entwicklung</h2><p class="muted">Trend- und Matchvergleich wird auf der gespeicherten Datengrundlage aufgebaut.</p></div>','development')}
function opponents(){shell('Gegner','<div class="card"><h2>Gegneranalyse</h2><p class="muted">Eigene Maske: 1. fehlerhafter Schlag der Gegnerin, 2. Mias vorheriger Ball: kurz, tief, hoch oder Winkel.</p><button class="primary" onclick="oppCapture()">GEGNERFEHLER ERFASSEN</button></div>','opponents')}
function oppCapture(){let s=1,a=null,b=null;function draw(){if(s===1)shell('Gegneranalyse',`<div class="card"><div class="section">Wo passiert der Fehler der Gegnerin?</div><div class="grid">${['Aufschlag','Return','Vorhand','Rückhand','Volley'].map(x=>`<button class="${a===x?'selected':''}" onclick="window.oc('${x}')">${x}</button>`).join('')}</div><button class="primary" style="margin-top:14px" onclick="window.onext()">WEITER</button></div>`,'opponents');else shell('Gegneranalyse',`<div class="card"><div class="section">Wo kam Mias Ball vorher hin?</div><div class="grid">${['kurz','tief','hoch','Winkel'].map(x=>`<button class="${b===x?'selected':''}" onclick="window.ob('${x}')">${x}</button>`).join('')}</div><button class="primary" style="margin-top:14px" onclick="window.osave()">SPEICHERN</button></div>`,'opponents')}window.oc=x=>{a=x;draw()};window.onext=()=>{if(!a){toast('Schlag auswählen.');return}s=2;draw()};window.ob=x=>{b=x;draw()};window.osave=()=>{if(!b){toast('Ballcharakteristik auswählen.');return}toast('Gegnerfehler gespeichert.');opponents()};draw()}
(function boot(){const m=match();if(m)point();else if(player())home();else settings()})();
</script></body></html>
