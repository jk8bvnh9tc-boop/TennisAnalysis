<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Tennis Analysis</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f3;color:#151515}
.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:90px}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 16px 8px}
.top h1{font-size:20px;margin:0}
.content{padding:8px 16px}
.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 1px 4px #0001}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button,select,input{font:inherit}
button{border:0;border-radius:14px;padding:14px;min-height:54px;background:#fff;font-weight:650;box-shadow:0 1px 3px #0002}
button.primary{background:#111827;color:#fff;width:100%}
button.secondary{background:#e8e8e5}
button.selected{outline:3px solid #111827}
.section{font-size:12px;font-weight:800;letter-spacing:.08em;color:#6b7280;text-transform:uppercase;margin:16px 0 8px}
.muted{color:#6b7280;font-size:13px}
.input{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:12px;background:white}
.score{text-align:center;font-size:40px;font-weight:800}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(4,1fr);padding:7px 6px max(7px,env(safe-area-inset-bottom));z-index:5}
.nav button{box-shadow:none;background:transparent;font-size:12px;min-height:48px;padding:8px 2px}
.nav button.active{background:#efefec}
.court{position:relative;aspect-ratio:1.05/1;background:#e9eef0;border:3px solid #111;border-radius:8px;overflow:hidden;margin:12px 0}
.court:after{content:"";position:absolute;left:0;right:0;top:50%;border-top:4px solid #111}
.zone{position:absolute;width:33.333%;height:50%;border-right:1px solid #777;border-bottom:1px solid #777}
.z1{left:0;top:0}.z2{left:33.333%;top:0}.z3{left:66.666%;top:0;border-right:0}
.z4{left:0;top:50%}.z5{left:33.333%;top:50%}.z6{left:66.666%;top:50%;border-right:0}
.marker{position:absolute;width:28px;height:28px;border-radius:50%;background:#111827;border:4px solid white;transform:translate(-50%,-50%);z-index:3}
.list{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #eee}
.pill{font-size:12px;background:#eee;padding:5px 8px;border-radius:99px}
.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 16px;border-radius:12px;z-index:20}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KEY="tennis_analysis_v2";

const DEFAULT_STATE={
  players:[{name:"Mia",hand:"Rechts",lk:"20.8"}],
  matches:[],
  settings:{start:"0:0",ad:true,third:"match-tiebreak"}
};

let S=load();
let selectedMods={court:false,rally:false,serve:false,opponent:false};
let selectedOpponentHand="";

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    return raw ? JSON.parse(raw) : DEFAULT_STATE;
  }catch(e){ return DEFAULT_STATE; }
}
function save(){localStorage.setItem(KEY,JSON.stringify(S));}
function esc(value){
  return String(value ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}
function toast(text){
  const el=document.createElement("div");
  el.className="toast"; el.textContent=text;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1500);
}
function shell(title,body,active="matches"){
  const nav=[
    ["home","Matches"],
    ["analysis","Analyse"],
    ["development","Entwicklung"],
    ["opponents","Gegner"]
  ];
  document.querySelector("#app").innerHTML=`
    <div class="app">
      <header class="top">
        <h1>${esc(title)}</h1>
        <button onclick="settings()">⚙</button>
      </header>
      <main class="content">${body}</main>
      <nav class="nav">
        ${nav.map(([fn,label])=>`
          <button class="${active===fn?"active":""}" onclick="${fn}()">${label}</button>
        `).join("")}
      </nav>
    </div>`;
}

function home(){
  const last=S.matches.at(-1);
  shell("Tennis Analysis",`
    <div class="card">
      <div class="section">Spielerin</div>
      <div class="input">${esc(S.players[0].name)} · LK ${esc(S.players[0].lk)}</div>
      <button class="primary" style="margin-top:14px;font-size:20px" onclick="newMatch()">＋ MATCH</button>
    </div>
    ${last?`
      <div class="card">
        <div class="section">Letztes Match</div>
        <h2>${esc(last.player)} – ${esc(last.opponent)}</h2>
        <div class="score">${esc(last.score)}</div>
        <div class="muted">${new Date(last.date).toLocaleDateString("de-DE")}</div>
        <button style="width:100%;margin-top:10px" onclick="detail('${last.id}')">Match ansehen</button>
      </div>`:""}
  `,"home");
}

function newMatch(){
  selectedMods={court:false,rally:false,serve:false,opponent:false};
  selectedOpponentHand="";
  shell("Neues Match",`
    <div class="card">
      <div class="section">Spielerin</div>
      <div class="input">${esc(S.players[0].name)} · ${esc(S.players[0].hand)} · LK ${esc(S.players[0].lk)}</div>

      <div class="section">Gegnerin</div>
      <input id="opp" class="input" placeholder="Name optional">

      <div class="section">Spielhand Gegnerin</div>
      <div class="grid">
        <button id="hand-right" onclick="pickOpponentHand('Rechts')">Rechts</button>
        <button id="hand-left" onclick="pickOpponentHand('Links')">Links</button>
      </div>

      <div class="section">LK Gegnerin</div>
      <input id="opp-lk" class="input" placeholder="optional">

      <div class="section">Matchtyp</div>
      <select id="match-type" class="input">
        <option value="">Nicht angegeben</option>
        <option>Turnier</option>
        <option>Punktspiel</option>
        <option>Trainingsspiel</option>
      </select>

      <div class="section">Module</div>
      <div class="grid">
        ${[
          ["court","Court"],
          ["rally","Rally"],
          ["serve","Aufschlag"],
          ["opponent","Gegner"]
        ].map(([id,label])=>`
          <button id="mod-${id}" onclick="toggleModule('${id}')">${label}</button>
        `).join("")}
      </div>

      <div class="card">
        <b>Matchregeln</b>
        <div class="muted">
          ${esc(S.settings.start)} · ${S.settings.ad?"Ad":"No-Ad"} ·
          ${S.settings.third==="normal"?"3. Satz normal":"Match-Tie-Break bis 10"}
        </div>
      </div>

      <button class="primary" onclick="startMatch()">MATCH STARTEN</button>
    </div>
  `,"home");
}

function pickOpponentHand(hand){
  selectedOpponentHand=hand;
  document.querySelector("#hand-right").classList.toggle("selected",hand==="Rechts");
  document.querySelector("#hand-left").classList.toggle("selected",hand==="Links");
}
function toggleModule(id){
  selectedMods[id]=!selectedMods[id];
  document.querySelector("#mod-"+id).classList.toggle("selected",selectedMods[id]);
}

function startMatch(){
  S.current={
    id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())),
    date:Date.now(),
    player:S.players[0].name,
    playerLK:S.players[0].lk,
    playerHand:S.players[0].hand,
    opponent:document.querySelector("#opp").value.trim()||"Gegnerin",
    opponentLK:document.querySelector("#opp-lk").value.trim(),
    opponentHand:selectedOpponentHand,
    type:document.querySelector("#match-type").value,
    mods:{...selectedMods},
    score:S.settings.start,
    points:[],
    history:[]
  };
  renderMatch();
}

function renderMatch(){
  const c=S.current;
  shell(`${esc(c.player)} – ${esc(c.opponent)}`,`
    <div class="score">${esc(c.score)}</div>

    <div class="card">
      <div class="section">Wer hat den Punkt gemacht?</div>
      <div class="grid">
        <button onclick="chooseWinner('player')">${esc(c.player)}</button>
        <button onclick="chooseWinner('opponent')">${esc(c.opponent)}</button>
      </div>

      ${c.winner?`
        <div class="section">Winner oder Fehler?</div>
        <div class="grid">
          <button onclick="chooseKind('Winner')">Winner</button>
          <button onclick="chooseKind('Fehler')">Fehler</button>
        </div>`:""}

      ${c.kind?`
        <div class="section">Schlag</div>
        <div class="grid">
          ${(c.servePoint?["Aufschlag","Vorhand","Rückhand","Volley"]:["Return","Vorhand","Rückhand","Volley"])
            .map(x=>`<button onclick="chooseShot('${x}')">${x}</button>`).join("")}
        </div>`:""}

      ${c.shot && c.mods.serve && c.servePoint?`
        <div class="section">Aufschlag</div>
        <div class="grid">
          <button onclick="chooseServe('1Sa')">Erster Aufschlag</button>
          <button onclick="chooseServe('1Sb')">Zweiter Aufschlag</button>
        </div>`:""}
    </div>

    <button class="secondary" style="width:100%;margin-bottom:8px" onclick="undoPoint()">↩ Zurück</button>
    <button class="primary" onclick="confirmPoint()">BESTÄTIGEN</button>
  `,"home");

  // For the prototype we assume the first point can be a serve point.
  c.servePoint=true;
}

function chooseWinner(value){S.current.winner=value;renderMatch();}
function chooseKind(value){S.current.kind=value;renderMatch();}
function chooseShot(value){S.current.shot=value;renderMatch();}
function chooseServe(value){S.current.serve=value;confirmPoint();}

function confirmPoint(){
  const c=S.current;
  if(!c.winner||!c.kind||!c.shot){
    toast("Punkt bitte vollständig erfassen.");
    return;
  }

  const oldScore=c.score;
  c.points.push({
    winner:c.winner,
    kind:c.kind,
    shot:c.shot,
    serve:c.serve||null,
    court:c.court||null,
    rally:c.rally||null
  });
  c.history.push(oldScore);

  let [a,b]=c.score.split(":").map(Number);
  if(c.winner==="player") a++; else b++;
  c.score=`${a}:${b}`;

  delete c.winner;
  delete c.kind;
  delete c.shot;
  delete c.serve;
  delete c.court;
  delete c.rally;

  save();

  if(c.mods.court) renderCourt();
  else if(c.mods.rally) renderRally();
  else renderMatch();
}

function undoPoint(){
  const c=S.current;
  if(c.points.length){
    c.points.pop();
    c.score=c.history.pop()||S.settings.start;
    save();
  }
  renderMatch();
}

function renderCourt(){
  shell("Court",`
    <div class="card">
      <div class="section">Ballplatzierung</div>
      <div class="court" id="court">
        ${[1,2,3,4,5,6].map(i=>`<div class="zone z${i}"></div>`).join("")}
      </div>
      <div class="muted">Grundlinie unten · Netz oben</div>

      <div class="grid" style="margin-top:10px">
        <button onclick="setCourtSpecial('Seitenaus links')">Seitenaus links</button>
        <button onclick="setCourtSpecial('Seitenaus rechts')">Seitenaus rechts</button>
        <button onclick="setCourtSpecial('Netz')">Netz</button>
        <button onclick="setCourtSpecial('Lang')">Lang</button>
      </div>

      <button style="width:100%;margin-top:10px" onclick="setCourtSpecial('Nicht gesehen')">NICHT GESEHEN</button>
    </div>

    <button class="primary" onclick="continueAfterCourt()">BESTÄTIGEN</button>
    <button style="width:100%;margin-top:8px" onclick="renderMatch()">↩ ZURÜCK</button>
  `,"home");

  document.querySelector("#court").addEventListener("click",e=>{
    const r=e.currentTarget.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width;
    const y=(e.clientY-r.top)/r.height;
    e.currentTarget.querySelector(".marker")?.remove();
    const marker=document.createElement("div");
    marker.className="marker";
    marker.style.left=(x*100)+"%";
    marker.style.top=(y*100)+"%";
    e.currentTarget.appendChild(marker);
    S.current.court={x,y};
  });
}

function setCourtSpecial(value){S.current.court=value;}
function continueAfterCourt(){
  if(S.current.mods.rally) renderRally();
  else renderMatch();
}

function renderRally(){
  shell("Rally",`
    <div class="card">
      <div class="section">Ballwechsel</div>
      <div class="grid">
        ${["1","2–3","4–6","7+"].map(x=>`<button onclick="setRally('${x}')">${x} Schläge</button>`).join("")}
      </div>
      <button style="width:100%;margin-top:10px" onclick="setRally('Nicht gesehen')">NICHT GESEHEN</button>
    </div>

    <button class="primary" onclick="continueAfterRally()">BESTÄTIGEN</button>
    <button style="width:100%;margin-top:8px" onclick="renderMatch()">↩ ZURÜCK</button>
  `,"home");
}
function setRally(value){S.current.rally=value;}
function continueAfterRally(){renderMatch();}

function detail(id){
  const m=S.matches.find(x=>x.id===id);
  if(!m){home();return;}
  shell("Matchdetail",`
    <div class="card">
      <h2>${esc(m.player)} – ${esc(m.opponent)}</h2>
      <div class="score">${esc(m.score)}</div>
      <div class="muted">${new Date(m.date).toLocaleDateString("de-DE")} · ${esc(m.type||"Match")}</div>

      <div class="section">Analyse auswählen</div>
      <select class="input" onchange="analysisSelected(this.value)">
        <option>Matchübersicht</option>
        <option>Heatmap</option>
        <option>Platzierung</option>
        <option>Fehleranalyse</option>
        <option>Rally</option>
        <option>Vorhand / Rückhand</option>
        <option>Entwicklung 🔒</option>
        <option>Aufschlag 🔒</option>
        <option>Gegner 🔒</option>
      </select>

      <div class="section">Mini-Analyse</div>
      <p>${m.points.length} Punkte erfasst. Die finalen Visualisierungen werden nach dem UX-/Funktionsprototyp ergänzt.</p>
    </div>
  `,"home");
}
function analysisSelected(value){
  toast(value.includes("🔒")?"Noch nicht freigeschaltet.":"Analyse: "+value);
}

function finishMatch(){
  if(S.current){
    S.matches.push({...S.current});
    delete S.current;
    save();
  }
  home();
}

function analysis(){
  shell("Analyse",`
    <div class="card">
      <h2>Gezielte Auswertung</h2>
      <p>Wähle ein gespeichertes Match und anschließend die gewünschte Analyse.</p>
      ${S.matches.length?S.matches.map(m=>`
        <div class="list">
          <span>${esc(m.player)} – ${esc(m.opponent)}</span>
          <button onclick="detail('${m.id}')">Öffnen</button>
        </div>`).join(""):"<p class='muted'>Noch keine Matches gespeichert.</p>"}
    </div>
  `,"analysis");
}

function development(){
  shell("Entwicklung",`
    <div class="card">
      <h2>Muster & Trends</h2>
      <p><b>ab 2 Datenmengen:</b> Trend möglich<br>
      <b>ab 3 Datenmengen:</b> Mustererkennung<br>
      <b>ab 4 Datenmengen:</b> belastbarer Trend</p>
      <div class="grid">
        <button>Siege</button><button>Niederlagen</button>
        <button>Turnier</button><button>Punktspiel</button>
        <button>Training</button><button>LK</button>
      </div>
      <p class="muted">${S.matches.length} Matches gespeichert.</p>
    </div>
  `,"development");
}

function opponents(){
  const names=[...new Set(S.matches.map(m=>m.opponent))];
  shell("Gegner",`
    <div class="card">
      <h2>Gegnerinnen</h2>
      ${names.length?names.map(n=>`
        <div class="list">
          <span>${esc(n)}</span>
          <span class="pill">${S.matches.filter(m=>m.opponent===n).length} Matches</span>
        </div>`).join(""):"<p class='muted'>Noch keine Gegnerdaten.</p>"}
    </div>
  `,"opponents");
}

function settings(){
  shell("Einstellungen",`
    <div class="card">
      <div class="section">Startstand</div>
      <select id="set-start" class="input">
        <option value="0:0">0:0</option>
        <option value="2:2">2:2</option>
      </select>

      <div class="section">Punktwertung</div>
      <select id="set-ad" class="input">
        <option value="1">Ad</option>
        <option value="0">No-Ad</option>
      </select>

      <div class="section">Dritter Satz</div>
      <select id="set-third" class="input">
        <option value="match-tiebreak">Match-Tie-Break bis 10</option>
        <option value="normal">Ganzer Satz</option>
      </select>

      <button class="primary" style="margin-top:14px" onclick="saveSettings()">SPEICHERN</button>
    </div>

    <div class="card">
      <b>${esc(S.players[0].name)}</b>
      <p>Spielhand: ${esc(S.players[0].hand)} · LK ${esc(S.players[0].lk)}</p>
    </div>
  `,"home");

  document.querySelector("#set-start").value=S.settings.start;
  document.querySelector("#set-ad").value=S.settings.ad?"1":"0";
  document.querySelector("#set-third").value=S.settings.third;
}

function saveSettings(){
  S.settings.start=document.querySelector("#set-start").value;
  S.settings.ad=document.querySelector("#set-ad").value==="1";
  S.settings.third=document.querySelector("#set-third").value;
  save();
  toast("Gespeichert");
}

home();
</script>
</body>
</html>
