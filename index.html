/* V31 Serve dashboard UI */

/* V32: visual variety for Serve analysis */
.serve-columns{display:flex;align-items:flex-end;justify-content:space-around;gap:12px;height:190px;padding:18px 10px 8px}

background-image:
linear-gradient(#dfe9e2 1px,transparent 1px),
linear-gradient(90deg,#dfe9e2 1px,transparent 1px),

</style></head><body><div id="app"></div><script>
'use strict';
const KEY='tennis-analysis-v6';
const app=document.getElementById('app');
const D={players:[],activePlayerId:null,matches:[],matchArchive:[],developmentSelections:{},account:{plan:'basis'},currentMatchId:null,settings:{startScore:'0:0',ad:true,thirdSet:'match-tiebreak',appearance:'system'}};
let state=load(),hand=null,oppHand=null,mods={court:false,rally:false,serve:false,opponent:false},pendingPlanAction=null;
function load(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY)||'null');
    return x?{...D,...x,account:{...D.account,...(x.account||{})},settings:{...D.settings,...(x.settings||{})}}:JSON.parse(JSON.stringify(D));
  }catch(e){return JSON.parse(JSON.stringify(D))}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1500)}
function player(){return state.players.find(p=>p.id===state.activePlayerId)||null}
function profileRules(p=player()){
  const legacy=state.settings||{};
  const r=p?.rules||{};
  return {
    startScore:r.startScore||legacy.startScore||'0:0',
    ad:typeof r.ad==='boolean'?r.ad:(typeof legacy.ad==='boolean'?legacy.ad:true),
    thirdSet:r.thirdSet||legacy.thirdSet||'match-tiebreak'
  };
}
function matchRules(m){
  const p=(m?.playerId&&state.players.find(x=>x.id===m.playerId))||state.players.find(x=>x.name===m?.player)||player();
  const base=profileRules(p),r=m?.rules||{};
  return {
    startScore:r.startScore||base.startScore,
    ad:typeof r.ad==='boolean'?r.ad:base.ad,
    thirdSet:r.thirdSet||base.thirdSet
  };
}
function ruleSummary(r){
  return `${r.startScore==='2:2'?'Start 2:2':'Start 0:0'} · ${r.ad?'Mit Ad':'No-Ad'} · ${r.thirdSet==='match-tiebreak'?'3. Satz MTB':'3. Satz komplett'}`;
}
function planName(){
  const p=state.account?.plan||'basis';
  return p==='premium'?'Premium':p==='plus'?'Plus':'Basis';
}
function applyAppearance(){
  const mode=state.settings?.appearance||'system';
  document.body.classList.toggle('dark',mode==='dark');
  document.body.dataset.appearance=mode;
}
function setAppearance(mode){
  if(!['system','dark'].includes(mode))return;
  state.settings.appearance=mode;save();applyAppearance();settings();
}

function matchBelongsToPlayer(m,p=player()){
  if(!m||!p)return false;
  if(m.playerId)return m.playerId===p.id;
  return m.player===p.name;
}
function visiblePlayerMatches(){const p=player();return p?state.matches.filter(m=>matchBelongsToPlayer(m,p)):[]}
function archivedPlayerMatches(){const p=player();return p?(state.matchArchive||[]).filter(m=>matchBelongsToPlayer(m,p)):[]}
function matchOutcome(m){
  if(!m?.finished)return null;
  if(m.retirement?.by==='player')return 'loss';
  if(m.retirement?.by==='opponent')return 'win';
  const a=Number(m.sets?.[0]||0),b=Number(m.sets?.[1]||0);
  if(a>b)return 'win';if(b>a)return 'loss';return null;
}
function outcomeLabel(m){const o=matchOutcome(m);return o==='win'?'W':o==='loss'?'L':'—'}
function outcomeChip(m){const o=matchOutcome(m)||'open';return `<span class="outcome-chip ${o}">${outcomeLabel(m)}</span>`}
function retirementScoreText(m){
  const parts=[],completed=(m.completedSets||[]).filter(Boolean);
  completed.forEach((s,i)=>{let v=s;try{v=normalizedCompletedSet(m,i)||s}catch(e){}if(Array.isArray(v))parts.push(`${v[0]}:${v[1]}`)});
  const start=normalSetStartGames(m),g=m.games||[0,0],currentChanged=(g[0]!==start[0]||g[1]!==start[1])||!completed.length;
  if(m.matchTiebreak||m.tiebreak){
    const tb=m.tiebreakPoints||[0,0];
    if(tb[0]||tb[1])parts.push(`${m.matchTiebreak?'MTB':'TB'} ${tb[0]}:${tb[1]}`);
    else if(currentChanged)parts.push(`${g[0]}:${g[1]}`);
  }else if(currentChanged)parts.push(`${g[0]}:${g[1]}`);
  return `${parts.length?parts.join(' · '):`${g[0]}:${g[1]}`} · Aufg.`;
}
function developmentSelectionKey(){const p=player();return p?.id||'default'}
function developmentSourceMatches(){
  const all=[...visiblePlayerMatches(),...archivedPlayerMatches()],seen=new Set();
  return analysisSort(all.filter(m=>{if(seen.has(m.id))return false;seen.add(m.id);return (m.finished||m.status==='beendet'||m.status==='Aufgabe')&&(m.points||[]).length}));
}
function defaultDevelopmentIds(){return developmentSourceMatches().filter(m=>!m.retirement).slice(0,6).map(m=>m.id)}
function developmentSelectionConfig(){return state.developmentSelections?.[developmentSelectionKey()]||null}
function effectiveDevelopmentIds(){const c=developmentSelectionConfig();return c?.manual?[...(c.ids||[])]:defaultDevelopmentIds()}

function match(){const m=state.matches.find(m=>m.id===state.currentMatchId)||null;if(m){if(!m.currentSet)m.currentSet=Math.max(1,m.sets[0]+m.sets[1]+1);if(!m.setGames)m.setGames=[[...(m.games||[0,0])],[0,0],[0,0]];if(!m.completedSets)m.completedSets=[]}return m}
function running(){const m=match();return !!m&&!m.finished}
function shell(title,body,active='matches'){app.innerHTML=`<div class="app"><header class="top"><h1>${esc(title)}</h1><button class="gear" onclick="settings()">⚙</button></header><main class="content">${body}</main><nav class="nav"><button class="${active==='matches'?'active':''}" onclick="nav('matches')">●<br>Matches</button><button class="${active==='analysis'?'active':''}" onclick="nav('analysis')">▦<br>Analyse</button><button class="${active==='development'?'active':''}" onclick="nav('development')">↗<br>Entwicklung</button><button class="${active==='opponents'?'active':''}" onclick="nav('opponents')">◎<br>Gegner</button></nav></div>`}
function nav(x){const m=match();if(m&&!m.finished&&!m.navParked){parkPrompt(x);return}go(x)}
function parkPrompt(x){const e=document.createElement('div');e.className='modal';e.innerHTML='<div class="modalbox"><h3>Laufendes Match</h3><p class="muted">Das Match wird einmalig gespeichert. Du kannst es anschließend im Menüpunkt Matches fortsetzen.</p><div class="modal-actions"><button onclick="this.closest(\'.modal\').remove()">Abbrechen</button><button class="primary" onclick="leave(true,\'${x}\')">Speichern</button></div><button class="secondary" style="margin-top:8px" onclick="leave(false,\'${x}\')">Verwerfen</button></div>';e.querySelector('.primary').onclick=()=>leave(true,x);e.querySelector('.secondary').onclick=()=>leave(false,x);document.body.appendChild(e)}
function leave(saveIt,x){const m=match();if(saveIt&&m){m.status='nicht beendet';m.navParked=true;m.paused=true;state.currentMatchId=null;save()}else if(m){state.matches=state.matches.filter(a=>a.id!==m.id);state.currentMatchId=null;save()}document.querySelector('.modal')?.remove();go(x)}
function go(x){
  if(x==='matches')home();
  else if(x==='analysis')analysis();
  else if(x==='development')showPlans('premium','development');
  else if(x==='settings')settings();
  else showPlans('premium','');
}
function settings(){
  if(running()){parkPrompt('settings');return}
  applyAppearance();
  const ps=[...(state.players||[])].sort((a,b)=>(a.id===state.activePlayerId?-1:b.id===state.activePlayerId?1:0));
  const currentPlan=(state.account?.plan||'basis');
  shell('Einstellungen',`
    <div class="card">
      <div class="section">Spielerprofile</div>
      ${ps.length?ps.map(p=>{const r=profileRules(p),active=p.id===state.activePlayerId;return `<div class="settings-profile ${active?'active':''}">
        <div class="settings-profile-head">
          <div><div class="settings-profile-name">${esc(p.name)} ${active?'<span class="analysis-selected">Aktiv</span>':''}</div><div class="settings-profile-meta">${esc(p.hand)} · ${birthYearText(p)}</div></div>
          <div class="settings-profile-actions">
            ${active?'<button class="settings-profile-select" disabled>AKTIV</button>':`<button class="settings-profile-select" onclick="setActivePlayer('${p.id}','settings')">AUSWÄHLEN</button>`}
            <button onclick="editPlayerSettings('${p.id}')">ÄNDERN</button>
          </div>
        </div>
        <div class="settings-rule-summary"><div class="settings-rule-pill">${r.startScore==='2:2'?'Start 2:2':'Start 0:0'}</div><div class="settings-rule-pill">${r.ad?'Mit Ad':'No-Ad'}</div><div class="settings-rule-pill">${r.thirdSet==='match-tiebreak'?'MTB Satz 3':'Ganzer Satz 3'}</div></div>
      </div>`}).join(''):'<p class="muted">Noch kein Spielerprofil vorhanden.</p>'}
      ${ps.length?`<button class="secondary" style="width:100%;margin-top:10px" onclick="showPlans('premium','newProfile')">＋ WEITERES PROFIL · PREMIUM</button>`:`<button class="primary" onclick="editPlayerSettings('new')">SPIELER/-IN ANLEGEN</button>`}
    </div>

    <div class="card package-card ${currentPlan}">
      <div class="package-kicker">Aktuelles Paket</div><div class="package-name">${planName()}</div>
      <div class="package-copy">${currentPlan==='basis'?'1 Spielerprofil · Match erfassen · Matchübersicht · Matchverlauf':currentPlan==='plus'?'Basis + alle Detailanalysen':'Alles aus Plus + Entwicklung, Drucksituationen, Gegneranalyse und unbegrenzte Profile'}</div>
      <button style="width:100%;margin-top:10px" onclick="showPlans('${currentPlan}')">TARIFE ANSEHEN</button>
    </div>

    <div class="card">
      <div class="section">Ansicht</div>
      <div class="appearance-grid">
        <button class="appearance-choice ${(state.settings.appearance||'system')==='system'?'active':''}" onclick="setAppearance('system')"><div class="appearance-name">System</div><div class="appearance-copy">Aktuelle helle Standardansicht.</div></button>
        <button class="appearance-choice ${(state.settings.appearance||'system')==='dark'?'active':''}" onclick="setAppearance('dark')"><div class="appearance-name">Dark Mode</div><div class="appearance-copy">Dunkle Ansicht mit erhöhten Kontrasten.</div></button>
      </div>
      <div class="theme-placeholder"><div class="theme-title">Themenansichten · später</div><div class="theme-copy">Die Struktur bleibt für zusätzliche Designs offen, z. B. saisonale Court- oder Grand-Slam-inspirierte Themes.</div></div>
    </div>
  `,'');
}
function editPlayerSettings(playerId){
  const isNew=playerId==='new',p=isNew?null:state.players.find(x=>x.id===playerId);
  if(!isNew&&!p){settings();return}
  hand=p?.hand||null;
  const r=profileRules(p);
  shell(isNew?'Spielerprofil anlegen':'Profil bearbeiten',`
    <button class="analysis-back" onclick="settings()">↩ ZURÜCK ZU EINSTELLUNGEN</button>
    <div class="card">
      <div class="section">Profil</div>
      <input id="pn" class="input" value="${esc(p?.name||'')}" placeholder="Name">
      <div class="section">Spielhand</div><div class="grid"><button id="hr" class="${hand==='Rechts'?'selected':''}" onclick="pickHand('Rechts')">Rechtshändig</button><button id="hl" class="${hand==='Links'?'selected':''}" onclick="pickHand('Links')">Linkshändig</button></div>
      <div class="section">Geburtsjahr</div><input id="pby" class="input" inputmode="numeric" value="${esc(p?.birthYear||'')}" placeholder="z. B. 2015">
    </div>
    <div class="card">
      <div class="section">Standard-Regelwerk dieses Profils</div>
      <div class="muted small">Diese Regeln werden beim Start eines neuen Matches vorausgewählt und können dort für das einzelne Match geändert werden.</div>
      <div class="section">Startspielstand</div><select id="start" class="input"><option value="0:0">0:0</option><option value="2:2">2:2</option></select>
      <div class="section">Punktwertung</div><select id="ad" class="input"><option value="1">Mit Ad</option><option value="0">Ohne Ad (No-Ad)</option></select>
      <div class="section">Dritter Satz</div><select id="third" class="input"><option value="match-tiebreak">Match-Tie-Break bis 10</option><option value="normal">Ganzer Satz</option></select>
      <button class="primary" style="margin-top:14px" onclick="savePlayerSettings('${isNew?'new':p.id}')">PROFIL SPEICHERN</button>
    </div>
  `,'');
  document.getElementById('start').value=r.startScore;
  document.getElementById('ad').value=r.ad?'1':'0';
  document.getElementById('third').value=r.thirdSet;
}
function savePlayerSettings(playerId){
  const n=document.getElementById('pn').value.trim(),by=document.getElementById('pby').value.trim();
  if(!n||!hand){toast('Name und Spielhand erforderlich.');return}
  if(by&&(!/^\d{4}$/.test(by)||Number(by)<1900||Number(by)>currentYear())){toast('Geburtsjahr prüfen.');return}
  const rules={startScore:document.getElementById('start').value,ad:document.getElementById('ad').value==='1',thirdSet:document.getElementById('third').value};
  let p=playerId==='new'?null:state.players.find(x=>x.id===playerId);
  if(!p){
    p={id:id(),name:n,hand,birthYear:by?Number(by):null,rules};state.players.push(p);state.activePlayerId=p.id;
  }else{
    const oldName=p.name;
    [...state.matches,...(state.matchArchive||[])].forEach(m=>{if(!m.playerId&&m.player===oldName)m.playerId=p.id});
    p.name=n;p.hand=hand;p.birthYear=by?Number(by):null;p.rules=rules;
  }
  save();settings();
}
function pickHand(x){hand=x;document.getElementById('hr').classList.toggle('selected',x==='Rechts');document.getElementById('hl').classList.toggle('selected',x==='Links')}
function savePlayer(){const p=player();if(p)editPlayerSettings(p.id);else editPlayerSettings('new')}
function saveRules(){const p=player();if(p)editPlayerSettings(p.id)}
function currentYear(){return new Date().getFullYear()}
function birthYearText(p){return p?.birthYear?`Jahrgang ${esc(p.birthYear)}`:'Jahrgang nicht angegeben'}
function latestPlayerMatch(p){
  return analysisSort(state.matches.filter(m=>(m.playerId&&m.playerId===p?.id)||(!m.playerId&&m.player===p?.name)))[0]||null;
}
function latestPlayerLK(p){return latestPlayerMatch(p)?.playerLK||''}
function latestPlayerClass(p){return latestPlayerMatch(p)?.playerClass||''}
function classOptions(selected=''){
  const vals=['','U9','U10','U11','U12','U13','U14','U15','U16','U17','U18','Damen','Herren'];
  return vals.map(v=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${v||'Nicht angegeben'}</option>`).join('');
}
function setActivePlayer(id,destination='home'){
  if(!state.players.some(p=>p.id===id))return;
  state.activePlayerId=id;
  state.analysisMatchId=null;
  save();
  document.querySelector('.modal')?.remove();
  if(destination==='settings')settings();else home();
  requestAnimationFrame(()=>window.scrollTo(0,0));
}
function showPlayerSwitcher(){
  const ps=state.players||[];
  const e=document.createElement('div');e.className='modal';
  e.innerHTML=`<div class="modalbox"><div class="plan-head"><div><div class="plan-title">Spieler/-in wählen</div><div class="plan-copy">Das aktive Profil bestimmt neue Matches und die zugehörige Entwicklung.</div></div><button style="min-width:42px;min-height:42px;padding:8px" onclick="this.closest('.modal').remove()">×</button></div>
    <div class="profile-list" style="margin-top:12px">${ps.map(p=>`<button class="profile-choice ${p.id===state.activePlayerId?'active':''}" onclick="setActivePlayer('${p.id}')"><div class="profile-choice-name">${esc(p.name)}</div><div class="profile-choice-meta">${esc(p.hand)} · ${birthYearText(p)}</div></button>`).join('')}</div>
    <button class="secondary" style="width:100%;margin-top:10px" onclick="this.closest('.modal').remove();showPlans('premium','newProfile')">＋ WEITERES PROFIL</button>
  </div>`;
  document.body.appendChild(e);
}
function startNewPlayerProfile(){document.querySelector('.modal')?.remove();editPlayerSettings('new')}
function pickNewHand(x){
  hand=x;
  document.getElementById('nhr')?.classList.toggle('selected',x==='Rechts');
  document.getElementById('nhl')?.classList.toggle('selected',x==='Links');
}
function saveNewPlayerProfile(){
  const n=document.getElementById('npn').value.trim(),by=document.getElementById('nby').value.trim();
  if(!n||!hand){toast('Name und Spielhand erforderlich.');return}
  if(by&&(!/^\d{4}$/.test(by)||Number(by)<1900||Number(by)>currentYear())){toast('Geburtsjahr prüfen.');return}
  const p={id:id(),name:n,hand,birthYear:by?Number(by):null};
  state.players.push(p);state.activePlayerId=p.id;save();home();
}
function showPlans(target='plus',action='',matchId=''){
  pendingPlanAction={action,matchId};
  const e=document.createElement('div');e.className='modal plan-modal';
  const card=(key,name,sub,items,premium=false)=>`<div class="plan-card ${premium?'premium':''} ${target===key?'target':''}">
    ${target===key?'<span class="plan-target-badge">Diese Funktion</span>':''}
    <div class="plan-name">${name}</div><div class="plan-sub">${sub}</div><div class="plan-price">Preis wird noch festgelegt</div>
    <ul class="plan-list">${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
  e.innerHTML=`<div class="modalbox">
    <div class="plan-head"><div><div class="plan-title">Welcher Tarif passt?</div><div class="plan-copy">Die Preise sind noch nicht final. Die Funktionsaufteilung entspricht dem aktuellen Produktstand.</div></div><button style="min-width:42px;min-height:42px;padding:8px" onclick="this.closest('.modal').remove()">×</button></div>
    <div class="plan-grid">
      ${card('basis','Basis','1 Spielerprofil',['Match erfassen','Matchübersicht','Matchverlauf'])}
      ${card('plus','Plus','1 Spielerprofil · alles aus Basis',['VH / RH / Volley','Ballplatzierung','Ballwechsel','Aufschlag'])}
      ${card('premium','Premium','Unbegrenzte Spielerprofile · alles aus Plus',['Entwicklung über mehrere Matches','Drucksituationen','Gegneranalyse','Unbegrenzte Spielerprofile'],true)}
    </div>
    <div class="plan-actions"><button onclick="this.closest('.modal').remove()">SCHLIESSEN</button>${action?'<button class="primary" onclick="openPlanPreview()">VORSCHAU ÖFFNEN</button>':''}</div>
    <div class="plan-note">Die Vorschau dient aktuell dem Test der App. Bezahlzugang und Preise werden später technisch angebunden.</div>
  </div>`;
  document.body.appendChild(e);
}
function openPlanPreview(){
  const a=pendingPlanAction||{};pendingPlanAction=null;document.querySelector('.modal')?.remove();
  const id=a.matchId||selectedAnalysisMatchId();
  if(a.action==='strokes')strokeAnalysis(id);
  else if(a.action==='court')placementAnalysis(id);
  else if(a.action==='rally')rallyAnalysis(id);
  else if(a.action==='serve')serveAnalysis(id);
  else if(a.action==='pressure')pressureAnalysis(id);
  else if(a.action==='development')development();
  else if(a.action==='newProfile')startNewPlayerProfile();
}
function backToAnalysis(){
  analysis();
  requestAnimationFrame(()=>window.scrollTo({top:0,left:0,behavior:'auto'}));
}
function analysisBackButton(){return `<button class="analysis-back" onclick="backToAnalysis()">↩ ZUR ANALYSEAUSWAHL</button>`}
function showDevelopmentMatches(){
  const visible=analysisSort(visiblePlayerMatches().filter(m=>m.finished&&(m.points||[]).length)),selected=new Set(effectiveDevelopmentIds());
  const archivedSelected=[...selected].filter(id=>!visible.some(m=>m.id===id)&&archivedPlayerMatches().some(m=>m.id===id));
  const e=document.createElement('div');e.className='modal';
  e.innerHTML=`<div class="modalbox"><div class="plan-head"><div><div class="plan-title">Analysierte Matches</div><div class="plan-copy">Wähle bis zu 6 Matches für die Entwicklungsansicht. Standard sind die letzten 6 vollständigen Matches ohne Aufgabe.</div></div><button style="min-width:42px;min-height:42px;padding:8px" onclick="this.closest('.modal').remove()">×</button></div>
    <div style="margin-top:10px">${visible.length?visible.map(m=>`<label class="dev-select-row"><input type="checkbox" class="dev-match-check" value="${m.id}" ${selected.has(m.id)?'checked':''} onchange="limitDevelopmentChecks(this)"><div><div class="dev-select-name">${outcomeChip(m)}${esc(m.opponent)} · ${esc(analysisResultText(m))}</div><div class="dev-select-meta">${formatMatchDate(m)} · ${esc(m.type||'Spielart nicht angegeben')}${m.playerClass?' · '+esc(m.playerClass):''}${m.retirement?' · Aufgabe':''}</div></div></label>`).join(''):'<div class="pressure-empty">Keine sichtbaren Matches vorhanden.</div>'}</div>

function serveSide(m){
  const total=m.tiebreak?((m.tiebreakPoints?.[0]||0)+(m.tiebreakPoints?.[1]||0)):((m.gamePoints?.[0]||0)+(m.gamePoints?.[1]||0));
  return total%2===0?'right':'left';
}
function point(){
 const m=match();
 if(!m)return home();
 if(m.paused)return pause();
 const p=m.pending||{},pn=esc(m.player),server=serverForCurrentState(m);
 if(m.mods.serve&&server==='player'&&!m.pending&&!m.serveDraft?.complete){serveCapture();return}
 let shotHtml='';
 let label='';
 if(p.kind==='error'){
   label=p.winner==='player'
     ? 'Nach welchem Schlag von '+pn+' machte die Gegnerin den Fehler?'
     : 'Welcher Schlag von '+pn+' war der Fehler?';

   if(p.winner==='player'){
     // Gegnerfehler: Wir erfassen den unmittelbar vorherigen Schlag von Mia.
     // Mia schlägt auf -> Aufschlag möglich, Return unmöglich.
     // Gegnerin schlägt auf -> Return möglich, Aufschlag unmöglich.
     // Doppelfehler ist ein Sonderfall und nur möglich, wenn die Gegnerin aufschlägt.
     const playerIsServer=server==='player';
     const choices=[
       ['Aufschlag',playerIsServer],
       ['Return',!playerIsServer],
       ['Vorhand',true],
       ['Rückhand',true],
       ['Volley',true],
       ['Doppelfehler',!playerIsServer]
     ];
     shotHtml=choices.map(([x,active])=>active
       ? `<button class="${p.shot===x?'selected':''}" onclick="shot('${x}')">${x}</button>`
       : `<button disabled class="v8-disabled">${x}</button>`
     ).join('');
   }else{
     // Mia-Fehler: Der Fehlerschlag gehört Mia selbst.
     // Bei eigenem Aufschlag kann ein Punkt nur durch Doppelfehler enden;
     // beim gegnerischen Aufschlag kann Mia einen Returnfehler machen.
     const playerIsServer=server==='player';
     const choices=[
       ['Aufschlag',false],
       ['Return',!playerIsServer],
       ['Vorhand',true],
       ['Rückhand',true],
       ['Volley',true],
       ['Doppelfehler',playerIsServer]
     ];
     shotHtml=choices.map(([x,active])=>active
       ? `<button class="${p.shot===x?'selected':''}" onclick="shot('${x}')">${x}</button>`
       : `<button disabled class="v8-disabled">${x}</button>`
     ).join('');
   }
 }else if(p.kind==='winner'){
   const winnerIsServer=p.winner===server;
   const primaryShot=winnerIsServer?'Aufschlag':'Return';
   const inactiveShot=primaryShot==='Aufschlag'?'Return':'Aufschlag';
   label=p.winner==='player'?'Welcher Schlag von '+pn+'?':'Welcher Schlag der Gegnerin?';
   shotHtml=[primaryShot,'Vorhand','Rückhand','Volley']
     .map(x=>`<button class="${p.shot===x?'selected':''}" onclick="shot('${x}')">${x}</button>`)
     .join('')+`<button disabled class="v8-disabled">${inactiveShot}</button>`;
 }
 shell(`${pn} – ${esc(m.opponent)}`,score(m)+`<div class="card">
   <div class="section">Wer hat den Punkt gemacht?</div>
   <div class="grid">
     <button class="${p.winner==='player'?'selected':''}" onclick="winner('player')">${pn}</button>
     <button class="${p.winner==='opponent'?'selected':''}" onclick="winner('opponent')">${esc(m.opponent)}</button>
   </div>
   ${p.winner?`<div class="section">${p.winner==='player'?'Wie hat '+pn+' den Punkt gewonnen?':'Wie hat die Gegnerin den Punkt gewonnen?'}</div>
   <div class="grid">
     <button class="${p.kind==='winner'?'selected':''}" onclick="kind('winner')">${p.winner==='player'?pn+'-Winner':'Gegner-Winner'}</button>
     <button class="${p.kind==='error'?'selected':''}" onclick="kind('error')">${p.winner==='player'?'Gegnerfehler':pn+'-Fehler'}</button>
   </div>`:''}
   ${p.kind?`<div class="section">${label}</div><div class="grid">${shotHtml}</div>`:''}
 </div>
 <button class="primary" onclick="nextPoint()">WEITER</button>
 <button class="secondary" style="margin-top:8px" onclick="pauseCapture()">ERFASSUNGS-PAUSE</button>
 <button class="end-match-button" onclick="finishOptions()">MATCH BEENDEN</button>
 <button style="width:100%;margin-top:8px" onclick="undoAsk()">↩ ZURÜCK</button>`,'matches')
}

function serveDraft(m){
  if(!m.serveDraft)m.serveDraft={stage:'firstOutcome',first:{},second:{},complete:false};
  return m.serveDraft;
}
function serveZoneLabels(side){
  return side==='right'?['T','Mitte','Außen']:['Außen','Mitte','T'];
}
function serveCapture(){
  const m=match();if(!m)return;
  const d=serveDraft(m),side=serveSide(m),labels=serveZoneLabels(side);
  let body='';

  if(d.stage==='firstOutcome'){
    body=`<div class="card"><div class="section">1. Aufschlag</div>
      <div class="grid">
        <button onclick="serveCaptureSet('firstOutcome','in')">DRIN</button>
        <button onclick="serveCaptureSet('firstOutcome','error')">FEHLER</button>
      </div></div>`;
  }else if(d.stage==='firstError'){
    body=`<div class="card"><div class="section">1. Aufschlag – Fehler</div>
      <div class="grid">
        ${['Netz','Lang','Seitlich'].map(x=>`<button class="${d.first.errorType===x?'selected':''}" onclick="serveCaptureSet('firstError','${x}')">${x}</button>`).join('')}
      </div></div>`;
  }else if(d.stage==='secondOutcome'){
    body=`<div class="card"><div class="section">2. Aufschlag</div>
      <div class="grid">
        <button onclick="serveCaptureSet('secondOutcome','in')">DRIN</button>
        <button onclick="serveCaptureSet('secondOutcome','error')">FEHLER</button>
      </div></div>`;
  }else if(d.stage==='secondError'){
    body=`<div class="card"><div class="section">2. Aufschlag – Fehler</div>
      <div class="grid">
        ${['Netz','Lang','Seitlich'].map(x=>`<button class="${d.second.errorType===x?'selected':''}" onclick="serveCaptureSet('secondError','${x}')">${x}</button>`).join('')}
      </div>
      <p class="muted">Der Punkt wird anschließend automatisch als Doppelfehler erfasst.</p></div>`;
  }else if(d.stage==='firstPlacement'||d.stage==='secondPlacement'){
    const n=d.stage==='firstPlacement'?'1.':'2.';
    const selected=d.stage==='firstPlacement'?d.first.placement:d.second.placement;
    body=`<div class="card">
      <div class="section">${n} Aufschlag – Platzierung</div>
      <div style="text-align:center;font-weight:800;margin-bottom:8px">Feldhälfte Gegnerin</div>
      <div class="v8-court-wrap"><div class="v8-court-half">
        <div class="v8-net">NETZ</div>
        <div class="v8-court-lines"><div class="v8-service-line"></div><div class="v8-center-line"></div></div>
        <div class="v8-serve-target ${side}">
          ${labels.map(x=>`<button type="button" data-serve-zone="${x}" class="v8-cell ${selected===x?'selected-cell':''}" onclick="servePlacementPick(event,'${d.stage}','${x}')"><span style="font-size:11px;font-weight:800">${x}</span></button>`).join('')}
        </div>
      </div></div>
      <div class="v8-court-caption">Aufschlagseite ${side==='right'?'rechts':'links'} · T / Mitte / Außen</div>
      <button type="button" class="primary" style="margin-top:12px" onclick="servePlacementNext('${d.stage}')">WEITER</button>
    </div>`;
  }else if(d.stage==='firstEffect'||d.stage==='secondEffect'){
    const n=d.stage==='firstEffect'?'1.':'2.';
    const selected=d.stage==='firstEffect'?d.first.effect:d.second.effect;
    body=`<div class="card"><div class="section">${n} Aufschlag – Wirkung</div>
      <div class="grid">
        ${[
          ['Direkter Punkt','direct'],
          ['Schwacher Return','weak'],
          ['Normaler Ballwechsel','neutral']
        ].map(([label,val])=>`<button class="${selected===val?'selected':''}" onclick="serveCaptureSet('${d.stage}','${val}')">${label}</button>`).join('')}
      </div></div>`;
  }

  shell('Aufschlag',score(m)+body+
    `<button style="width:100%;margin-top:8px" onclick="serveCaptureBack()">↩ ZURÜCK</button>
     <button class="secondary" style="margin-top:8px" onclick="pauseCapture()">ERFASSUNGS-PAUSE</button>`,'matches');
}

function servePlacementPick(ev,stage,value){
  if(ev){ev.preventDefault();ev.stopPropagation();}
  const m=match(),d=serveDraft(m);
  if(stage==='firstPlacement')d.first.placement=value;
  else if(stage==='secondPlacement')d.second.placement=value;
  save();

  // Auswahl nur sichtbar markieren. Kein Rendern, kein automatischer Maskenwechsel.
  document.querySelectorAll('[data-serve-zone]').forEach(b=>b.classList.remove('selected-cell'));
  const btn=ev?.currentTarget;
  if(btn)btn.classList.add('selected-cell');
}
function servePlacementNext(stage){
  const m=match(),d=serveDraft(m);
  const selected=stage==='firstPlacement'?d.first.placement:d.second.placement;
  if(!selected){toast('Bitte Platzierung auswählen.');return}
  if(stage==='firstPlacement'){
    d.first.side=serveSide(m);
    d.stage='firstEffect';
  }else{
    d.second.side=serveSide(m);
    d.stage='secondEffect';
  }
  save();
  serveCapture();
}
function serveCaptureSet(stage,value){
  const m=match(),d=serveDraft(m);
  if(stage==='firstOutcome'){
    if(value==='in'){d.first={in:true};d.stage='firstPlacement'}
    else{d.first={in:false};d.stage='firstError'}
  }else if(stage==='firstError'){
    d.first.errorType=value;d.stage='secondOutcome';
  }else if(stage==='secondOutcome'){
    if(value==='in'){d.second={in:true};d.stage='secondPlacement'}
    else{d.second={in:false};d.stage='secondError'}
  }else if(stage==='secondError'){
    d.second.errorType=value;d.complete=true;
    m.pending={winner:'opponent',kind:'error',shot:'Doppelfehler',serve:'second',errorType:value};
    save();finishPoint();return;
  }else if(stage==='firstPlacement'||stage==='secondPlacement'){
    // V29: Platzierung darf ausschließlich über servePlacementPick + WEITER erfolgen.
    return;
  }else if(stage==='firstEffect'){
    d.first.effect=value;d.complete=true;
    if(value==='direct'){
      m.pending={winner:'player',kind:'winner',shot:'Aufschlag',serve:'first',errorType:null};
      if(m.mods.rally)m.rally='1';
      save();finishPoint();return;
    }
  }else if(stage==='secondEffect'){
    d.second.effect=value;d.complete=true;
    if(value==='direct'){
      m.pending={winner:'player',kind:'winner',shot:'Aufschlag',serve:'second',errorType:null};
      if(m.mods.rally)m.rally='1';
      save();finishPoint();return;
    }
  }
  save();
  if(d.complete)point();else serveCapture();
}
function serveCaptureBack(){
  const m=match(),d=serveDraft(m);
  const prev={
    firstError:'firstOutcome',
    firstPlacement:'firstOutcome',
    firstEffect:'firstPlacement',
    secondOutcome:'firstError',
    secondError:'secondOutcome',
    secondPlacement:'secondOutcome',
    secondEffect:'secondPlacement'
  };
  if(prev[d.stage])d.stage=prev[d.stage];
  else{m.serveDraft=null;point();return}
  save();serveCapture();
}
function winner(x){const m=match();m.pending={winner:x,kind:null,shot:null,serve:null,errorType:null};save();point()}function kind(x){const m=match();m.pending={...m.pending,kind:x,shot:null,serve:null,errorType:null};save();point()}function shot(x){const m=match();m.pending={...m.pending,shot:x};save();point()}function serve(x){const m=match();m.pending={...m.pending,serve:x};save();point()}
function nextPoint(){const m=match(),p=m.pending;if(!p||!p.winner||!p.kind||!p.shot){toast('Bitte alle erforderlichen Angaben auswählen.');return}if(p.shot==='Doppelfehler')p.serve='second';if(p.kind==='error'){errorMask();return}if(m.mods.court){court();return}if(m.mods.rally){rally();return}finishPoint()}function errorMask(){const m=match(),p=m.pending;shell('Fehlerart',`<div class="card"><div class="section">Welche Fehlerart?</div><div class="grid">${['Netz','Seitenaus','Längenaus','Sonstiger Fehler'].map(x=>`<button class="${p.errorType===x?'selected':''}" onclick="errorPick('${x}')">${x}</button>`).join('')}</div><button class="${p.errorType==='ns'?'selected':''}" style="width:100%;margin-top:10px" onclick="errorPick('ns')">NICHT GESEHEN</button></div><button class="primary" onclick="errorNext()">WEITER</button><button style="width:100%;margin-top:8px" onclick="point()">↩ ZURÜCK</button>`,'matches')}function errorPick(x){match().pending.errorType=x;save();errorMask()}function errorNext(){const m=match(),p=m.pending;if(!p.errorType){toast('Bitte Fehlerart auswählen.');return}
  // Gegnerfehler nach eigenem Aufschlag:
  // Mit Serve-Modul wurde die Aufschlagplatzierung bereits im Serve-Workflow erfasst.
  // Ohne Serve-Modul darf Court die Aufschlagplatzierung im passenden Aufschlagfeld erfassen.
  const serveCausedReturnError=p.winner==='player'&&p.kind==='error'&&p.shot==='Aufschlag';
  if(serveCausedReturnError&&m.mods.serve){
    if(m.mods.rally){rally();return}
    finishPoint();return
  }
  if(m.mods.court&&p.winner==='player'&&p.shot!=='Doppelfehler'){court();return}
  if(m.mods.rally&&p.shot!=='Doppelfehler'){rally();return}
  finishPoint()
}
function court(){
  const m=match(),p=m.pending;
  const isServePlacement=p.shot==='Aufschlag'&&p.winner==='player'&&(p.kind==='winner'||p.kind==='error');
  const side=serveSide(m);
  let label='Ballplatzierung',half='';

  if(p.winner==='player'&&p.kind==='winner'){
    label='Wo landete '+m.player+'s '+p.shot+'-Winner?';
    half='Feldhälfte Gegnerin';
  }else if(p.winner==='opponent'&&p.kind==='winner'){
    label='Wo landete der Winner der Gegnerin?';
    half='Feldhälfte '+m.player;
  }else if(p.winner==='player'&&p.kind==='error'){
    label=p.shot==='Aufschlag'
      ? 'Wo landete '+m.player+'s Aufschlag vor dem Returnfehler?'
      : 'Wo landete '+m.player+'s Ball vor dem Gegnerfehler?';
    half='Feldhälfte Gegnerin';
  }else if(p.winner==='opponent'&&p.kind==='error'){
    label='Ballplatzierung vor dem Fehler von '+m.player;
    half='Feldhälfte '+m.player;
  }

  let grid;
  if(isServePlacement){
    grid=`<div class="v8-serve-target ${side}">${Array.from({length:3},(_,i)=>`<button class="v8-cell ${m.court===('S'+side+i)?'selected-cell':''}" onclick="cell('S${side}${i}')"></button>`).join('')}</div>`;
  }else{
    grid=`<div class="v8-court-grid">${Array.from({length:9},(_,i)=>`<button class="v8-cell ${m.court===i?'selected-cell':''}" onclick="cell(${i})"></button>`).join('')}</div>`;
  }

  shell('Court',`<div class="card">
    ${half?`<div class="court-half-owner"><span>${esc(half)}</span></div>`:''}
    <div class="court-question">${esc(label)}</div>
    <div class="v8-court-wrap"><div class="v8-court-half">
      <div class="v8-net">NETZ</div>
      <div class="v8-court-lines"><div class="v8-service-line"></div><div class="v8-center-line"></div></div>
      ${grid}
    </div></div>
    <div class="v8-court-caption">${isServePlacement?'Aufschlagfeld: '+(side==='right'?'rechts':'links')+' – links / Mitte / rechts':'Feld auswählen'}</div>
    <button class="${m.court==='ns'?'selected':''}" style="width:100%;margin-top:10px" onclick="cell('ns')">NICHT GESEHEN</button>
  </div>
  <button class="primary" onclick="courtNext()">WEITER</button>
  <button style="width:100%;margin-top:8px" onclick="point()">↩ ZURÜCK</button>`,'matches')
}
function cell(x){const m=match();m.court=x;save();court()}
function courtNext(){const m=match();if(m.court===null||m.court===undefined){toast('Bitte Feld auswählen oder Nicht gesehen.');return}m.mods.rally?rally():finishPoint()}
function rally(){const m=match(),p=m.pending;const directWinner=!!(p&&p.kind==='winner'&&(p.shot==='Aufschlag'||p.shot==='Return'));if(directWinner)m.rally='1';shell('Ballwechsel',`<div class="card"><div class="section">Dauer des Ballwechsels (eigene Schlagzahl)</div><div class="grid">${['1','2–3','4–6','7+'].map(x=>{const locked=directWinner&&x!=='1';return `<button class="${(directWinner?x==='1':m.rally===x)?'selected':''}" ${locked?'disabled':''} onclick="${locked?'':'rallyPick(\''+x+'\')'}">${x} Schläge</button>`}).join('')}</div><button class="${m.rally==='ns'?'selected':''}" style="width:100%;margin-top:10px" ${directWinner?'disabled':''} onclick="${directWinner?'':'rallyPick(\'ns\')'}">NICHT GESEHEN</button></div><button class="primary" onclick="rallyNext()">BESTÄTIGEN</button><button style="width:100%;margin-top:8px" onclick="point()">↩ ZURÜCK</button>`,'matches')}
function rallyPick(x){match().rally=x;save();rally()}function rallyNext(){if(!match().rally){toast('Bitte Ballwechseldauer wählen.');return}finishPoint()}
function finishPoint(){const m=match(),p=m.pending;const serveDetail=m.serveDraft?.complete?JSON.parse(JSON.stringify(m.serveDraft)):null;m.points.push({...p,court:m.court??null,rally:m.rally??null,serveDetail});if(m.tiebreak){const i=p.winner==='player'?0:1;m.tiebreakPoints[i]++;const total=m.tiebreakPoints[0]+m.tiebreakPoints[1];const wasMatchTiebreak=!!m.matchTiebreak;const target=wasMatchTiebreak?10:7;if((m.tiebreakPoints[i]>=target&&m.tiebreakPoints[i]-m.tiebreakPoints[1-i]>=2)){const tbFinal=[m.tiebreakPoints[0],m.tiebreakPoints[1]];const finishedSetIndex=Math.max(0,(m.currentSet||1)-1);if(wasMatchTiebreak){m.completedSets.push(tbFinal)}else{const setFinal=i===0?[7,6]:[6,7];m.completedSets.push(setFinal);m.completedSetTiebreaks=m.completedSetTiebreaks||[];m.completedSetTiebreaks[finishedSetIndex]=tbFinal;m.setGames=m.setGames||[[0,0],[0,0],[0,0]];m.setGames[finishedSetIndex]=setFinal}m.sets[i]++;m.currentSet++;
const nextStart=wasMatchTiebreak?[0,0]:normalSetStartGames(m);
m.games=[...nextStart];
m.gamePoints=[0,0];
if(!wasMatchTiebreak){
  m.setGames=m.setGames||[[0,0],[0,0],[0,0]];
  m.setGames[m.currentSet-1]=[...nextStart];
}
m.tiebreak=false;m.tiebreakPending=false;m.matchTiebreak=false;m.tiebreakPoints=[0,0];
if(!wasMatchTiebreak){
  m.server=m.server==='player'?'opponent':'player';
  if(m.sets[0]===1&&m.sets[1]===1&&matchRules(m).thirdSet==='match-tiebreak'){
    m.currentSet=3;m.games=[0,0];m.gamePoints=[0,0];m.setGames[2]=[0,0];
    m.tiebreak=true;m.matchTiebreak=true;m.tiebreakPending=false;m.tiebreakPoints=[0,0]
  }
}}else{if(total%2===1)m.server=m.server==='player'?'opponent':'player'}}else{addPoint(m,p.winner)}m.pending=null;m.court=null;m.rally=null;m.serveDraft=null;if(m.sets[0]>=2||m.sets[1]>=2){m.finished=true;m.status='beendet';m.completedAt=Date.now();state.currentMatchId=null;save();finishView(m);return}save();point()}

function normalSetStartGames(m){
  if(Array.isArray(m?.startGames)&&m.startGames.length===2)return [...m.startGames];
  const configured=String(matchRules(m).startScore||'0:0').split(':').map(Number);
  return configured.length===2&&configured.every(Number.isFinite)?configured:[0,0];
}
function addPoint(m,w){
  const i=w==='player'?0:1,o=1-i,g=m.gamePoints,rules=matchRules(m);
  if(g[0]>=3&&g[1]>=3){
    if(!rules.ad){game(m,i);return}
    if(g[0]===g[1]){g[i]=4;g[o]=3;return}
    if(g[i]===4){game(m,i);return}
    g[0]=3;g[1]=3;return
  }
  g[i]++;if(g[i]>=4&&g[i]>g[o])game(m,i)
}
function game(m,i){m.games[i]++;if(!m.setGames)m.setGames=[[0,0],[0,0],[0,0]];m.setGames[m.currentSet-1]=[...m.games];m.gamePoints=[0,0];m.server=m.server==='player'?'opponent':'player';if(m.games[i]>=6&&m.games[i]-m.games[1-i]>=2)setWon(m,i);else if(m.games[0]===6&&m.games[1]===6){m.tiebreakPending=true;m.tiebreak=true;m.tiebreakPoints=[0,0]}}function setWon(m,i){
  m.completedSets.push([...m.games]);
  m.sets[i]++;
  m.currentSet++;
  const nextStart=normalSetStartGames(m);
  m.games=[...nextStart];
  m.setGames[m.currentSet-1]=[...nextStart];
  m.gamePoints=[0,0];
  m.tiebreakPending=false;
  m.tiebreak=false;
  m.tiebreakPoints=[0,0];
  m.matchTiebreak=false;
  m.setFirstServers=m.setFirstServers||[];
  m.setFirstServers[m.currentSet-1]=m.server;
  if(m.sets[0]===1&&m.sets[1]===1&&matchRules(m).thirdSet==='match-tiebreak'){
    m.currentSet=3;
    m.games=[0,0];
    m.gamePoints=[0,0];
    m.setGames[2]=[0,0];
    m.tiebreak=true;
    m.matchTiebreak=true;
    m.tiebreakPending=false;
    m.tiebreakPoints=[0,0];
  }
}
function finishView(m){
  if(m.retirement){
    const by=m.retirement.by==='player'?m.player:m.opponent;
    shell('Match beendet',`<div class="card"><h2>${esc(m.player)} – ${esc(m.opponent)}</h2><div class="score-block"><div class="score-label">Gespielter Stand</div><div class="score-value" style="font-size:24px">${esc(retirementScoreText(m))}</div><div class="retirement-badge">Aufgabe · ${esc(by)}</div></div><button class="primary" onclick="openAnalysisForMatch('${m.id}')">ANALYSE ÖFFNEN</button></div>`,'matches');return;
  }
  const src=m.manualSets||m.completedSets||[];
  const rows=src.map((x,i)=>{if(!x)return'';const isMTB=(m.rules?.thirdSet||state.settings.thirdSet)==='match-tiebreak'&&i===2&&m.sets[0]+m.sets[1]===3;const v=m.manualSets?x:(isMTB?x:normalizedCompletedSet(m,i));return `<div class="row"><span>${isMTB?'Match-Tie-Break':'Satz '+(i+1)}</span><b>${v[0]} : ${v[1]}</b></div>`}).join('');
  shell('Match beendet',`<div class="card"><h2>${esc(m.player)} – ${esc(m.opponent)}</h2><div class="score-block"><div class="score-label">Sätze</div><div class="score-value point-value">${m.sets[0]} : ${m.sets[1]}</div></div>${rows||`<div class="row"><span>Spiele</span><b>${m.games[0]} : ${m.games[1]}</b></div>`}<button class="primary" onclick="openAnalysisForMatch('${m.id}')">ANALYSE ÖFFNEN</button></div>`,'matches')
}
function scoreSnapshot(m){
  return {
    sets:[...(m.sets||[0,0])],
    currentSet:m.currentSet||1,
    completedSets:(m.completedSets||[]).map(x=>[...x]),
    setGames:(m.setGames||[[0,0],[0,0],[0,0]]).map(x=>[...(x||[0,0])]),
    games:[...(m.games||[0,0])],
    gamePoints:[...(m.gamePoints||[0,0])],
    tiebreak:!!m.tiebreak,
    matchTiebreak:!!m.matchTiebreak,
    tiebreakPoints:[...(m.tiebreakPoints||[0,0])],
    server:m.server||null
  };
}
function snapshotKey(s){
  return JSON.stringify({
    sets:s.sets,currentSet:s.currentSet,completedSets:s.completedSets,setGames:s.setGames,
    games:s.games,gamePoints:s.gamePoints,tiebreak:s.tiebreak,matchTiebreak:s.matchTiebreak,
    tiebreakPoints:s.tiebreakPoints
  });
}
function snapshotScoreText(s){
  if(s.matchTiebreak)return `Sätze ${s.sets[0]}:${s.sets[1]} · MTB ${s.tiebreakPoints[0]}:${s.tiebreakPoints[1]}`;
  if(s.tiebreak)return `Sätze ${s.sets[0]}:${s.sets[1]} · Spiele ${s.games[0]}:${s.games[1]} · TB ${s.tiebreakPoints[0]}:${s.tiebreakPoints[1]}`;
  const gp=s.gamePoints||[0,0],names=['0','15','30','40'];
  const p0=gp[0]>=4?'AD':names[Math.min(gp[0],3)],p1=gp[1]>=4?'AD':names[Math.min(gp[1],3)];
  return `Sätze ${s.sets[0]}:${s.sets[1]} · Spiele ${s.games[0]}:${s.games[1]} · ${p0}:${p1}`;
}
function registerCaptureGap(m,before,after){
  if(snapshotKey(before)===snapshotKey(after))return;
  m.captureGaps=m.captureGaps||[];
  const pointIndex=(m.points||[]).length;
  const lastPause=(m.pauseSnapshots||[]).slice().reverse().find(x=>x.pointIndex===pointIndex);
  const existing=m.captureGaps.find(g=>g.pointIndex===pointIndex&&snapshotKey(g.after)===snapshotKey(after));
  if(!existing)m.captureGaps.push({
    pointIndex,
    before:lastPause?.state||before,
    after,
    label:`Erfassungslücke · weiter bei ${snapshotScoreText(after)}`,
    ts:Date.now()
  });
}
function pauseCapture(){const m=match();if(!m)return;
  m.pauseSnapshots=m.pauseSnapshots||[];
  m.pauseSnapshots.push({pointIndex:(m.points||[]).length,state:scoreSnapshot(m),ts:Date.now()});
  m.paused=true;m.navParked=false;m.status='pausiert';save();pause()}
function pause(){shell('Erfassungspause',`<div class="card"><h2 style="text-align:center">Erfassung pausiert</h2><p class="muted">Die bisherigen Daten sind gespeichert. Beim Fortsetzen wird zuerst der aktuelle Spielstand abgefragt.</p><button class="primary" onclick="resumeCurrent()">FORTSETZEN / SPIELSTAND PRÜFEN</button><button class="secondary" style="margin-top:8px" onclick="finishOptions()">MATCH BEENDEN</button></div>`,'matches')}
function resumeCurrent(){scoreCorrection()}
function inferServer(m,setNo){
  if(m.server) return m.server;
  const first=m.setFirstServers?.[setNo-1]||m.firstServer;
  if(!first) return null;
  const games=(m.setGames?.[setNo-1]||m.games||[0,0]);
  const gamesPlayed=(games[0]||0)+(games[1]||0);
  if(m.tiebreak){
    const total=(m.tiebreakPoints?.[0]||0)+(m.tiebreakPoints?.[1]||0);
    if(total===0) return first;
    return total===1 ? (first==='player'?'opponent':'player') : (total%2===0 ? (first==='player'?'opponent':'player') : first);
  }
  return gamesPlayed%2===0 ? first : (first==='player'?'opponent':'player');
}

function normalizedCompletedSet(m,i){
  const cs=m.completedSets?.[i];
  const sg=m.setGames?.[i];
  const tb=m.completedSetTiebreaks?.[i];

  // New-format data: a recorded set tiebreak always represents a 7:6 / 6:7 set.
  if(tb){
    return Number(tb[0])>Number(tb[1]) ? [7,6] : [6,7];
  }

  // Migration for older matches: the set was at 6:6 and the stored
  // "completedSets" value is actually the tie-break score.
  if(sg && Number(sg[0])===6 && Number(sg[1])===6 && cs){
    if(Number(cs[0])>Number(cs[1])) return [7,6];
    if(Number(cs[1])>Number(cs[0])) return [6,7];
  }

  // Another legacy pattern: impossible normal set results such as 7:0..7:4
  // were previously tie-break scores. Normalize only unambiguous cases.
  if(cs){
    const a=Number(cs[0]),b=Number(cs[1]);
    if(a===7 && b>=0 && b<=4) return [7,6];
    if(b===7 && a>=0 && a<=4) return [6,7];
  }

  return cs||sg||[0,0];
}
function correctionMaxSet(m){
  const s0=Number(document.getElementById('rs0')?.value||m.sets[0]||0),s1=Number(document.getElementById('rs1')?.value||m.sets[1]||0);
  return Math.min(3,Math.max(1,s0+s1+1));
}
function correctionSelectOptions(max,current){
  const cur=Number(current)||0;
  return Array.from({length:max+1},(_,i)=>`<option value="${i}"${i===cur?' selected':''}>${i}</option>`).join('');
}
function renderCorrectionSetFields(m,setNo){
  const prior=[];
  for(let i=0;i<setNo-1;i++){
    const v=normalizedCompletedSet(m,i);
    prior.push(
      `<div class="section">Satz ${i+1} – beendet</div>
       <div class="grid">
         <select id="rcg${i}p" class="input">${correctionSelectOptions(7,v[0]??0)}</select>
         <select id="rcg${i}o" class="input">${correctionSelectOptions(7,v[1]??0)}</select>
       </div>`
    );
  }

  const s0=Number(document.getElementById('rs0')?.value||m.sets[0]||0);
  const s1=Number(document.getElementById('rs1')?.value||m.sets[1]||0);
  const isMTB=setNo===3&&matchRules(m).thirdSet==='match-tiebreak'&&s0===1&&s1===1;

  if(isMTB){
    const tb=m.tiebreakPoints||[0,0];
    document.getElementById('correctionSets').innerHTML=
      prior.join('')+
      `<div class="section">Match-Tie-Break – Punkte</div>
       <div class="grid">
         <select id="rcmtp" class="input">${correctionSelectOptions(30,tb[0]??0)}</select>
         <select id="rcmto" class="input">${correctionSelectOptions(30,tb[1]??0)}</select>
       </div>`;
    const normal=document.getElementById('normalPointCorrection');
    if(normal) normal.style.display='none';
    return;
  }

  const cur=(m.setGames?.[setNo-1]||m.games||[0,0]);
  const tb=m.tiebreak&&!m.matchTiebreak ? (m.tiebreakPoints||[0,0]) : [0,0];

  document.getElementById('correctionSets').innerHTML=
    prior.join('')+
    `<div class="section">Aktueller Satz ${setNo} – Spiele</div>
     <div class="grid">
       <select id="rcgp" class="input" onchange="updateSetTiebreakCorrection()">${correctionSelectOptions(6,cur[0]??0)}</select>
       <select id="rcgo" class="input" onchange="updateSetTiebreakCorrection()">${correctionSelectOptions(6,cur[1]??0)}</select>
     </div>
     <div id="setTiebreakCorrection" style="display:none">
       <div class="section">Satz-Tie-Break – Punkte</div>
       <div class="grid">
         <select id="rcstbp" class="input">${correctionSelectOptions(30,tb[0]??0)}</select>
         <select id="rcstbo" class="input">${correctionSelectOptions(30,tb[1]??0)}</select>
       </div>
     </div>`;

  updateSetTiebreakCorrection();
}
function updateSetTiebreakCorrection(){
  const gp=document.getElementById('rcgp');
  const go=document.getElementById('rcgo');
  if(!gp||!go) return;

  const isSetTB=String(gp.value)==='6'&&String(go.value)==='6';
  const tb=document.getElementById('setTiebreakCorrection');
  const normal=document.getElementById('normalPointCorrection');

  if(tb) tb.style.display=isSetTB?'block':'none';
  if(normal) normal.style.display=isSetTB?'none':'block';
}

function correctionIsFinalScore(s0,s1){
  return (s0===2&&s1===0)||(s0===0&&s1===2)||(s0===2&&s1===1)||(s0===1&&s1===2);
}
function renderFinalCorrection(m,s0,s1){
  const count=(s0===2&&s1===1)||(s0===1&&s1===2)?3:2;
  const rows=[];
  for(let i=0;i<count;i++){
    const isMTB=i===2&&matchRules(m).thirdSet==='match-tiebreak';
    let v;
    if(isMTB){
      v=m.completedSets?.[i]||m.manualSets?.[i]||[0,0];
      rows.push(`<div class="section">Match-Tie-Break – Endstand</div>
        <div class="grid">
          <select id="rfinal${i}p" class="input">${correctionSelectOptions(30,v?.[0]??0)}</select>
          <select id="rfinal${i}o" class="input">${correctionSelectOptions(30,v?.[1]??0)}</select>
        </div>`);
    }else{
      v=normalizedCompletedSet(m,i);
      rows.push(`<div class="section">Satz ${i+1} – Endstand</div>
        <div class="grid">
          <select id="rfinal${i}p" class="input">${correctionSelectOptions(7,v?.[0]??0)}</select>
          <select id="rfinal${i}o" class="input">${correctionSelectOptions(7,v?.[1]??0)}</select>
        </div>`);
    }
  }
  document.getElementById('correctionSets').innerHTML=rows.join('');
}
function updateCorrectionSetOptions(){
  const m=match(),sel=document.getElementById('rcurrentset');if(!m||!sel)return;
  const s0=Number(document.getElementById('rs0')?.value||0),s1=Number(document.getElementById('rs1')?.value||0);
  const finalScore=correctionIsFinalScore(s0,s1);
  const currentWrap=document.getElementById('currentSetCorrection');
  const normal=document.getElementById('normalPointCorrection');
  const server=document.getElementById('serverCorrection');
  const btn=document.getElementById('correctionActionBtn');

  if(finalScore){
    if(currentWrap)currentWrap.style.display='none';
    if(normal)normal.style.display='none';
    if(server)server.style.display='none';
    renderFinalCorrection(m,s0,s1);
    if(btn){btn.textContent='MATCH ABSCHLIESSEN';btn.onclick=applyScoreCorrection;}
    return;
  }

  if(currentWrap)currentWrap.style.display='block';
  if(server)server.style.display='block';
  if(btn){btn.textContent='STAND ÜBERNEHMEN UND FORTSETZEN';btn.onclick=applyScoreCorrection;}

  const max=correctionMaxSet(m),old=Number(sel.value||m.currentSet||1);
  sel.innerHTML=Array.from({length:max},(_,i)=>`<option value="${i+1}">Satz ${i+1}${i+1===max?' – aktuell':''}</option>`).join('');
  const next=(old===1&&max>1)?max:Math.min(Math.max(1,old),max);sel.value=String(next);renderCorrectionSetFields(m,next);
}
function scoreCorrection(){
  const m=match();
  if(!m)return;
  const gp=m.gamePoints||[0,0];
  const setNo=Math.min(3,Math.max(1,m.currentSet||m.sets[0]+m.sets[1]+1));
  m.server=inferServer(m,setNo);

  shell('Spielstand prüfen',
    `<div class="card">
      <h2 style="text-align:center">Aktueller Spielstand</h2>
      <p class="muted">Bereits beendete Sätze und der laufende Satz können separat erfasst werden.</p>

      <div class="section">Sätze</div>
      <div class="grid">
        <select id="rs0" class="input">${correctionSelectOptions(2,m.sets[0])}</select>
        <select id="rs1" class="input">${correctionSelectOptions(2,m.sets[1])}</select>
      </div>

      <div id="currentSetCorrection">
        <div class="section">Satz auswählen</div>
        <select id="rcurrentset" class="input"></select>
      </div>

      <div id="correctionSets"></div>

      <div id="normalPointCorrection">
        <div class="section">Aktueller Spielstand</div>
        <div class="grid">
          <select id="rp0" class="input"><option>0</option><option>15</option><option>30</option><option>40</option><option>AD</option></select>
          <select id="rp1" class="input"><option>0</option><option>15</option><option>30</option><option>40</option><option>AD</option></select>
        </div>
      </div>

      <div id="serverCorrection">
        <div class="section">Aufschläger</div>
        <div class="grid">
          <button id="rsrvp" class="${m.server==='player'?'selected':''}" onclick="pickResumeServer('player')">🎾 ${esc(m.player)}</button>
          <button id="rsrvo" class="${m.server==='opponent'?'selected':''}" onclick="pickResumeServer('opponent')">🎾 ${esc(m.opponent)}</button>
        </div>
      </div>

      <button id="correctionActionBtn" class="primary" style="margin-top:14px" onclick="applyScoreCorrection()">STAND ÜBERNEHMEN UND FORTSETZEN</button>
    </div>`,
    'matches'
  );

  document.getElementById('rs0').onchange=updateCorrectionSetOptions;
  document.getElementById('rs1').onchange=updateCorrectionSetOptions;
  document.getElementById('rcurrentset').onchange=()=>renderCorrectionSetFields(m,Number(document.getElementById('rcurrentset').value));

  updateCorrectionSetOptions();
  if(!correctionIsFinalScore(Number(document.getElementById('rs0').value),Number(document.getElementById('rs1').value))){
    document.getElementById('rcurrentset').value=String(setNo);
    renderCorrectionSetFields(m,setNo);

    const isMTB=setNo===3&&matchRules(m).thirdSet==='match-tiebreak'&&m.sets[0]===1&&m.sets[1]===1;
    if(!isMTB){
      document.getElementById('rp0').value=gp[0]>=4?'AD':['0','15','30','40'][Math.min(gp[0],3)];
      document.getElementById('rp1').value=gp[1]>=4?'AD':['0','15','30','40'][Math.min(gp[1],3)];
    }
  }
}
function pickResumeServer(x){match().server=x;document.getElementById('rsrvp').classList.toggle('selected',x==='player');document.getElementById('rsrvo').classList.toggle('selected',x==='opponent');save()}
function applyScoreCorrection(){
  const m=match(),beforeCorrection=scoreSnapshot(m),map={'0':0,'15':1,'30':2,'40':3,'AD':4};
  const setNo=+document.getElementById('rcurrentset').value;
  const s0=+document.getElementById('rs0').value;
  const s1=+document.getElementById('rs1').value;

  if(!Number.isInteger(s0)||!Number.isInteger(s1)||s0<0||s1<0||s0>2||s1>2){
    toast('Bitte gültigen Satzstand eingeben.');
    return;
  }

  if(correctionIsFinalScore(s0,s1)){
    const count=(s0===2&&s1===1)||(s0===1&&s1===2)?3:2;
    const finals=[];
    for(let i=0;i<count;i++){
      const a=Number(document.getElementById('rfinal'+i+'p')?.value);
      const b=Number(document.getElementById('rfinal'+i+'o')?.value);
      if(!Number.isInteger(a)||!Number.isInteger(b)){
        toast('Bitte alle Satzergebnisse vollständig erfassen.');
        return;
      }
      finals.push([a,b]);
    }

    // Basic consistency check: the entered set winners must match the final set score.
    let wp=0,wo=0;
    finals.forEach((v,i)=>{
      if(i===2&&matchRules(m).thirdSet==='match-tiebreak'){
        if(v[0]>v[1])wp++;else if(v[1]>v[0])wo++;
      }else{
        if(v[0]>v[1])wp++;else if(v[1]>v[0])wo++;
      }
    });
    if(wp!==s0||wo!==s1){
      toast('Satzergebnisse passen nicht zum eingegebenen Satzstand.');
      return;
    }

    m.sets=[s0,s1];
    m.completedSets=finals.map(v=>[...v]);
    m.manualSets=finals.map(v=>[...v]);
    m.setGames=m.setGames||[[0,0],[0,0],[0,0]];
    finals.forEach((v,i)=>{
      if(!(i===2&&matchRules(m).thirdSet==='match-tiebreak'))m.setGames[i]=[...v];
    });
    m.games=finals[finals.length-1]?[...finals[finals.length-1]]:[0,0];
    m.gamePoints=[0,0];
    m.tiebreak=false;
    m.matchTiebreak=false;
    m.tiebreakPending=false;
    m.tiebreakPoints=[0,0];
    m.finished=true;
    m.status='beendet';
    m.paused=false;
    m.navParked=false;
    registerCaptureGap(m,beforeCorrection,scoreSnapshot(m));
    state.currentMatchId=null;
    save();
    finishView(m);
    return;
  }

  if(!m.setGames) m.setGames=[[0,0],[0,0],[0,0]];
  m.sets=[s0,s1];
  m.currentSet=setNo;
  m.completedSets=[];

  for(let i=0;i<setNo-1;i++){
    const a=+document.getElementById('rcg'+i+'p').value;
    const b=+document.getElementById('rcg'+i+'o').value;
    if(!Number.isInteger(a)||!Number.isInteger(b)){
      toast('Bitte alle beendeten Sätze vollständig erfassen.');
      return;
    }
    m.completedSets.push([a,b]);
    m.setGames[i]=[a,b];
  }

  const isMTB=setNo===3&&matchRules(m).thirdSet==='match-tiebreak'&&s0===1&&s1===1;

  if(isMTB){
    const a=+document.getElementById('rcmtp').value;
    const b=+document.getElementById('rcmto').value;
    if(!Number.isInteger(a)||!Number.isInteger(b)||a<0||b<0){
      toast('Bitte gültigen Match-Tie-Break-Stand eingeben.');
      return;
    }
    m.games=[0,0];
    m.setGames[2]=[0,0];
    m.gamePoints=[0,0];
    m.tiebreak=true;
    m.matchTiebreak=true;
    m.tiebreakPending=false;
    m.tiebreakPoints=[a,b];
  }else{
    const cg0=+document.getElementById('rcgp').value;
    const cg1=+document.getElementById('rcgo').value;

    if(!Number.isInteger(cg0)||!Number.isInteger(cg1)){
      toast('Bitte Spiele des aktuellen Satzes erfassen.');
      return;
    }

    m.setGames[setNo-1]=[cg0,cg1];
    m.games=[cg0,cg1];

    const isSetTB=cg0===6&&cg1===6;

    if(isSetTB){
      const a=+document.getElementById('rcstbp').value;
      const b=+document.getElementById('rcstbo').value;
      if(!Number.isInteger(a)||!Number.isInteger(b)||a<0||b<0){
        toast('Bitte gültigen Satz-Tie-Break-Stand eingeben.');
        return;
      }
      m.gamePoints=[0,0];
      m.tiebreak=true;
      m.matchTiebreak=false;
      m.tiebreakPending=true;
      m.tiebreakPoints=[a,b];
    }else{
      m.gamePoints=[
        map[document.getElementById('rp0').value],
        map[document.getElementById('rp1').value]
      ];
      m.tiebreak=false;
      m.matchTiebreak=false;
      m.tiebreakPending=false;
      m.tiebreakPoints=[0,0];
    }
  }

  if(!m.server){
    toast('Bitte Aufschläger auswählen.');
    return;
  }

  m.paused=false;
  m.navParked=false;
  m.status='nicht beendet';
  registerCaptureGap(m,beforeCorrection,scoreSnapshot(m));
  save();
  point();
}

  const m=match();if(!m)return;
  const e=document.createElement('div');e.className='modal';
  e.innerHTML=`<div class="modalbox"><h3>Match beenden</h3><p class="muted">Wähle, wie dieses Match abgeschlossen werden soll. Nur vollständig bestätigte Punkte bleiben in der Analyse.</p>
    <button class="finish-choice" id="finishScore"><b>Endstand eingeben</b><span>Match wurde regulär beendet; fehlenden Endstand nachtragen.</span></button>
    <button class="finish-choice" id="finishRetire"><b>Aufgabe</b><span>Bisher gespielten Stand behalten und „Aufg.“ am Ergebnis kennzeichnen.</span></button>
    <button class="finish-choice danger" id="finishDiscard"><b>Verwerfen</b><span>Diese laufende Erfassung vollständig löschen.</span></button>
    <button style="width:100%;margin-top:10px" onclick="this.closest('.modal').remove()">ABBRECHEN</button></div>`;
  e.querySelector('#finishScore').onclick=()=>{e.remove();finishManual()};
  e.querySelector('#finishRetire').onclick=()=>{e.remove();retirementAsk()};
  e.querySelector('#finishDiscard').onclick=()=>{e.remove();discardCurrentAsk()};

}

  const m=match();if(!m)return;
  const e=document.createElement('div');e.className='modal';
  e.innerHTML=`<div class="modalbox"><h3>Wer hat aufgegeben?</h3><p class="muted">Der bis hierhin gespielte Stand und alle bereits bestätigten Punkte bleiben erhalten.</p>
    <button class="finish-choice" id="retPlayer"><b>${esc(m.player)} gibt auf</b><span>Das Match wird als Niederlage markiert.</span></button>
    <button class="finish-choice" id="retOpponent"><b>${esc(m.opponent)} gibt auf</b><span>Das Match wird als Sieg markiert.</span></button>

  e.querySelector('#retPlayer').onclick=()=>finishRetirement('player');

function finishRetirement(by){
  const m=match();if(!m)return;
  m.retirement={by,at:Date.now()};m.finished=true;m.status='Aufgabe';m.paused=false;m.pending=null;m.court=null;m.rally=null;m.serveDraft=null;m.completedAt=Date.now();
  state.currentMatchId=null;save();document.querySelector('.modal')?.remove();finishView(m);
}
function discardCurrentAsk(){
  const m=match();if(!m)return;
  const e=document.createElement('div');e.className='modal';
  e.innerHTML=`<div class="modalbox"><h3>Match wirklich verwerfen?</h3><p class="muted">Die bisherige laufende Erfassung wird vollständig gelöscht und kann nicht wiederhergestellt werden.</p><div class="modal-actions"><button onclick="this.closest('.modal').remove()">Abbrechen</button><button class="primary" id="discardCurrentBtn">VERWERFEN</button></div></div>`;
  e.querySelector('#discardCurrentBtn').onclick=()=>{state.matches=state.matches.filter(a=>a.id!==m.id);state.currentMatchId=null;save();e.remove();home()};document.body.appendChild(e);

function finishManual(){const m=match();if(!m)return;shell('Match abschließen',`<div class="card"><p class="muted">Endstand des unvollständig erfassten Matches nachtragen.</p><div class="section">Sätze</div><div class="grid"><input id="sp" class="input" placeholder="Spieler/-in" inputmode="numeric"><input id="so" class="input" placeholder="Gegner/-in" inputmode="numeric"></div><div id="setGames"></div><button class="primary" style="margin-top:14px" onclick="manualDone()">ABSCHLIESSEN</button></div>`,'matches');document.getElementById('sp').oninput=renderSetGameFields;document.getElementById('so').oninput=renderSetGameFields;renderSetGameFields()}function renderSetGameFields(){const sp=document.getElementById('sp').value,so=document.getElementById('so').value,third=(sp==='1'&&so==='2')||(sp==='2'&&so==='1');document.getElementById('setGames').innerHTML=`<div class="section">Satz 1 – Spiele</div><div class="grid"><input id="g10" class="input" placeholder="Spieler/-in" inputmode="numeric"><input id="g11" class="input" placeholder="Gegner/-in" inputmode="numeric"></div><div class="section">Satz 2 – Spiele</div><div class="grid"><input id="g20" class="input" placeholder="Spieler/-in" inputmode="numeric"><input id="g21" class="input" placeholder="Gegner/-in" inputmode="numeric"></div>${third?'<div class="section">Satz 3 – Spiele</div><div class="grid"><input id="g30" class="input" placeholder="Spieler/-in" inputmode="numeric"><input id="g31" class="input" placeholder="Gegner/-in" inputmode="numeric"></div>':''}`}

function matchTimestamp(m){

function matchOverviewInsights(m){

  const ownWinner=rows.filter(p=>p.winner==='player'&&p.kind==='winner').length;

  });

  });
  else if(positive>ownErr)notes.push({
    fact:`Die positive Wirkung ist deutlich größer als die Zahl der eigenen Fehler.`,
    interp:`Das ist ein effizientes Matchbild. Andere Baustellen können deshalb zunächst wichtiger sein.`
  });
  else if(ownErr>positive)notes.push({
    fact:`Die eigenen Fehler (${ownErr}) übersteigen die positiv endenden Punkte (${positive}).`,
    interp:`Hier liegt die deutlichste Begrenzung im Match: Es geht zu viel Wirkung durch eigene Fehler verloren.`
  });

    fact:`Positive Wirkung und eigene Fehler liegen gleichauf.`,

    fact:`Eigene Fehler und Gegner-Winner liegen bei den verlorenen Punkten relativ nah beieinander.`,

function strokeDecisionRows(m,shot){
  return (m?.points||[]).filter(p=>p.shot===shot&&(
    (p.winner==='player'&&p.kind==='winner')||
    (p.winner==='player'&&p.kind==='error')||
    (p.winner==='opponent'&&p.kind==='error')

}
function strokeStats(m,shot){
  const rows=strokeDecisionRows(m,shot);
  const w=rows.filter(p=>p.winner==='player'&&p.kind==='winner').length;
  const ge=rows.filter(p=>p.winner==='player'&&p.kind==='error').length;
  const e=rows.filter(p=>p.winner==='opponent'&&p.kind==='error').length;
  const positive=w+ge,n=positive+e;
  return {rows,w,ge,e,positive,n,eff:pct(positive,n),bal:positive-e};
}
function chartInsight(text,interpretation=''){
