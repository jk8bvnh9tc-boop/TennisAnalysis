function patternAssessment(items,total){
  const sorted=[...items].sort((a,b)=>b.n-a.n);
  const top=sorted[0],second=sorted[1]||{n:0};
  if(!top||!total)return {level:'none'};
  const leadPP=Math.round((top.n-second.n)*100/total);
  const share=pct(top.n,total);
  if(total<6)return {level:'balanced',reason:'small',top,share,leadPP};
  if(top.n===second.n||leadPP<15||top.n<3)return {level:'balanced',reason:'close',top,share,leadPP};
  if(total<12||leadPP<25||share<50)return {level:'tendency',top,share,leadPP};
  return {level:'clear',top,share,leadPP};
}
function patternSentence(kind,assessment,total){
  if(assessment.level==='none')return '';
  if(assessment.level==='balanced'){
    if(assessment.reason==='small')return `Kleine Stichprobe (n=${total}): bislang ausgeglichenes ${kind}; keine belastbare Auffälligkeit.`;
    return `Ausgeglichenes ${kind}: keine Kategorie hebt sich klar von den anderen ab.`;
  }
  const lead=assessment.level==='clear'?'Klare Auffälligkeit':'Leichte Tendenz';
  return `${lead}: ${assessment.top.name} umfasst ${assessment.share}% der erfassten Bälle (n=${assessment.top.n}).`;
}
function placementSuccessRows(m,mode='all'){
  return (m?.points||[]).filter(p=>{
    const winner=p.winner==='player'&&p.kind==='winner';
    const forced=p.winner==='player'&&p.kind==='error';
    const has=Number.isInteger(p.court)&&p.court>=0&&p.court<=8;
    return has&&(mode==='winner'?winner:mode==='forced'?forced:(winner||forced));
  });
}
function placementLabel(mode){return mode==='winner'?'Winner':mode==='forced'?'Vor Gegnerfehler':'Punkterzeugende Bälle'}
function placementInsights(m){
  const rows=placementSuccessRows(m),notes=[];
  if(!rows.length)return notes;

  const depths=['kurz','mittel','tief'].map((name,row)=>({
    name:name[0].toUpperCase()+name.slice(1),
    n:rows.filter(p=>Math.floor(p.court/3)===row).length
  }));
  notes.push(patternSentence('Tiefenmuster',patternAssessment(depths,rows.length),rows.length));

  const ground=rows.filter(p=>['Vorhand','Rückhand'].includes(p.shot));
  if(ground.length){
    const dirs=['Cross','Mitte','Longline'].map(name=>({
      name,
      n:ground.filter(p=>strokeDir(m,p.shot,p.court)?.dir===name).length
    }));
    notes.push(patternSentence('Richtungsmuster',patternAssessment(dirs,ground.length),ground.length));
  }

  const combos=[];
  ['Vorhand','Rückhand'].forEach(shot=>['Cross','Mitte','Longline'].forEach(dir=>{
    const n=ground.filter(p=>p.shot===shot&&strokeDir(m,shot,p.court)?.dir===dir).length;
    if(n)combos.push({name:`${shot} ${dir.toLowerCase()}`,n});
  }));
  if(combos.length){
    const a=patternAssessment(combos,ground.length);
    if(a.level==='tendency'||a.level==='clear'){
      notes.push(`${a.level==='clear'?'Klares':'Leichtes'} Grundschlagmuster: ${a.top.name} tritt am häufigsten auf (${a.share}%, n=${a.top.n}).`);
    }
  }
  return notes.filter(Boolean).slice(0,3);
}
function placementHeat(m,mode){
  const rows=placementSuccessRows(m,mode),counts=Array.from({length:9},(_,i)=>rows.filter(p=>p.court===i).length);
  const max=Math.max(1,...counts),minPositive=Math.min(...counts.filter(x=>x>0),max);
  return `<div class="heat-wrap"><div class="heat-court">${counts.map((n,i)=>{
    let alpha=.03;
    if(n){
      const span=Math.max(1,max-minPositive);
      const rel=span===1?1:(n-minPositive)/span;
      alpha=.16+.68*rel;
    }
    return `<div class="heat-cell" style="background:rgba(31,77,58,${alpha})">${n}<span>${pct(n,rows.length)}%</span></div>`;
  }).join('')}</div><div class="heat-axis">oben = tief · unten = kurz · Feldhälfte Gegnerin</div></div>`;
}

function placementDepthPie(depth,total){
  const colors=['#8da99a','#c8d6ce','#1f4d3a'];
  if(!total)return '<div class="serve-side"><div class="serve-empty">Noch keine Tiefendaten.</div></div>';
  const shares=depth.map(x=>pct(x.n,total));
  let cursor=0;
  const stops=shares.map((share,i)=>{
    const start=cursor,end=cursor+share;cursor=end;
    return `${colors[i]} ${start}% ${end}%`;
  }).join(',');
  return `<div class="place-pie-wrap">
    <div class="place-pie" style="background:conic-gradient(${stops})"></div>
    <div class="place-pie-legend">${depth.map((x,i)=>`<div class="place-pie-row">
      <span class="place-pie-name"><span class="place-pie-dot" style="background:${colors[i]}"></span>${x.name[0].toUpperCase()+x.name.slice(1)}</span>
      <b>${x.n} · ${shares[i]}%</b>
    </div>`).join('')}</div>
  </div>`;
}
function placementDirectionColumns(dir,total){
  return `<div class="place-dir-columns">${dir.map(x=>{
    const share=pct(x.n,total);
    return `<div class="place-dir-item">
      <div class="place-dir-wrap"><div class="place-dir-col" style="height:${total?Math.max(4,share):4}%"><span class="place-dir-value">${total?share+'%':'—'}</span></div></div>
      <div class="place-dir-label">${x.name}</div><div class="place-dir-count">n=${x.n}</div>
    </div>`;
  }).join('')}</div>`;
}

function placementHeatInsight(m,mode='all'){
  const rows=placementSuccessRows(m,mode);
  if(rows.length<6)return {fact:`Kleine Stichprobe (n=${rows.length}): Noch kein belastbares Court-Muster.`,interp:'Die Heatmap zeigt nur, wo punkterzeugende Bälle landen – keine Erfolgsquote aller Versuche.'};
  const counts=Array.from({length:9},(_,i)=>({i,n:rows.filter(p=>p.court===i).length})).sort((a,b)=>b.n-a.n);
  const top=counts[0],share=pct(top.n,rows.length);
  return {fact:share>=30?`Ein Court-Feld bündelt ${share}% der aktuell gewählten punkterzeugenden Bälle.`:'Die punkterzeugenden Bälle verteilen sich relativ breit über den Court.',interp:'Eine Häufung ist zunächst ein erfolgreich sichtbares Muster. Ohne negative Court-Daten lässt sich nicht sagen, ob dieses Feld die höchste Erfolgsquote hat.'};
}
function placementDepthInsight(rows){
  const n=rows.length;if(n<6)return {fact:`Kleine Stichprobe (n=${n}): Die Tiefe ist noch nicht belastbar einzuordnen.`,interp:'Tiefe vorerst nur beschreiben.'};
  const vals=['Kurz','Mittel','Tief'].map((name,row)=>({name,n:rows.filter(p=>Math.floor(p.court/3)===row).length})).sort((a,b)=>b.n-a.n);
  const deep=vals.find(x=>x.name==='Tief'),share=pct(deep.n,n);
  if(share>=50)return {fact:`${share}% der punkterzeugenden Bälle landen tief.`,interp:'Das ist eine positive Grundstruktur: gute Tiefe nimmt dem Gegner Zeit und ist langfristig ein wichtiger Baustein für belastbare Ballqualität.'};
  if(share<30)return {fact:`Nur ${share}% der punkterzeugenden Bälle landen tief.`,interp:'Das ist ein mögliches Entwicklungsfeld, besonders wenn sich das Muster über mehrere Matches bestätigt. Kurze Bälle können bewusst als Winkel oder Stop eingesetzt sein und sind deshalb nicht automatisch negativ.'};
  return {fact:`${share}% der punkterzeugenden Bälle landen tief.`,interp:'Die Tiefe ist vorhanden, dominiert die positiven Ballmuster aber nicht klar. Kurze und mittlere Bälle können bewusst variieren; der Kontext bleibt offen.'};
}
function placementDirectionInsight(m,rows){
  const ground=rows.filter(p=>['Vorhand','Rückhand'].includes(p.shot));
  if(ground.length<6)return {fact:`Kleine Stichprobe (n=${ground.length}): Noch keine belastbare Richtungsdominanz.`,interp:'Cross/Mitte/Longline zunächst nur als Spielprofil lesen.'};
  const vals=['Cross','Mitte','Longline'].map(name=>({name,n:ground.filter(p=>strokeDir(m,p.shot,p.court)?.dir===name).length})).sort((a,b)=>b.n-a.n);
  const top=vals[0],share=pct(top.n,ground.length);
  if(share>=55)return {fact:`${top.name} dominiert bei den punkterzeugenden Grundschlägen mit ${share}%.`,interp:'Das ist zunächst ein funktionierendes Muster, keine Erfolgsquote. Eine klare Lieblingsrichtung kann eine Stärke sein; zusätzliche belastbare Optionen werden vor allem über mehrere Matches als Entwicklungsthema relevant.'};
  return {fact:'Die punkterzeugenden Grundschläge verteilen sich ohne starke Richtungsdominanz.',interp:'Das spricht für ein breiteres sichtbares Richtungsprofil in diesem Match.'};
}
function placementMatrixInsight(m,rows){
  const ground=rows.filter(p=>['Vorhand','Rückhand'].includes(p.shot));
  if(ground.length<6)return {fact:'Noch zu wenige Grundschlag-Courtdaten für eine kombinierte VH/RH-Richtungsaussage.',interp:'Keine Schlagrichtung als Stärke oder Begrenzung festlegen.'};
  const combos=[];
  ['Vorhand','Rückhand'].forEach(shot=>['Cross','Mitte','Longline'].forEach(dir=>{
    const n=ground.filter(p=>p.shot===shot&&strokeDir(m,shot,p.court)?.dir===dir).length;
    if(n)combos.push({shot,dir,n});
  }));
  combos.sort((a,b)=>b.n-a.n);const top=combos[0],share=pct(top.n,ground.length);
  return {fact:share>=35?`${top.shot} ${top.dir.toLowerCase()} ist das auffälligste punkterzeugende Grundschlagmuster (${share}%).`:'Kein einzelnes VH/RH-Richtungsmuster dominiert klar.',interp:share>=35?'These: Dieses Muster ist aktuell eine sichtbare Waffe bzw. ein bevorzugter Weg zu positiven Punktenden. Langfristig geht es nicht um Gleichverteilung, sondern darum, die Hauptwaffe durch zusätzliche belastbare Optionen schwerer ausrechenbar zu machen.':'Das sichtbare Spielprofil ist in Schlagseite und Richtung relativ variabel.'};
}
function placementAnalysis(matchId,mode='all'){

  const sortedEligible=analysisSort(eligible),preferredId=matchId||selectedAnalysisMatchId(),m=sortedEligible.find(x=>x.id===preferredId)||sortedEligible[0],rows=placementSuccessRows(m,mode),all=placementSuccessRows(m);
  const depth=['kurz','mittel','tief'].map((name,row)=>({name,n:rows.filter(p=>Math.floor(p.court/3)===row).length}));

      <div class="serve-side"><div class="place-tabs">

      </div></div>

      <div class="serve-side"><div class="stroke-note">${mode==='all'?'Gesamt = eigene Winner + der eigene Schlag unmittelbar vor einem Gegnerfehler.':'Gezeigt werden nur '+placementLabel(mode)+'.'} Die Grafik zeigt Anteile an diesen erfassten Bällen, keine Erfolgsquote aller gespielten Bälle.</div></div>
    </div>
    <div class="card serve-section-card"><div class="serve-section-head"><div class="serve-section-title">Tiefe</div><div class="serve-pill">${placementLabel(mode)}</div></div>
      ${(()=>{const x=placementDepthInsight(rows);return chartInsight(x.fact,x.interp)})()}
      ${placementDepthPie(depth,rows.length)}
    </div>
    <div class="card serve-section-card"><div class="serve-section-head"><div class="serve-section-title">Richtung der Grundschläge</div><div class="serve-pill">n=${ground.length}</div></div>

    </div>
    <div class="card serve-section-card"><div class="serve-section-head"><div class="serve-section-title">Schlag × Richtung</div></div>

function rallyGroups(){return [
  {key:'1',label:'1'},
  {key:'2–3',label:'2–3'},
  {key:'4–6',label:'4–6'},
  {key:'7+',label:'7+'}
]}
function rallyRows(m,key){
  return (m?.points||[]).filter(p=>p.rally===key);
}
function rallyOutcome(rows){
  return {
    ownWinner:rows.filter(p=>p.winner==='player'&&p.kind==='winner').length,
    oppError:rows.filter(p=>p.winner==='player'&&p.kind==='error').length,
    oppWinner:rows.filter(p=>p.winner==='opponent'&&p.kind==='winner').length,
    ownError:rows.filter(p=>p.winner==='opponent'&&p.kind==='error').length
  };
}
function rallyInsights(m){
  const groups=rallyGroups().map(g=>{
    const rows=rallyRows(m,g.key),won=rows.filter(p=>p.winner==='player').length;
    return {...g,n:rows.length,won,rate:pct(won,rows.length)};
  }).filter(x=>x.n);
  const total=groups.reduce((s,x)=>s+x.n,0),notes=[];
  if(total<6)return [`Kleine Stichprobe (n=${total}): noch kein belastbares Muster nach Ballwechsellänge erkennbar.`];

  const eligible=groups.filter(x=>x.n>=5);
  if(eligible.length>=3){
    const sorted=[...eligible].sort((a,b)=>b.rate-a.rate||b.n-a.n);
    const best=sorted[0],second=sorted[1];
    if(best.rate-second.rate>=15){
      notes.push(`Bei ${best.label} eigenen Schlägen ist die Punktgewinnquote am höchsten: ${best.rate}% (n=${best.n}).`);
    }else{
      notes.push('Ausgeglichenes Längenprofil: Keine ausreichend belegte Ballwechsellänge hebt sich bei der Punktgewinnquote klar ab.');
    }

    const low=[...eligible].sort((a,b)=>a.rate-b.rate||b.n-a.n);
    const worst=low[0],next=low[1];
    if(next&&next.rate-worst.rate>=20&&worst.rate<50){
      notes.push(`Auffällig schwächer bei ${worst.label} eigenen Schlägen: ${worst.rate}% Punkte gewonnen (n=${worst.n}).`);
    }

    const decisions=eligible.map(g=>{
      const rows=rallyRows(m,g.key),o=rallyOutcome(rows);
      return {...g,n:rows.length,errors:o.ownError,errorShare:pct(o.ownError,rows.length)};
    });
    const high=[...decisions].sort((a,b)=>b.errorShare-a.errorShare)[0];
    if(high&&high.errorShare>=50&&high.errors>=3){
      notes.push(`Bei ${high.label} eigenen Schlägen enden ${high.errorShare}% der Punkte mit einem eigenen Fehler (n=${high.n}).`);
    }
  }else{
    notes.push('Automatische Vergleiche erfolgen, sobald mindestens drei Ballwechsellängen jeweils mindestens 5 erfasste Punkte enthalten.');
  }
  return notes.slice(0,3);
}
function rallyDistribution(m){
  const groups=rallyGroups().map(g=>({...g,n:rallyRows(m,g.key).length}));
  const total=groups.reduce((s,x)=>s+x.n,0);
  return `<div class="rally-dist">${groups.map(x=>{
    const share=pct(x.n,total);
    return `<div class="rally-dist-item">
      <div class="rally-dist-wrap"><div class="rally-dist-col" style="height:${x.n?Math.max(4,share):4}%"><span class="rally-dist-value">${x.n?share+'%':'—'}</span></div></div>
      <div class="rally-col-label">${x.label}</div><div class="rally-col-n">n=${x.n}</div>
    </div>`;
  }).join('')}</div>`;
}

function metricClass(rate,n,allRates){
  if(n<5)return 'metric-muted';
  let base;
  if(rate>=60)base='metric-good-strong';
  else if(rate>=50)base='metric-good';
  else if(rate>=40)base='metric-warn';
  else base='metric-bad';

  const valid=(allRates||[]).filter(x=>x.n>=5);
  if(valid.length){
    const max=Math.max(...valid.map(x=>x.rate));
    const min=Math.min(...valid.map(x=>x.rate));
    if(rate>=60&&rate===max&&max>min)base='metric-good-strong';
    else if(rate>=60&&rate<max&&max>min)base='metric-good';
  }
  return base;
}
function rallySuccessCards(m){
  const groups=rallyGroups().map(g=>{
    const rows=rallyRows(m,g.key),n=rows.length,won=rows.filter(p=>p.winner==='player').length,lost=n-won;
    return {...g,n,won,lost,rate:pct(won,n)};
  });
  return `<div class="rally-success-cards">${groups.map(g=>`<div class="rally-success-card ${metricClass(g.rate,g.n,groups)}">
      <div class="rally-success-title">${g.label} eigene Schläge</div>
      <div class="rally-success-rate">${g.n?g.rate+'%':'—'}</div>

function rallyCourtPatterns(m){
  const blocks=rallyGroups().map(g=>{
    const rows=rallyRows(m,g.key).filter(p=>p.winner==='player'&&['winner','error'].includes(p.kind)&&Number.isInteger(p.court)&&['Vorhand','Rückhand'].includes(p.shot));
    if(rows.length<6)return '';
    const dirs=['Cross','Mitte','Longline'].map(name=>({name,n:rows.filter(p=>strokeDir(m,p.shot,p.court)?.dir===name).length}));
    const depths=['Kurz','Mittel','Tief'].map((name,i)=>({name,n:rows.filter(p=>Math.floor(p.court/3)===i).length}));
    const da=patternAssessment(dirs,rows.length),ta=patternAssessment(depths,rows.length);
    const bits=[];
    if(da.level==='tendency'||da.level==='clear')bits.push(`${da.top.name}: ${da.share}%`);
    if(ta.level==='tendency'||ta.level==='clear')bits.push(`${ta.top.name}: ${ta.share}%`);
    if(!bits.length)bits.push('kein klares Richtungs-/Tiefenmuster');
    return `<div class="rally-pattern"><div class="serve-side-title">${g.label} eigene Schläge · n=${rows.length}</div><div>${bits.join(' · ')}</div></div>`;
  }).filter(Boolean);
  if(!blocks.length)return '';
  return `<div class="card serve-section-card"><div class="serve-section-head"><div class="serve-section-title">Court-Muster nach Ballwechsellänge</div></div>${blocks.join('')}<div class="serve-side"><div class="stroke-note">Nur punkterzeugende Bälle mit Court-Daten. Muster werden erst ab n=6 gezeigt und nicht als Erfolgsquote interpretiert.</div></div></div>`;
}

function rallyDistributionInsight(m){
  const gs=rallyGroups().map(g=>({...g,n:rallyRows(m,g.key).length})),total=gs.reduce((s,g)=>s+g.n,0);
  if(total<6)return {fact:`Kleine Stichprobe (n=${total}): Die Verteilung ist noch nicht belastbar.`,interp:'Die Ballwechsellänge zunächst nur als Matchcharakter beschreiben.'};
  gs.sort((a,b)=>b.n-a.n);const share=pct(gs[0].n,total);

  return {fact:'Die Ballwechsellängen sind relativ gleichmäßig verteilt.',interp:'Das Matchprofil ist nicht stark auf eine einzige Rallyelänge konzentriert.'};
}
function rallySuccessInsight(m){
  const all=rallyGroups().map(g=>{const r=rallyRows(m,g.key);return {...g,n:r.length,rate:pct(r.filter(p=>p.winner==='player').length,r.length)}});
  const gs=all.filter(g=>g.n>=5);
  if(gs.length<3)return {fact:'Für einen belastbaren Vergleich müssen mindestens drei Ballwechsellängen jeweils n≥5 erreichen.',interp:'Kurze Rallys bleiben langfristig besonders relevant, werden aber erst mit ausreichender Stichprobe bewertet.'};
  gs.sort((a,b)=>b.rate-a.rate);const short=all.filter(g=>(g.key==='1'||g.key==='2–3')&&g.n>=5);
  const shortRate=short.length?Math.round(short.reduce((s,g)=>s+g.rate*g.n,0)/short.reduce((s,g)=>s+g.n,0)):null;
  if(shortRate!==null&&shortRate>=60)return {fact:`Die frühe Punktphase ist stark: kurze Rallys werden zusammen mit etwa ${shortRate}% gewonnen.`,interp:'Das ist eine zentrale Entwicklungsstärke. Ziel ist nicht, Punkte zwanghaft schnell zu beenden, sondern die ersten Schläge weiter so zu nutzen, dass früh Kontrolle entsteht.'};
  if(shortRate!==null&&shortRate<45)return {fact:`Die frühe Punktphase ist auffällig schwach: kurze Rallys werden zusammen nur mit etwa ${shortRate}% gewonnen.`,interp:'Das ist relevantes Entwicklungspotenzial. Aufschlag/Return und die ersten Folgeschläge sollten langfristig mehr Kontrolle erzeugen, auch wenn längere Rallys bereits gut funktionieren.'};
  return gs[0].rate-gs[1].rate>=15?{fact:`${gs[0].label} eigene Schläge sind die erfolgreichste ausreichend belegte Länge (${gs[0].rate}% Punktgewinn).`,interp:'Das zeigt eine klare Stärke in dieser Rallyphase. Kurze Rallys behalten unabhängig davon eine besondere langfristige Entwicklungsrelevanz.'}:{fact:'Die ausreichend belegten Ballwechsellängen zeigen ein ausgeglichenes Erfolgsprofil.',interp:'Das spricht für ein breiter tragfähiges Rallyprofil ohne klaren Einbruch in einer ausreichend belegten Länge.'};
}
function rallyDecisionInsight(m){
  const rows=rallyGroups().flatMap(g=>rallyRows(m,g.key));if(rows.length<6)return {fact:'Noch zu wenige Daten für ein belastbares Muster der Punktenden.',interp:'Noch keine Ursache für starke oder schwache Rallyelängen ableiten.'};
  const o=rallyOutcome(rows),vals=[['eigene Winner',o.ownWinner],['Gegnerfehler',o.oppError],['Gegner-Winner',o.oppWinner],['eigene Fehler',o.ownError]].sort((a,b)=>b[1]-a[1]);
  const top=vals[0];
  let interp='Die Art des Punktendes hilft zu unterscheiden, ob Wirkung oder Eigenverlust das Matchprofil prägt.';
  if(top[0]==='eigene Fehler')interp='Die eigene Fehlerlast prägt die Punktenden. Mögliche Ursachen sind Risiko, Technik, Beinarbeit, Geduld oder Konzentration; die Matchdaten können das nicht trennen.';
  if(top[0]==='Gegnerfehler')interp='Viele positive Punkte entstehen nach Gegnerfehlern. Das kann auf Druck und Ballqualität hindeuten, ohne zu beweisen, dass jeder Fehler erzwungen war.';
  if(top[0]==='Gegner-Winner')interp='Die Gegnerin erzeugt häufig selbst direkte Wirkung. Gegnerqualität, eigene Ballqualität oder Feldabdeckung sind plausible Erklärungen.';
  if(top[0]==='eigene Winner')interp='Direkte Abschlüsse prägen das positive Spiel. Entscheidend ist, ob diese Wirkung ohne überproportionale Eigenfehler entsteht.';
  return {fact:`${top[0][0].toUpperCase()+top[0].slice(1)} sind die häufigste Art, wie die erfassten Ballwechsel enden (${pct(top[1],rows.length)}%).`,interp};
}
function rallyStrokeInsight(m){
  const data=[];

function pct(a,b){return b?Math.round(a*100/b):0}

function serveMiniBar(label,count,total,win,showWin=true){

function servePlacementBlock(rows,no){

function serveErrorBlock(rows){

function serveInsights(rows){
  const notes=[];
  const firstIn=rows.filter(p=>p.serveDetail.first?.in).length;
  const secondAttempts=rows.filter(p=>p.serveDetail.first?.in===false).length;
  const secondIn=rows.filter(p=>p.serveDetail.first?.in===false&&p.serveDetail.second?.in).length;
  const successful=rows.map(p=>({p,u:serveUsed(p.serveDetail)})).filter(x=>x.u);
  const advantage=successful.filter(x=>['direct','weak'].includes(x.u.data.effect)).length;

  const zones=[];
  [1,2].forEach(no=>['right','left'].forEach(side=>['T','Mitte','Außen'].forEach(zone=>{
    const a=rows.filter(p=>{
      const d=p.serveDetail,sd=no===1?d.first:d.second;
      return ((no===1&&d.first?.in)||(no===2&&!d.first?.in&&d.second?.in))&&sd?.side===side&&sd?.placement===zone;
    });
    if(a.length>=3)zones.push({no,side,zone,n:a.length,wr:pct(a.filter(p=>p.winner==='player').length,a.length)});
  })));
  if(zones.length){
    zones.sort((a,b)=>b.wr-a.wr||b.n-a.n);
    const z=zones[0];
    notes.push(`${z.no}. Aufschlag ${z.zone} auf der ${z.side==='right'?'Einstand':'Vorteil'}seite ist aktuell am erfolgreichsten (${z.wr}% Punktgewinn, n=${z.n}).`);
  }
  if(rows.length>=5)notes.push(`1. Aufschlag: ${pct(firstIn,rows.length)}% im Feld.`);
  if(secondAttempts>=3)notes.push(`2. Aufschlag: ${pct(secondIn,secondAttempts)}% im Feld.`);
  if(successful.length>=5)notes.push(`${pct(advantage,successful.length)}% der erfolgreichen Aufschläge erzeugen direkt einen Punkt oder einen schwachen Return.`);
  return `<div class="card serve-hero"><div class="section">Erkenntnisse</div>${
    notes.length?notes.slice(0,3).map(x=>`<div class="serve-insight">${esc(x)}</div>`).join(''):
    '<p class="muted">Für belastbare Hinweise sind noch mehr Serve-Daten nötig.</p>'
  }</div>`;
}

function serveCoreInsight(rows){
  const n=rows.length,fi=rows.filter(p=>p.serveDetail.first?.in).length,sa=rows.filter(p=>p.serveDetail.first?.in===false).length,si=rows.filter(p=>p.serveDetail.first?.in===false&&p.serveDetail.second?.in).length;
  const fwin=rows.filter(p=>p.serveDetail.first?.in),swin=rows.filter(p=>p.serveDetail.first?.in===false&&p.serveDetail.second?.in);
  if(n<5)return {fact:`Kleine Stichprobe (n=${n}): Kernwerte noch vorsichtig interpretieren.`,interp:'Sicherheit und Wirkung des Aufschlags noch nicht gegeneinander bewerten.'};
  const f=pct(fi,n),s=sa?pct(si,sa):null,fw=pct(fwin.filter(p=>p.winner==='player').length,fwin.length),sw=pct(swin.filter(p=>p.winner==='player').length,swin.length);
  if(fwin.length>=5&&fw>=60&&f<60)return {fact:`Der 1. Aufschlag kommt zu ${f}% und gewinnt danach ${fw}% der Punkte.`,interp:'These: Der erste Aufschlag ist wirkungsvoll, aber noch nicht vollständig stabil. Eine niedrigere Quote ist hier nicht automatisch schlecht, solange die Wirkung den Preis rechtfertigt.'};
  if(fwin.length>=5&&fw<50&&f>=60)return {fact:`Der 1. Aufschlag kommt zu ${f}% ins Feld, danach werden ${fw}% der Punkte gewonnen.`,interp:'Die Sicherheitsbasis ist vorhanden; Entwicklungspotenzial liegt eher in der Wirkung als darin, noch mehr erste Aufschläge nur sicher einzuspielen.'};
  if(s!==null&&s<70)return {fact:`Der 2. Aufschlag liegt bei ${s}% im Feld; der 1. bei ${f}%.`,interp:'Die auffälligere Begrenzung ist derzeit die Sicherheit des zweiten Aufschlags, weil Fehler dort unmittelbar in Doppelfehler übergehen können.'};
  return {fact:`Der 1. Aufschlag liegt bei ${f}% im Feld${s!==null?`, der 2. bei ${s}%`:''}.`,interp:`Sicherheit allein bewertet den Aufschlag nicht vollständig${swin.length>=3?`; entscheidend ist zusätzlich die Punktwirkung nach dem 1. und 2. Aufschlag`:''}.`};
}
function servePlacementInsight(rows,no){
  const zones=[];
  ['right','left'].forEach(side=>['T','Mitte','Außen'].forEach(zone=>{
    const a=rows.filter(p=>{const d=p.serveDetail,sd=no===1?d.first:d.second;return ((no===1&&d.first?.in)||(no===2&&!d.first?.in&&d.second?.in))&&sd?.side===side&&sd?.placement===zone});
    if(a.length>=3)zones.push({side,zone,n:a.length,wr:pct(a.filter(p=>p.winner==='player').length,a.length)});
  }));
  if(!zones.length)return {fact:`Noch keine Platzierungszone des ${no}. Aufschlags ist mit mindestens n=3 ausreichend belegt.`,interp:'Lieblingsziele noch nicht bewerten; die Verteilung zunächst nur beobachten.'};
  zones.sort((a,b)=>b.wr-a.wr||b.n-a.n);const z=zones[0];
  return {fact:`${z.zone} auf der ${z.side==='right'?'Einstand':'Vorteil'}seite ist die erfolgreichste ausreichend belegte Platzierung (${z.wr}% Punktgewinn, n=${z.n}).`,interp:'Das kann ein funktionierendes Lieblingsmuster sein. Eine häufig genutzte Zone ist nicht automatisch zu einseitig; langfristig sind zusätzliche belastbare Ziele vor allem dann wertvoll, wenn das Hauptmuster vorhersehbarer wird.'};
}
function serveEffectInsight(rows){
  const used=rows.map(p=>({p,u:serveUsed(p.serveDetail)})).filter(x=>x.u);
  if(used.length<5)return {
    fact:`Kleine Stichprobe (n=${used.length}): Die Aufschlagwirkung ist noch nicht belastbar.`,
    interp:'Noch nicht zwischen sicher erkennbarem Aufschlagvorteil und anschließendem Spielverlauf unterscheiden.'
  };
  const adv=used.filter(x=>['direct','weak'].includes(x.u.data.effect)).length;
  const neutral=used.filter(x=>x.u.data.effect==='neutral').length;
  const rate=pct(adv,used.length);
  return {
    fact:`Bei ${rate}% der erfolgreichen Aufschläge ist ein direkter Vorteil sicher erkennbar: direkter Punkt oder schwacher Return.`,
    interp:`Bei den übrigen ${neutral} Aufschlägen endet die Erfassung im normalen Ballwechsel. Das bedeutet nicht automatisch, dass der Aufschlag wirkungslos war: Ein vorhandener Vorteil kann auch mit dem +1 wieder verloren gegangen sein.`
  };
}
function serveErrorInsight(rows){
  const errs=rows.flatMap(p=>[p.serveDetail?.first?.in===false?p.serveDetail.first.errorType:null,p.serveDetail?.first?.in===false&&p.serveDetail?.second?.in===false?p.serveDetail.second.errorType:null]).filter(Boolean);
  if(errs.length<3)return {fact:'Noch zu wenige Aufschlagfehler für ein belastbares Fehlerbild.',interp:'Keine technische Ursache aus Einzelfehlern ableiten.'};
  const cats=['Netz','Lang','Seitlich'].map(name=>({name,n:errs.filter(x=>x===name).length})).sort((a,b)=>b.n-a.n);
  if(cats[0].n>cats[1].n)return {fact:`${cats[0].name} ist das häufigste Fehlerbild (${cats[0].n} von ${errs.length} erfassten Fehlern).`,interp:'Das zeigt die Richtung der Abweichung, ist aber keine Technikdiagnose. Treffpunkt, Timing, Toss, Schlägerwinkel oder Risikoniveau können je nach Fehlerbild mehrere plausible Ursachen sein.'};
  return {fact:'Das Fehlerbild ist weitgehend ausgeglichen.',interp:'Es gibt aktuell keinen einzelnen Fehlertyp, der als klare Priorität hervorsticht.'};
}

        ${serveKpi('Punkte nach 1.',pct(firstPts,firstWinRows.length)+'%',firstPts+' / '+firstWinRows.length,serveRateClass(pct(firstPts,firstWinRows.length),firstWinRows.length,serveRates))}
        ${serveKpi('2. Aufschlag drin',secondAttempts?pct(secondIn,secondAttempts)+'%':'—',secondIn+' / '+secondAttempts,serveRateClass(pct(secondIn,secondAttempts),secondAttempts,serveRates))}
        ${serveKpi('Punkte nach 2.',secondWinRows.length?pct(secondPts,secondWinRows.length)+'%':'—',secondPts+' / '+secondWinRows.length,serveRateClass(pct(secondPts,secondWinRows.length),secondWinRows.length,serveRates))}
        ${serveKpi('Doppelfehler',String(df),firstAttempts?dfRate+'% der Punkte':'',doubleFaultClass(dfRate,firstAttempts))}
        ${serveKpi('Serve-Vorteil',successful.length?pct(advantage,successful.length)+'%':'—','direkt + schwacher Return',serveRateClass(pct(advantage,successful.length),successful.length,serveRates))}

function snapshotTotalGames(s){
  const sg=s?.setGames||[];
  return sg.reduce((sum,g)=>sum+(Number(g?.[0])||0)+(Number(g?.[1])||0),0);
}
function captureGapGameCount(gap){
  return Math.max(0,snapshotTotalGames(gap?.after)-snapshotTotalGames(gap?.before));
}
function captureGapGameScore(gap){
  const a=gap?.after;
  if(!a)return '';
  const setNo=Math.max(1,Number(a.currentSet)||1);
  const g=a.setGames?.[setNo-1]||a.games||[0,0];
  return `${Number(g[0])||0}:${Number(g[1])||0}`;
}
function flowReplay(m){
  const pts=m?.points||[],gaps=[...(m?.captureGaps||[])].sort((a,b)=>a.pointIndex-b.pointIndex);
  const initialGames=normalSetStartGames(m);
  const s={
    gamePoints:[0,0],games:[...initialGames],sets:[0,0],
    server:m.firstServer||'player',tiebreak:false,tb:[0,0],
    matchTiebreak:false,currentSet:1
  };
  const events=[];
  const gameScore=()=>`${s.games[0]}:${s.games[1]}`;
  const setScore=()=>`${s.sets[0]}:${s.sets[1]}`;

  function applySnapshot(a){
    if(!a)return;
    s.sets=[...(a.sets||[0,0])];
    s.currentSet=a.currentSet||Math.max(1,s.sets[0]+s.sets[1]+1);
    s.games=[...(a.games||[0,0])];
    s.gamePoints=[...(a.gamePoints||[0,0])];
    s.tiebreak=!!a.tiebreak;
    s.matchTiebreak=!!a.matchTiebreak;
    s.tb=[...(a.tiebreakPoints||[0,0])];
    if(a.server)s.server=a.server;
  }
  function finishSet(i,setResult,tbResult=null){
    s.sets[i]++;
    events.push({type:'set',setNo:s.currentSet,result:setResult,setScore:setScore(),tb:tbResult});
    s.currentSet++;
    const nextStart=normalSetStartGames(m);
    s.games=[...nextStart];s.gamePoints=[0,0];s.tiebreak=false;s.tb=[0,0];s.matchTiebreak=false;
    if(s.sets[0]===1&&s.sets[1]===1&&matchRules(m).thirdSet==='match-tiebreak'){
      s.games=[0,0];
      s.tiebreak=true;s.matchTiebreak=true;s.tb=[0,0];
    }
  }
  function finishGame(i){
    s.games[i]++;
    events.push({type:'game',score:gameScore(),server:s.server});
    s.gamePoints=[0,0];
    s.server=s.server==='player'?'opponent':'player';
    if(s.games[i]>=6&&s.games[i]-s.games[1-i]>=2)finishSet(i,[...s.games]);
    else if(s.games[0]===6&&s.games[1]===6){s.tiebreak=true;s.tb=[0,0]}
  }
  function normalPoint(i){
    const o=1-i,g=s.gamePoints;
    if(g[0]>=3&&g[1]>=3){
      if(!matchRules(m).ad){finishGame(i);return}
      if(g[0]===g[1]){g[i]=4;g[o]=3;return}
      if(g[i]===4){finishGame(i);return}
      g[0]=3;g[1]=3;return
    }
    g[i]++;
    if(g[i]>=4&&g[i]>g[o])finishGame(i);
  }

  let gi=0;
  for(let idx=0;idx<=pts.length;idx++){
    while(gi<gaps.length&&gaps[gi].pointIndex===idx){
      const gap=gaps[gi++];
      events.push({
        type:'gap',
        pointIndex:idx,
        label:gap.label||`Erfassungslücke · weiter bei ${snapshotScoreText(gap.after)}`,
        before:gap.before,
        after:gap.after,
        missedGames:captureGapGameCount(gap),
        gameScore:captureGapGameScore(gap)
      });
      applySnapshot(gap.after);
    }
    if(idx===pts.length)break;
    const p=pts[idx],serverBefore=s.server,setBefore=s.currentSet,i=p.winner==='player'?0:1;
    events.push({type:'point',pointIndex:idx,winner:p.winner,server:serverBefore,setNo:setBefore,tiebreak:s.tiebreak,matchTiebreak:s.matchTiebreak});

    if(s.tiebreak){
      s.tb[i]++;
      const total=s.tb[0]+s.tb[1],target=s.matchTiebreak?10:7;
      if(s.tb[i]>=target&&s.tb[i]-s.tb[1-i]>=2){
        const final=[...s.tb],wasMTB=s.matchTiebreak;
        if(wasMTB)finishSet(i,final,final);
        else{
          const setFinal=i===0?[7,6]:[6,7];
          finishSet(i,setFinal,final);
          s.server=s.server==='player'?'opponent':'player';
        }
      }else if(total%2===1)s.server=s.server==='player'?'opponent':'player';
    }else normalPoint(i);
  }
  return events;
}

function matchFlowSvg(m){
  const events=flowReplay(m),pointEvents=events.filter(e=>e.type==='point');
  if(!pointEvents.length&&!events.some(e=>e.type==='gap'))return '<div class="serve-side"><div class="serve-empty">Noch keine Punkte für den Matchverlauf vorhanden.</div></div>';

  const stepX=22,gapX=58,grid=20,left=26,top=24,bottom=24;
  let level=0,maxLevel=0,minLevel=0,x=left;
  const pointCoords=new Map(),segments=[[]],gapMarks=[];
  segments[0].push({x,y:0,level:0});

  events.forEach(e=>{
    if(e.type==='gap'){
      const start=x+8,end=x+gapX-8;
      const reset=Number(e.missedGames||0)>1;
      gapMarks.push({
        x1:start,x2:end,label:e.label,
        missedGames:Number(e.missedGames||0),
        gameScore:e.gameScore||'',
        reset
      });
      x+=gapX;
      if(reset)level=0;
      segments.push([{x,y:0,level}]);
      maxLevel=Math.max(maxLevel,level);minLevel=Math.min(minLevel,level);
      return;
    }
    if(e.type==='point'){
      x+=stepX;
      level+=e.winner==='player'?1:-1;
      maxLevel=Math.max(maxLevel,level);minLevel=Math.min(minLevel,level);
      const c={x,y:0,level,pointIndex:e.pointIndex,server:e.server};
      segments[segments.length-1].push(c);
      pointCoords.set(e.pointIndex,c);
    }
  });

  const padLevels=1;
  maxLevel+=padLevels;minLevel-=padLevels;
  const mid=top+maxLevel*grid,height=top+(maxLevel-minLevel)*grid+bottom,width=Math.max(330,x+40);
  segments.flat().forEach(c=>c.y=mid-c.level*grid);

  // Game/set boundaries occur directly after the latest captured point in each segment.
  let lastPointIndex=-1;
  const boundaries=[];
  events.forEach(e=>{
    if(e.type==='point')lastPointIndex=e.pointIndex;
    else if(e.type==='gap')lastPointIndex=-1;
    else if(e.type==='game'&&lastPointIndex>=0)boundaries.push({kind:'game',pointIndex:lastPointIndex,label:e.score});
    else if(e.type==='set'&&lastPointIndex>=0)boundaries.push({kind:'set',pointIndex:lastPointIndex,label:`Satz ${e.setNo} · ${e.result[0]}:${e.result[1]}`});
  });

  const polylines=segments.filter(s=>s.length>1).map(s=>`<polyline points="${s.map(c=>`${c.x},${c.y}`).join(' ')}" fill="none" stroke="#1f4d3a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`).join('');
  const circles=segments.flat().filter(c=>Number.isInteger(c.pointIndex)).map(c=>`<circle cx="${c.x}" cy="${c.y}" r="2.6" fill="#1f4d3a"/>`).join('');

  const serverMarkers=pointEvents.map((e,i)=>{
    const prev=i?pointEvents[i-1]:null,c=pointCoords.get(e.pointIndex);
    if(!c||(i>0&&prev.server===e.server))return '';
    const yy=e.server==='player'?mid-7:mid+15;
    return `<text x="${c.x}" y="${yy}" text-anchor="middle" font-size="10">🎾</text>`;
  }).join('');

  const boundarySvg=boundaries.map(b=>{
    const c=pointCoords.get(b.pointIndex);if(!c)return '';
    const bx=c.x+stepX/2;
    if(b.kind==='set')return `<line x1="${bx}" y1="4" x2="${bx}" y2="${height-4}" stroke="#59665e" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="${bx+4}" y="${top+12}" font-size="10" font-weight="800" fill="#3e4a43">${b.label}</text>`;
    return `<line x1="${bx}" y1="${top-2}" x2="${bx}" y2="${height-bottom+2}" stroke="#7b8880" stroke-width="1" stroke-dasharray="4 4"/>
      <rect x="${bx-14}" y="${mid-17}" width="28" height="14" rx="4" fill="#fbfcfb" stroke="#cbd8cf"/>
      <text x="${bx}" y="${mid-7}" text-anchor="middle" font-size="9" font-weight="900" fill="#46524b">${b.label}</text>`;
  }).join('');

  const gapSvg=gapMarks.map(g=>{
    const gx=(g.x1+g.x2)/2;
    const countText=g.missedGames===1?'1 Spiel nicht erfasst':g.missedGames>1?`${g.missedGames} Spiele nicht erfasst`:'Punkte nicht vollständig erfasst';
    const restartText=g.gameScore?`weiter bei Spiele ${g.gameScore}`:'Erfassung wird fortgesetzt';
    const resetText=g.reset?' · Verlauf startet neu auf Nulllinie':'';
    return `<rect x="${g.x1}" y="${top-8}" width="${g.x2-g.x1}" height="${height-top-bottom+16}" fill="rgba(120,130,124,.10)" stroke="#87928b" stroke-dasharray="4 4"/>
      <line x1="${g.x1+4}" y1="${mid}" x2="${g.x2-4}" y2="${mid}" stroke="#7f8a83" stroke-width="2" stroke-dasharray="4 4"/>
      <text x="${gx}" y="${mid-13}" text-anchor="middle" font-size="9" font-weight="900" fill="#5f6963">LÜCKE</text>
      <text x="${gx}" y="${mid+2}" text-anchor="middle" font-size="8" fill="#667069">${esc(countText)}</text>
      <text x="${gx}" y="${mid+15}" text-anchor="middle" font-size="8" font-weight="800" fill="#59645d">${esc(restartText)}</text>
      ${g.reset?`<circle cx="${g.x2+8}" cy="${mid}" r="3" fill="#59645d"/>`:''}`;
  }).join('');

  const oldGapFallback=(!m.captureGaps?.length&&m.pauseSnapshots?.length)?`<div class="flow-note"><b>Hinweis:</b> Für dieses ältere Match ist eine Pause gespeichert, aber die exakte Lage eventuell nicht erfasster Punkte kann rückwirkend nicht sicher rekonstruiert werden.</div>`:'';

  const nameLabels=`
    <text x="14" y="${mid-grid*2+4}" text-anchor="start" font-size="12" font-weight="900" fill="#34423a" stroke="#fbfcfb" stroke-width="4" paint-order="stroke">${esc(m.player)} ↑</text>
    <text x="14" y="${mid+grid*2+4}" text-anchor="start" font-size="12" font-weight="900" fill="#34423a" stroke="#fbfcfb" stroke-width="4" paint-order="stroke">↓ ${esc(m.opponent)}</text>`;
  return `<div class="flow-paper">
    <svg class="flow-chart" viewBox="0 0 ${width} ${height}" style="width:${width}px" aria-label="Matchverlauf">
      <line x1="0" y1="${mid}" x2="${width}" y2="${mid}" stroke="#89968e" stroke-width="1.2"/>
      ${gapSvg}${boundarySvg}${polylines}${circles}${serverMarkers}${nameLabels}
    </svg>
    <div class="flow-server-key"><span><b class="flow-ball">🎾</b> oberhalb = ${esc(m.player)} serviert</span><span><b class="flow-ball">🎾</b> unterhalb = ${esc(m.opponent)} serviert</span></div>
    <div class="flow-legend"><span><i class="flow-sample"></i>erfasster Punkt</span><span><i class="flow-sample dash"></i>Spiel-/Satzgrenze bzw. Erfassungslücke</span></div>
    <div class="flow-note">Jedes vollständig erfasste Spiel erhält seinen Endstand. Nicht erfasste Punkte werden nicht erfunden: Die Lücke zeigt den bekannten Spielstand beim Wiedereinstieg. Wurden mehr als ein vollständiges Spiel verpasst, beginnt der neue erfasste Verlauf wieder auf der Nulllinie.</div>
    ${oldGapFallback}
  </div>`;
}

function pressureRules(m){

}
function pressureApplySnapshot(s,a){

  s.currentSet=a.currentSet||Math.max(1,s.sets[0]+s.sets[1]+1);
  s.games=[...(a.games||[0,0])];
  s.gamePoints=[...(a.gamePoints||[0,0])];
  s.tiebreak=!!a.tiebreak;
  s.matchTiebreak=!!a.matchTiebreak;

}

    s.currentSet=3;s.games=[0,0];s.tiebreak=true;s.matchTiebreak=true;
  }
}
function pressureFinishGame(s,i,rules){
  s.games[i]++;

  s.server=s.server==='player'?'opponent':'player';
  if(s.games[i]>=6&&s.games[i]-s.games[1-i]>=2)pressureFinishSet(s,i,rules);

function pressureApplyWinner(s,winner,rules){
  const i=winner==='player'?0:1,o=1-i;
  const out={gameWon:false,setWon:false,matchWon:false};
  const beforeSets=[...s.sets],beforeGames=[...s.games],wasMTB=s.matchTiebreak;

    if(s.tb[i]>=target&&s.tb[i]-s.tb[o]>=2){

      out.setWon=s.sets[i]>beforeSets[i];
      out.matchWon=!!s.matchEnded;
      if(!out.matchWon&&!wasMTB)s.server=s.server==='player'?'opponent':'player';
    }else if(total%2===1)s.server=s.server==='player'?'opponent':'player';
    return out;
  }

  const g=s.gamePoints;
  let wonGame=false;
  if(g[0]>=3&&g[1]>=3){
    if(!rules.ad)wonGame=true;
    else if(g[0]===g[1]){g[i]=4;g[o]=3}
    else if(g[i]===4)wonGame=true;
    else{g[0]=3;g[1]=3}
  }else{
    g[i]++;
    if(g[i]>=4&&g[i]>g[o])wonGame=true;
  }
  if(wonGame){
    pressureFinishGame(s,i,rules);
    out.gameWon=s.games[i]>beforeGames[i]||s.sets[i]>beforeSets[i];
    out.setWon=s.sets[i]>beforeSets[i];
    out.matchWon=!!s.matchEnded;

}
function pressurePointText(s,rules){
  if(s.tiebreak)return `${s.tb[0]}:${s.tb[1]}`;
  const a=s.gamePoints[0],b=s.gamePoints[1],v=['0','15','30','40'];
  if(a>=3&&b>=3){

      if(a===4)return 'AD:40';
      if(b===4)return '40:AD';
    }

  }

}

  if(s.tiebreak)return `${s.currentSet}. Satz · Tie-Break ${pressurePointText(s,rules)}`;

function pressureReplay(m){
  const pts=m?.points||[],gaps=[...(m?.captureGaps||[])].sort((a,b)=>a.pointIndex-b.pointIndex);
  const rules=pressureRules(m),s=pressureInitialState(m),rows=[];
  let gi=0;
  for(let idx=0;idx<=pts.length;idx++){
    while(gi<gaps.length&&gaps[gi].pointIndex===idx){pressureApplySnapshot(s,gaps[gi].after);gi++}
    if(idx===pts.length)break;

    const p=pts[idx],pre=pressureCloneState(s);
    const playerHyp=pressureCloneState(pre),oppHyp=pressureCloneState(pre);
    const pWin=pressureApplyWinner(playerHyp,'player',rules),oWin=pressureApplyWinner(oppHyp,'opponent',rules);
    const tags=[];
    const gameKey=`${pre.currentSet}:${pre.games[0]}:${pre.games[1]}:${pre.server}`;
    if(!pre.tiebreak&&pre.server==='player'&&pWin.gameWon)tags.push('gameFor');
    if(!pre.tiebreak&&pre.server==='opponent'&&oWin.gameWon)tags.push('gameAgainst');
    if(!pre.tiebreak&&pre.server==='opponent'&&pWin.gameWon)tags.push('breakFor');
    if(!pre.tiebreak&&pre.server==='player'&&oWin.gameWon)tags.push('breakAgainst');
    if(pWin.setWon)tags.push('setFor');
    if(oWin.setWon)tags.push('setAgainst');
    if(pWin.matchWon)tags.push('matchFor');
    if(oWin.matchWon)tags.push('matchAgainst');

}
const PRESSURE_META={

function pressureTagLabel(k){

function pressureCategory(rows,key){
  const r=rows.filter(x=>x.tags.includes(key)),success=r.filter(x=>x.winner==='player').length;

function pressureHoldAfterSavedBreak(rows){

  if(!savedGames.length)return {n:0,held:0,rate:0};

function pressureSide(rows,side){

  const sideRows=rows.filter(r=>r.tags.some(k=>keys.includes(k)));

}
function pressureCategoryPhrase(c,key,side){
  const meta=PRESSURE_META[key],positive=side==='positive';
  if(!c.n)return '';
  if(key==='gameFor')return `${c.success}/${c.n} eigene Spielbälle genutzt`;
  if(key==='gameAgainst')return `${c.success}/${c.n} gegnerische Spielbälle abgewehrt`;
  if(key==='breakFor')return `${c.success}/${c.n} Breakbälle verwandelt`;

function pressureStandout(rows,side){

  if(!cats.length)return null;
  // Prefer enough sample; otherwise prefer the more consequential situation.
  const sampled=cats.filter(c=>c.n>=2);
  if(sampled.length){
    sampled.sort((a,b)=>{
      const da=Math.abs(a.rate-50),db=Math.abs(b.rate-50);

}
function pressureSideInsight(rows,side){

    :`${s.won} von ${s.n} Punkten bei gegnerischer Chance auf Spiel, Break, Satz oder Match wurden gewonnen.`;
  let interp='';

function pressureClearLoss(m){

  const sets=(m.completedSets||[]).filter(x=>Array.isArray(x)&&x.length===2).slice(0,2);

  const diff=sets.reduce((s,x)=>s+Math.max(0,(x[1]||0)-(x[0]||0)),0);

function pressureInsight(rows){

function focusSeries(matches,key){
  return matches.map(m=>{const x=focusMetricRaw(m,key);return x?{match:m,...x}:null}).filter(Boolean);
}
function focusSnapshotFromSeries(series){
  if(!series.length)return null;
  const values=series.map(x=>x.value);
  const pooledN=series.reduce((s,x)=>s+x.n,0),pooledPos=series.reduce((s,x)=>s+x.pos,0);
  const level=pooledN?pooledPos/pooledN*100:focusMedian(values);
  const med=focusMedian(values);
  const mad=focusMedian(values.map(v=>Math.abs(v-med)));
  const robust=1.4826*mad;
  const avgN=series.reduce((s,x)=>s+x.n,0)/series.length;

  const noise=Math.max(3,100*Math.sqrt(p*(1-p)/Math.max(1,avgN)));
  return {level,median:med,spread:Math.max(robust,noise),robust,noise,nMatches:series.length,n:pooledN,values};
}
function buildFocusBaseline(def,selectedAt){

  const eligible=all.filter(m=>focusMetricRaw(m,def.main)).slice(0,6).reverse();
  const keys=[def.main,...def.companions,...def.guards];
  const metrics={};
  keys.forEach(k=>metrics[k]=focusSnapshotFromSeries(focusSeries(eligible,k)));

function ensureFocusBaseline(){

function focusMetricEval(f,def,key,postMatches){

  const dir=FOCUS_METRICS[key]?.dir||1;
  const rawDelta=now.level-base.level;

  const z=base.spread?wantedDelta/base.spread:0;
  const threshold=.25*base.spread;
  const confirm=s.filter(x=>(x.value-base.level)*dir>threshold).length;
  const oppose=s.filter(x=>(x.value-base.level)*dir<-threshold).length;
  const need=Math.ceil(s.length*2/3);

function focusStage(n){

}
function focusEvaluation(f){

    }else if(main.z>=1&&consistentUp){

    }else if(main.z>=.5){

function devSeriesDelta(series,inverse=false){
  if(!series||series.length<2)return null;
  const half=Math.max(1,Math.floor(series.length/2));
  const avg=a=>a.length?a.reduce((s,x)=>s+x.value,0)/a.length:null;

function devSparkline(series,{inverse=false}={}){
  if(!series||!series.length)return `<div class="dev58-empty-line">Noch keine Verlaufsdaten</div>`;
  const vals=series.map(x=>Math.max(0,Math.min(100,x.value)));
  const w=240,h=66,p=7;
  const min=Math.min(...vals),max=Math.max(...vals),span=Math.max(12,max-min);
  const lo=Math.max(0,min-span*.18),hi=Math.min(100,max+span*.18);
  const denom=Math.max(1,hi-lo);
  const pts=vals.map((v,i)=>{
    const x=vals.length===1?w/2:p+i*(w-2*p)/(vals.length-1);
    const y=h-p-(v-lo)/denom*(h-2*p);
    return [x,y];
  });
  const d=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');

  let trend='';
  if(vals.length>=2){
    const n=vals.length;
    const sx=(n-1)*n/2;
    const sy=vals.reduce((a,b)=>a+b,0);
    const sxx=(n-1)*n*(2*n-1)/6;
    const sxy=vals.reduce((s,v,i)=>s+i*v,0);
    const den=n*sxx-sx*sx;
    const slope=den?(n*sxy-sx*sy)/den:0;
    const intercept=(sy-slope*sx)/n;
    const yVal=i=>Math.max(0,Math.min(100,intercept+slope*i));
    const a=yVal(0),b=yVal(n-1);
    const y1=h-p-(a-lo)/denom*(h-2*p);
    const y2=h-p-(b-lo)/denom*(h-2*p);
    trend=`<line x1="${p}" y1="${y1.toFixed(1)}" x2="${w-p}" y2="${y2.toFixed(1)}" class="dev58-spark-trend"/>`;
  }

  return `<svg class="dev58-spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <line x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}" class="dev58-spark-axis"/>
    <path d="${d}" class="dev58-spark-line"/>
    ${trend}
    ${pts.map((q,i)=>`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${i===pts.length-1?3.8:2.5}" class="${i===pts.length-1?'latest':''}"/>`).join('')}
  </svg>`;
}

function devInterestingMetric(items){

  return `<div class="dev59-loss">
    <div class="dev59-loss-bar">
      <div class="own" style="width:${b.ownShare}%"></div>
      <div class="opp" style="width:${b.oppShare}%"></div>
    </div>
    <div class="dev59-loss-legend">
      <span><i class="own"></i>Eigene Fehler <b>${b.ownErr} · ${b.ownShare}%</b></span>
      <span><i class="opp"></i>Gegner-Winner <b>${b.oppWinner} · ${b.oppShare}%</b></span>
    </div>
  </div>`;
}

function dev59ReturnRows(m){
  const pts=m?.points||[];
  return flowReplay(m)
    .filter(e=>e.type==='point'&&e.server==='opponent')
    .map(e=>({event:e,p:pts[e.pointIndex]}))
    .filter(x=>x.p);
}
function dev59ReturnInPlaySeries(matches){
  return devMetricSeries(matches,m=>{
    const r=dev59ReturnRows(m);if(r.length<5)return null;
    const directLost=r.filter(x=>
      (x.p.winner==='opponent'&&x.p.kind==='winner'&&x.p.shot==='Aufschlag') ||
      (x.p.winner==='opponent'&&x.p.kind==='error'&&x.p.shot==='Return')
    ).length;
    const ok=r.length-directLost;
    return {value:pct(ok,r.length),n:r.length,pos:ok};
  });
}
function dev59ReturnWinSeries(matches){
  return devMetricSeries(matches,m=>{
    const r=dev59ReturnRows(m);if(r.length<5)return null;
    const w=r.filter(x=>x.p.winner==='player').length;
    return {value:pct(w,r.length),n:r.length,pos:w};
  });
}
function dev59ReturnImpactSeries(matches){
  return devMetricSeries(matches,m=>{
    const r=dev59ReturnRows(m);if(r.length<5)return null;
    const a=r.filter(x=>x.p.winner==='player'&&x.p.shot==='Return').length;
    return {value:pct(a,r.length),n:r.length,pos:a};
  });
}
function dev59ReturnErrorSeries(matches){
  return devMetricSeries(matches,m=>{
    const r=dev59ReturnRows(m);if(r.length<5)return null;
    const e=r.filter(x=>x.p.winner==='opponent'&&x.p.kind==='error'&&x.p.shot==='Return').length;
    return {value:pct(e,r.length),n:r.length,pos:e};
  });
}
function dev59ReturnErrorAvgPerMatch(matches){
  const counts=(matches||[]).map(m=>{
    const r=dev59ReturnRows(m);
    if(!r.length)return null;
    return r.filter(x=>x.p.winner==='opponent'&&x.p.kind==='error'&&x.p.shot==='Return').length;
  }).filter(v=>v!==null);
  return dev581Average(counts,1);
}
function dev59Decimal(v){
  return Number.isFinite(v)?v.toFixed(1).replace('.',','):'—';
}
function dev59DoubleKpi(label,percent,avg,labelAvg,trendHtml='',tone='neutral'){
  return `<div class="dev59-double-kpi ${tone}">
    <div class="dev59-double-title">${esc(label)}</div>
    <div class="dev59-double-main">
      <div class="dev59-double-side"><b>${percent===null?'—':percent+'%'}</b><span>Anteil</span></div>
      <div class="dev59-double-divider"></div>
      <div class="dev59-double-side"><b>Ø ${esc(dev59Decimal(avg))}</b><span>${esc(labelAvg)}</span></div>
    </div>
    ${trendHtml?`<div class="dev59-double-trend">${trendHtml}</div>`:''}
  </div>`;
}
function dev59DfMetric(df,matches){
  const v=dev581Percent(df),avg=dev581DfAvgPerMatch(matches);
  return dev59DoubleKpi('Doppelfehler',v,avg,'pro Match',dev581TrendPill(df,true),dev581StatusClass(v,true));
}

function dev59ReturnErrorMetric(series,matches){
  const v=dev581Percent(series),avg=dev59ReturnErrorAvgPerMatch(matches);
  return dev59DoubleKpi('Returnfehler',v,avg,'pro Match',dev581TrendPill(series,true),dev581StatusClass(v,true));
}
function dev59LinkedTrend(title,series,inverse=false){

function dev59TripleHub(items){
  return `<div class="dev59-triple-hub">${items.map(x=>`<div class="dev59-triple-pane">
    <div class="dev581-hub-label">${esc(x.label)}</div>${x.body}
  </div>`).join('')}</div>`;
}

function dev581SummaryHeadline(matches){
  const vh=devStrokeSeries(matches,'Vorhand'), rh=devStrokeSeries(matches,'Rückhand'), err=devOwnErrorSeries(matches);
  const vals=[
    {id:'vh', label:'Vorhand', v:dev581Percent(vh), inv:false},
    {id:'rh', label:'Rückhand', v:dev581Percent(rh), inv:false},
    {id:'err', label:'Eigene Fehler', v:dev581Percent(err), inv:true}
  ].filter(x=>x.v!==null);
  if(!vals.length)return {title:'Noch zu wenig verlässliche Daten', text:'Für eine klare Entwicklungsrichtung brauchen wir zunächst einige auswertbare Matches.'};
  vals.sort((a,b)=>{
    const aa=a.inv?100-a.v:a.v, bb=b.inv?100-b.v:b.v;
    return bb-aa;
  });
  const top=vals[0];
  if(top.id==='err') return {title:'Fehlerkontrolle trägt aktuell am meisten', text:`Eigene Fehler liegen derzeit bei ${top.v}%. Das spricht dafür, dass Ballsicherheit ein wichtiger Hebel ist.`};
  return {title:`${top.label} wirkt aktuell am stärksten`, text:`${top.label} kommt über die ausgewählten Matches zusammen auf ${top.v}% positive Punktwirkung.`};
}

function normalizeOpponentName(v){
  return String(v||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ');
}
function isGenericOpponentName(v){
  const n=normalizeOpponentName(v);
  return !n||['gegner in','gegnerin','gegner','unbekannt'].includes(n);
}
function opponentById(oid){return (state.opponents||[]).find(o=>o.id===oid)||null}
function opponentDisplayMeta(o){
  const parts=[];
  if(o?.birthYear)parts.push(`Jg. ${o.birthYear}`);
  if(o?.club)parts.push(o.club);
  if(o?.hand)parts.push(o.hand+'händig');
  return parts.join(' · ')||'Weitere Angaben optional';
}
function opponentAliases(o){return Array.isArray(o?.aliases)?o.aliases:[]}
function opponentNamesForSearch(o){return [o?.name,...opponentAliases(o)].filter(Boolean).map(normalizeOpponentName)}
function opponentExactCandidates(name,birthYear=null){
  const n=normalizeOpponentName(name);
  return (state.opponents||[]).filter(o=>{
    if(!opponentNamesForSearch(o).includes(n))return false;
    if(birthYear&&o.birthYear&&Number(birthYear)!==Number(o.birthYear))return false;
    return true;
  });
}
function opponentLevenshtein(a,b){
  a=normalizeOpponentName(a);b=normalizeOpponentName(b);
  const row=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){
    let prev=row[0];row[0]=i;
    for(let j=1;j<=b.length;j++){
      const old=row[j];
      row[j]=Math.min(row[j]+1,row[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));
      prev=old;
    }
  }
  return row[b.length];
}
function opponentSearchCandidates(name){
  const n=normalizeOpponentName(name);
  if(n.length<2)return [];
  return (state.opponents||[]).map(o=>{
    const names=opponentNamesForSearch(o);
    const exact=names.includes(n);
    const contains=names.some(x=>x.includes(n)||n.includes(x));
    const dist=Math.min(...names.map(x=>opponentLevenshtein(n,x)));
    const maxDist=Math.max(1,Math.min(3,Math.floor(n.length*.22)));
    const score=exact?0:contains?1:dist<=maxDist?2+dist:99;
    return {o,score};
  }).filter(x=>x.score<99).sort((a,b)=>a.score-b.score||String(a.o.name).localeCompare(String(b.o.name),'de')).slice(0,5).map(x=>x.o);
}
function newOpponentObject({name,birthYear=null,club='',hand=null}){
  const now=Date.now();
  return {id:'opp_'+id(),name:String(name||'').trim(),birthYear:birthYear?Number(birthYear):null,club:String(club||'').trim(),hand:hand||null,aliases:[],observations:[],stamps:{},createdAt:now,updatedAt:now};
}
function normalizeOpponentObject(o){
  o.aliases=Array.isArray(o.aliases)?o.aliases:[];
  o.observations=Array.isArray(o.observations)?o.observations:[];
  o.stamps=o.stamps&&typeof o.stamps==='object'?o.stamps:{};
  o.club=o.club||'';
  o.hand=o.hand||null;
  o.updatedAt=o.updatedAt||o.createdAt||Date.now();
  return o;
}
function ensureOpponentDatabase(){
  if(!Array.isArray(state.opponents))state.opponents=[];
  state.opponents.forEach(normalizeOpponentObject);
  let changed=false;
  const all=[...(state.matches||[]),...(state.matchArchive||[])];
  all.forEach(m=>{
    if(!m||isGenericOpponentName(m.opponent))return;
    if(m.opponentId&&opponentById(m.opponentId))return;
    const matches=opponentExactCandidates(m.opponent,m.opponentBirthYear||null);
    let o=matches.length===1?matches[0]:null;
    if(!o){
      if(state.settings?.opponentTestCleanup6221Done)return;
      o=newOpponentObject({name:m.opponent,birthYear:m.opponentBirthYear||null,hand:m.opponentHand||null});
      state.opponents.push(o);
    }
    m.opponentId=o.id;
    changed=true;
  });
  if(changed)save();
}
function opponentLinkedMatches(o){
  if(!o)return [];
  const seen=new Set();
  return [...(state.matches||[]),...(state.matchArchive||[])].filter(m=>{
    if(!m||seen.has(m.id))return false;
    const linked=m.opponentId===o.id;
    if(linked)seen.add(m.id);
    return linked;
  });
}
function opponentLastActivity(o){
  const vals=[
    o?.updatedAt||0,
    ...(o?.observations||[]).map(x=>x.createdAt||0),
    ...opponentLinkedMatches(o).map(m=>matchTimestamp(m)||m.createdAt||0),
    ...opponentScoutMatches(o).map(m=>matchTimestamp(m)||m.createdAt||0)
  ];
  return Math.max(0,...vals);
}

function opponentStampCounts(o){

function opponentFirstTests(o){

  return tests.slice(0,3);
}

function scoutChoose(qid,traitId,el){

    wrap?.querySelectorAll('.scout-choice').forEach(b=>b.classList.remove('selected'));
    return;
  }
  scoutDraft[qid]=traitId;
  wrap?.querySelectorAll('.scout-choice').forEach(b=>b.classList.toggle('selected',b.dataset.scoutTrait===traitId));
}
function saveScoutObservation(oid){
  const o=opponentById(oid);if(!o){opponents();return}
  const traitIds=Object.values(scoutDraft||{}).filter(Boolean);
  const note=document.getElementById('scoutNote')?.value.trim()||'';
  if(!traitIds.length&&!note){toast('Bitte mindestens eine Beobachtung oder Notiz erfassen.');return}
  const now=Date.now();
  o.observations.push({id:'obs_'+id(),createdAt:now,traitIds:[...traitIds],note});
  o.stamps=o.stamps||{};
  traitIds.forEach(traitId=>{
    const t=scoutTrait(traitId);if(!t)return;
    Object.values(o.stamps).forEach(s=>{
      const old=scoutTrait(s.traitId);
      if(old&&old.qid===t.qid&&s.traitId!==traitId&&s.status==='active'){
        s.status='review';
        s.lastContradicted=now;
      }
    });
    const s=o.stamps[traitId];
    if(s){
      s.status='active';s.lastSeen=now;s.confirmations=(s.confirmations||0)+1;
    }else{
      o.stamps[traitId]={traitId,status:'active',firstSeen:now,lastSeen:now,confirmations:1};
    }
  });
  o.updatedAt=now;save();scoutDraft={};toast('Beobachtung gespeichert.');opponentProfile(oid);
}

function chooseOpponentMergeField(field,side,el){const wrap=el.closest('[data-merge-wrap]');if(!wrap)return;const input=wrap.querySelector(`[data-merge-field="${field}"]`);if(input)input.value=side;wrap.querySelectorAll('[data-merge-choice]').forEach(b=>b.classList.toggle('selected',b===el))}
function confirmOpponentMerge(targetId,sourceId){
  const target=opponentById(targetId),source=opponentById(sourceId);if(!target||!source)return;
  const choices={},fields=['name','birthYear','club','hand'];
  for(const field of fields){const el=document.querySelector(`[data-merge-field="${field}"]`);if(el){if(!el.value){toast(`Bitte ${field==='birthYear'?'Jahrgang':field==='club'?'Verein':field==='hand'?'Spielhand':'Name'} auswählen.`);return}choices[field]=el.value}}
  mergeOpponentProfiles(targetId,sourceId,choices);
}
function mergeOpponentProfiles(targetId,sourceId,choices={}){
  const t=opponentById(targetId),s=opponentById(sourceId);if(!t||!s||t.id===s.id)return;
  normalizeOpponentObject(t);normalizeOpponentObject(s);
  const oldTargetName=t.name,oldSourceName=s.name;
  const choose=(field)=>{const a=t[field]??'',b=s[field]??'';if(String(a||'')===String(b||''))return a||b||null;if(!a||!b)return a||b||null;return choices[field]==='source'?b:a};
  t.name=choose('name')||t.name||s.name;t.birthYear=choose('birthYear')?Number(choose('birthYear')):null;t.club=choose('club')||'';t.hand=choose('hand')||null;
  t.aliases=[...new Set([...(t.aliases||[]),oldTargetName,oldSourceName,...(s.aliases||[])].filter(x=>x&&normalizeOpponentName(x)!==normalizeOpponentName(t.name)))];
  t.observations=[...(t.observations||[]),...(s.observations||[])].sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  Object.values(s.stamps||{}).forEach(ss=>{const ts=t.stamps[ss.traitId];if(!ts)t.stamps[ss.traitId]={...ss};else{ts.firstSeen=Math.min(ts.firstSeen||Infinity,ss.firstSeen||Infinity);if(!Number.isFinite(ts.firstSeen))ts.firstSeen=Date.now();if((ss.lastSeen||0)>(ts.lastSeen||0)){ts.lastSeen=ss.lastSeen;ts.status=ss.status}ts.confirmations=(ts.confirmations||0)+(ss.confirmations||0)}});
  const byQuestion={};Object.values(t.stamps).filter(x=>x.status==='active').forEach(st=>{const tr=scoutTrait(st.traitId);if(!tr)return;(byQuestion[tr.qid]||(byQuestion[tr.qid]=[])).push(st)});Object.values(byQuestion).forEach(arr=>{if(arr.length>1){arr.sort((a,b)=>(b.lastSeen||0)-(a.lastSeen||0));arr.slice(1).forEach(x=>x.status='review')}});
  [...(state.matches||[]),...(state.matchArchive||[])].forEach(m=>{if(m.opponentId===sourceId||m.opponentId===targetId){m.opponentId=targetId;m.opponent=t.name;m.opponentBirthYear=t.birthYear||null;if(t.hand)m.opponentHand=t.hand}});
  (state.opponentMatches||[]).forEach(m=>{if(m.opponentProfileId===sourceId||m.opponentProfileId===targetId){m.opponentProfileId=targetId;m.player=t.name;m.playerBirthYear=t.birthYear||null;if(t.hand)m.playerHand=t.hand}});
  t.updatedAt=Date.now();state.opponents=state.opponents.filter(o=>o.id!==sourceId);save();toast('Gegnerprofile zusammengeführt.');opponentProfile(targetId);
}

function resolveOpponentForMatch(name,birthYear,hand,preferredId){
  if(isGenericOpponentName(name))return {profile:null,ambiguous:false};
  if(preferredId){
    const o=opponentById(preferredId);
    if(o){
      if(birthYear&&!o.birthYear)o.birthYear=Number(birthYear);
      if(hand&&!o.hand)o.hand=hand;
      o.updatedAt=Date.now();
      return {profile:o,ambiguous:false};
    }
  }
  const exact=opponentExactCandidates(name,birthYear||null);
  if(exact.length===1){
    const o=exact[0];
    if(birthYear&&!o.birthYear)o.birthYear=Number(birthYear);
    if(hand&&!o.hand)o.hand=hand;
    o.updatedAt=Date.now();
    return {profile:o,ambiguous:false};
  }
  if(exact.length>1)return {profile:null,ambiguous:true};
  const o=newOpponentObject({name,birthYear:birthYear||null,hand});
  state.opponents.push(o);
  return {profile:o,ambiguous:false};
}

function oppCapture(){let s=1,a=null,b=null;function draw(){if(s===1)shell('Gegneranalyse',`<div class="card"><div class="section">Wo passiert der Fehler der Gegnerin?</div><div class="grid">${['Aufschlag','Return','Vorhand','Rückhand','Volley'].map(x=>`<button class="${a===x?'selected':''}" onclick="window.oc('${x}')">${x}</button>`).join('')}</div><button class="primary" style="margin-top:14px" onclick="window.onext()">WEITER</button></div>`,'opponents');else shell('Gegneranalyse',`<div class="card"><div class="section">Wo kam Mias Ball vorher hin?</div><div class="grid">${['kurz','tief','hoch','Winkel'].map(x=>`<button class="${b===x?'selected':''}" onclick="window.ob('${x}')">${x}</button>`).join('')}</div><button class="primary" style="margin-top:14px" onclick="window.osave()">SPEICHERN</button></div>`,'opponents')}window.oc=x=>{a=x;draw()};window.onext=()=>{if(!a){toast('Schlag auswählen.');return}s=2;draw()};window.ob=x=>{b=x;draw()};window.osave=()=>{if(!b){toast('Ballcharakteristik auswählen.');return}toast('Gegnerfehler gespeichert.');opponents()};draw()}

function cleanupOpponentTestDataOnce(){
  state.settings=state.settings||{};
  if(state.settings.opponentTestCleanup6221Done)return;

  state.opponents=Array.isArray(state.opponents)?state.opponents:[];
  state.opponentMatches=Array.isArray(state.opponentMatches)?state.opponentMatches:[];

  const norm=v=>String(v||'').trim().toLowerCase().normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ');
  const keepDefs=[
    {name:'Nora Husse',key:norm('Nora Husse')},
    {name:'Carla Radziwolek',key:norm('Carla Radziwolek')}
  ];
  const allOwn=[...(state.matches||[]),...(state.matchArchive||[])];

  function profileNames(o){return [o?.name,...(Array.isArray(o?.aliases)?o.aliases:[])].filter(Boolean).map(norm)}
  function profileRichness(o){
    return (o?.observations||[]).length+Object.keys(o?.stamps||{}).length+
      state.opponentMatches.filter(m=>m.opponentProfileId===o.id).length+
      allOwn.filter(m=>m.opponentId===o.id).length;
  }
  function mergeInto(target,source){
    if(!target||!source||target.id===source.id)return;
    target.aliases=[...new Set([...(target.aliases||[]),source.name,...(source.aliases||[])].filter(Boolean))];
    if(!target.birthYear&&source.birthYear)target.birthYear=source.birthYear;
    if(!target.club&&source.club)target.club=source.club;
    if(!target.hand&&source.hand)target.hand=source.hand;
    target.observations=[...(target.observations||[]),...(source.observations||[])].sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    target.stamps=target.stamps||{};
    Object.values(source.stamps||{}).forEach(ss=>{
      const ts=target.stamps[ss.traitId];
      if(!ts){target.stamps[ss.traitId]={...ss};return}
      const first=[ts.firstSeen,ss.firstSeen].filter(Boolean);
      if(first.length)ts.firstSeen=Math.min(...first);
      if((ss.lastSeen||0)>(ts.lastSeen||0)){ts.lastSeen=ss.lastSeen;ts.status=ss.status}
      ts.confirmations=(ts.confirmations||0)+(ss.confirmations||0);
    });
    allOwn.forEach(m=>{
      if(m.opponentId===source.id){m.opponentId=target.id;m.opponent=target.name;m.opponentBirthYear=target.birthYear||m.opponentBirthYear||null;if(target.hand)m.opponentHand=target.hand}
    });
    state.opponentMatches.forEach(m=>{
      if(m.opponentProfileId===source.id){m.opponentProfileId=target.id;m.player=target.name;m.playerBirthYear=target.birthYear||m.playerBirthYear||null;if(target.hand)m.playerHand=target.hand}
    });
  }

  const kept=[];
  const keptIds=new Set();

  keepDefs.forEach(def=>{
    let candidates=state.opponents.filter(o=>profileNames(o).includes(def.key));
    const ownMatching=allOwn.filter(m=>norm(m.opponent)===def.key);

    if(!candidates.length&&ownMatching.length){
      const sample=ownMatching[0];
      const created=newOpponentObject({name:def.name,birthYear:sample.opponentBirthYear||null,hand:sample.opponentHand||null});
      state.opponents.push(created);
      candidates=[created];
    }
    if(!candidates.length)return;

    candidates.sort((a,b)=>{
      const ae=norm(a.name)===def.key?1:0,be=norm(b.name)===def.key?1:0;
      if(ae!==be)return be-ae;
      return profileRichness(b)-profileRichness(a);
    });

    const target=candidates[0];
    const oldTargetName=target.name;
    target.name=def.name;
    target.aliases=[...new Set([...(target.aliases||[]),oldTargetName].filter(x=>x&&norm(x)!==def.key))];
    candidates.slice(1).forEach(source=>mergeInto(target,source));

    // Re-link all own matches that carry the canonical real name, even if an old test link existed.
    ownMatching.forEach(m=>{
      m.opponentId=target.id;
      m.opponent=def.name;
      m.opponentBirthYear=target.birthYear||m.opponentBirthYear||null;
      if(target.hand)m.opponentHand=target.hand;
    });

    target.updatedAt=Date.now();
    kept.push(target);keptIds.add(target.id);
  });

  // Own player history is intentionally retained. Only links to removed test profiles are cleared.
  allOwn.forEach(m=>{if(m.opponentId&&!keptIds.has(m.opponentId))m.opponentId=null});

  // Foreign observed matches are part of the opponent database and therefore test data if their profile is removed.
  state.opponentMatches=state.opponentMatches.filter(m=>keptIds.has(m.opponentProfileId));
  state.opponents=kept;
  state.settings.opponentTestCleanup6221Done=true;
  save();
}


function cleanupRealMatchHistoryOnce(){
  state.settings=state.settings||{};
  if(state.settings.realMatchHistoryCleanup6222Done)return;

  const norm=v=>String(v||'').trim().toLowerCase().normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ');

  const bella=(state.players||[]).find(p=>norm(p?.name)==='bella');
  if(!bella)return;

  const specs=[
    {name:'Nora Husse',key:norm('Nora Husse'),score:'6:4 · 6:2',date:'23.08.2026'},
    {name:'Carla Radziwolek',key:norm('Carla Radziwolek'),score:'6:4 · 2:6 · 10:7',date:'23.08.2026'}
  ];

  const all=[...(state.matches||[]),...(state.matchArchive||[])];

  function candidatesFor(spec){
    return all.filter(m=>m&&norm(m.opponent)===spec.key&&analysisResultText(m)===spec.score);
  }

  const selected=[];
  for(const spec of specs){
    const candidates=candidatesFor(spec);
    if(!candidates.length)return;
    candidates.sort((a,b)=>{
      const ad=formatMatchDate(a)===spec.date?1:0;
      const bd=formatMatchDate(b)===spec.date?1:0;
      if(ad!==bd)return bd-ad;
      const ap=(a.points||[]).length,bp=(b.points||[]).length;
      if(ap!==bp)return bp-ap;
      return (b.completedAt||b.createdAt||0)-(a.completedAt||a.createdAt||0);
    });
    selected.push(candidates[0]);
  }

  selected.forEach(m=>{
    m.playerId=bella.id;
    m.player=bella.name;
    m.playerBirthYear=bella.birthYear||m.playerBirthYear||null;
    m.playerHand=bella.hand||m.playerHand||null;
    m.finished=true;
    if(!m.status||m.status==='nicht beendet'||m.status==='pausiert')m.status='beendet';

    const o=(state.opponents||[]).find(x=>
      norm(x?.name)===norm(m.opponent) ||
      (x?.aliases||[]).some(a=>norm(a)===norm(m.opponent))
    );
    if(o){
      m.opponentId=o.id;
      m.opponent=o.name;
      if(o.birthYear)m.opponentBirthYear=o.birthYear;
      if(o.hand)m.opponentHand=o.hand;
    }
  });

  state.matches=selected;
  state.matchArchive=[];
  state.opponentMatches=[];

  state.currentMatchId=null;
  state.analysisMatchId=selected[0]?.id||null;
  state.developmentSelections={};
  state.activePlayerId=bella.id;

  state.settings.realMatchHistoryCleanup6222Done=true;
  save();
}
