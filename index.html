<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Tennis Analysis V13</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f3;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:88px}.top{height:64px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between}.top h1{font-size:20px;margin:0}.gear{border:0;background:transparent;box-shadow:none;font-size:22px;min-width:44px}
.content{padding:0 16px}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 1px 4px #0001}
.section{margin:15px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;color:#6b7280}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.input{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:12px;background:#fff}
button{font:inherit;border:0;border-radius:14px;padding:14px;min-height:52px;background:#fff;box-shadow:0 1px 3px #0002;font-weight:650;color:#111827}
button.primary{background:#111827;color:#fff;width:100%}button.secondary{background:#e5e7eb;width:100%}button.selected{background:#e5e7eb;outline:3px solid #111827}
.muted{color:#6b7280;font-size:13px;line-height:1.45}.score{text-align:center;font-size:32px;font-weight:800;margin:4px 0 12px}
.nav{position:fixed;z-index:10;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px max(6px,env(safe-area-inset-bottom))}
.nav button{box-shadow:none;background:transparent;min-height:48px;font-size:12px;padding:7px 2px}.nav button.active{background:#eee}
.court{position:relative;width:100%;aspect-ratio:1;border:3px solid #111;background:#eef2f3;border-radius:8px;overflow:hidden;touch-action:none}
.zone{position:absolute;width:33.3333%;height:33.3333%;border-right:1px solid #777;border-bottom:1px solid #777}.z1{left:0;top:0}.z2{left:33.3333%;top:0}.z3{left:66.6667%;top:0;border-right:0}.z4{left:0;top:33.3333%}.z5{left:33.3333%;top:33.3333%}.z6{left:66.6667%;top:33.3333%;border-right:0}.z7{left:0;top:66.6667%;border-bottom:0}.z8{left:33.3333%;top:66.6667%;border-bottom:0}.z9{left:66.6667%;top:66.6667%;border-right:0;border-bottom:0}
.net{position:absolute;left:0;right:0;top:50%;border-top:4px solid #111;z-index:2}.marker{position:absolute;width:28px;height:28px;border-radius:50%;background:#111827;border:4px solid #fff;transform:translate(-50%,-50%);z-index:3}
.modal{position:fixed;z-index:30;inset:0;background:#0007;display:flex;align-items:flex-end}.modalbox{width:100%;max-width:720px;margin:auto 0 0;background:#fff;border-radius:22px 22px 0 0;padding:22px 16px 30px}.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;z-index:50;top:15px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 15px;border-radius:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #eee}
.badge{font-size:12px;background:#eee;border-radius:8px;padding:4px 7px}
.score-block{text-align:center!important;position:relative;background:#fff;border-radius:18px;padding:15px 10px;margin:8px 0 20px;box-shadow:0 1px 4px #0001}.score-value{font-size:24px;font-weight:800}.point-value{font-size:36px}.v8-score-row{position:relative;display:flex;justify-content:center;align-items:center;min-height:44px}.v8-server-indicator{position:absolute;top:50%;transform:translateY(-50%);font-size:8px;line-height:1}.v8-server-indicator.left{left:18%}.v8-server-indicator.right{right:18%}.server-ball{font-size:8px;margin-right:3px;vertical-align:middle}
.v8-court-wrap{max-width:560px;margin:12px auto}.v8-court-half{position:relative;width:100%;aspect-ratio:.66;border:3px solid #222;background:#5f855c;border-radius:5px;overflow:hidden}.v8-net{position:absolute;left:0;right:0;top:0;height:4%;background:#d7d7d7;border-bottom:3px solid #222;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#222;z-index:2}.v8-court-lines{position:absolute;left:7%;right:7%;top:4%;bottom:2.5%;z-index:1;border-left:2px solid #fff;border-right:2px solid #fff;border-bottom:3px solid #fff}.v8-service-line{position:absolute;left:0;right:0;top:53.85%;border-top:2px solid #fff}.v8-center-line{position:absolute;left:50%;top:0;height:53.85%;border-left:2px solid #fff}.v8-court-grid{position:absolute;left:7%;right:7%;top:4%;bottom:2.5%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);z-index:4}.v8-cell{min-width:0;min-height:0;padding:0;border-radius:0;background:transparent;box-shadow:none;border:1px dashed rgba(255,255,255,.55)}.v8-cell.selected-cell{background:rgba(255,255,255,.38);box-shadow:inset 0 0 0 4px #fff}.v8-serve-grid{position:absolute;left:7%;right:7%;top:4%;height:30%;display:grid;grid-template-columns:repeat(3,1fr);z-index:5}.v8-serve-grid .v8-cell{border:2px solid rgba(255,255,255,.8)}.v8-serve-grid .v8-cell.selected-cell{background:rgba(255,255,255,.42)}.v8-serve-target{position:absolute;top:4%;height:50.35%;width:43%;z-index:6;display:grid;grid-template-columns:repeat(3,1fr)}.v8-serve-target.left{left:7%}.v8-serve-target.right{right:7%}.v8-serve-target .v8-cell{border:2px solid rgba(255,255,255,.9);border-radius:0}.v8-serve-target .v8-cell.selected-cell{background:rgba(255,255,255,.42);box-shadow:inset 0 0 0 3px #fff}.v8-court-caption{text-align:center;margin-top:8px;font-size:13px}.v8-disabled{opacity:.38;cursor:not-allowed!important}

/* V31 Serve dashboard UI */
.serve-hero{background:linear-gradient(180deg,#f7faf8 0%,#ffffff 100%);border:1px solid #dce5df}
.serve-hero .section{margin-bottom:8px}
.serve-insight{padding:12px 14px;border-radius:12px;background:#f3f7f4;border:1px solid #dfe8e2;margin-top:8px;line-height:1.35}
.serve-kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.serve-kpi{border:1px solid #dfe5e1;border-radius:14px;padding:13px 10px;text-align:center;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.serve-kpi-label{font-size:12px;color:#6d756f;line-height:1.2;min-height:29px;display:flex;align-items:center;justify-content:center}
.serve-kpi-value{font-size:26px;font-weight:900;letter-spacing:-.02em;margin-top:4px}
.serve-kpi-sub{font-size:11px;color:#7c847f;margin-top:3px}
.serve-section-card{border:1px solid #e0e6e2;border-radius:16px;background:#fff;overflow:hidden}
.serve-section-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #edf1ee;background:#fafcfb}
.serve-section-title{font-weight:900;font-size:15px}
.serve-pill{font-size:11px;font-weight:800;padding:4px 8px;border-radius:999px;background:#edf4ef}
.serve-side{padding:12px 14px}
.serve-side+.serve-side{border-top:1px solid #edf1ee}
.serve-side-title{font-size:13px;font-weight:800;margin-bottom:8px}
.serve-row{margin:10px 0}
.serve-row-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.serve-row-label{font-size:13px;font-weight:800}
.serve-row-metrics{font-size:12px;color:#68716b;text-align:right}
.serve-bar{height:8px;border-radius:999px;background:#e9eeeb;overflow:hidden;margin-top:5px}
.serve-bar>span{display:block;height:100%;background:#1f4d3a;border-radius:999px}
.serve-empty{font-size:12px;color:#7b827d;padding:4px 0}
@media(max-width:380px){
  .serve-kpi-value{font-size:23px}
  .serve-kpi{padding:11px 8px}
}


/* V32: visual variety for Serve analysis */
.serve-columns{display:flex;align-items:flex-end;justify-content:space-around;gap:12px;height:190px;padding:18px 10px 8px}
.serve-column-item{flex:1;min-width:0;text-align:center}
.serve-column-wrap{height:125px;display:flex;align-items:flex-end;justify-content:center}
.serve-column{width:min(48px,72%);min-height:4px;border-radius:8px 8px 3px 3px;background:#1f4d3a;position:relative}
.serve-column-value{position:absolute;left:50%;transform:translateX(-50%);top:-23px;font-size:12px;font-weight:900;white-space:nowrap}
.serve-column-label{font-size:11px;font-weight:800;line-height:1.15;margin-top:9px;min-height:27px}
.serve-column-count{font-size:10px;color:#747c77;margin-top:3px}

.serve-donut-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px}
.serve-donut-card{text-align:center;min-width:0}
.serve-donut-title{font-size:13px;font-weight:900;margin-bottom:10px}
.serve-donut{width:118px;height:118px;border-radius:50%;margin:0 auto;position:relative}
.serve-donut::after{content:"";position:absolute;inset:24px;border-radius:50%;background:#fff}
.serve-donut-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:2;font-weight:900}
.serve-donut-center strong{font-size:20px}
.serve-donut-center span{font-size:10px;color:#747c77;font-weight:700}
.serve-donut-legend{margin-top:10px;text-align:left}
.serve-legend-row{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11px;margin:5px 0}
.serve-legend-name{display:flex;align-items:center;gap:6px}
.serve-legend-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.serve-donut-empty{height:118px;display:flex;align-items:center;justify-content:center;border:1px dashed #d8dfda;border-radius:50%;width:118px;margin:0 auto;color:#7b827d;font-size:11px;padding:14px;text-align:center}
@media(max-width:380px){
  .serve-columns{gap:7px;padding-left:4px;padding-right:4px}
  .serve-column{width:min(40px,76%)}
  .serve-donut{width:104px;height:104px}
  .serve-donut::after{inset:21px}
  .serve-donut-empty{width:104px;height:104px}
}


/* V33 Match overview */
.match-result{text-align:center;padding:18px 12px}
.match-result-name{font-size:14px;color:#68716b;font-weight:800}
.match-result-score{font-size:32px;font-weight:900;letter-spacing:-.03em;margin:7px 0 4px}
.match-result-sets{font-size:13px;color:#747c77}
.match-insight{padding:12px 14px;border-radius:12px;background:#f3f7f4;border:1px solid #dfe8e2;margin-top:8px;line-height:1.35}
.match-kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match-kpi{border:1px solid #dfe5e1;border-radius:14px;padding:13px 9px;text-align:center;background:#fff}
.match-kpi-label{font-size:11px;color:#6d756f;min-height:28px;display:flex;align-items:center;justify-content:center}
.match-kpi-value{font-size:25px;font-weight:900;margin-top:3px}
.match-kpi-sub{font-size:10px;color:#7c847f;margin-top:3px}
.decision-group{padding:12px 14px}
.decision-group+.decision-group{border-top:1px solid #edf1ee}
.decision-title{font-size:13px;font-weight:900;margin-bottom:9px}
.decision-bar{display:flex;height:22px;border-radius:999px;overflow:hidden;background:#e9eeeb}
.decision-a{background:#1f4d3a}
.decision-b{background:#aebdb5}
.decision-legend{display:flex;justify-content:space-between;gap:8px;font-size:11px;margin-top:7px;color:#606963}

</style></head><body><div id="app"></div><script>
'use strict';
const KEY='tennis-analysis-v6';
const app=document.getElementById('app');
const D={players:[],activePlayerId:null,matches:[],currentMatchId:null,settings:{startScore:'0:0',ad:true,thirdSet:'match-tiebreak'}};
let state=load(),hand=null,oppHand=null,mods={court:false,rally:false,serve:false,opponent:false};
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');return x?{...D,...x,settings:{...D.settings,...(x.settings||{})}}:JSON.parse(JSON.stringify(D));}catch(e){return JSON.parse(JSON.stringify(D));}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1500)}
function player(){return state.players.find(p=>p.id===state.activePlayerId)||null}
function match(){const m=state.matches.find(m=>m.id===state.currentMatchId)||null;if(m){if(!m.currentSet)m.currentSet=Math.max(1,m.sets[0]+m.sets[1]+1);if(!m.setGames)m.setGames=[[...(m.games||[0,0])],[0,0],[0,0]];if(!m.completedSets)m.completedSets=[]}return m}
function running(){const m=match();return !!m&&!m.finished}
function shell(title,body,active='matches'){app.innerHTML=`<div class="app"><header class="top"><h1>${esc(title)}</h1><button class="gear" onclick="settings()">⚙</button></header><main class="content">${body}</main><nav class="nav"><button class="${active==='matches'?'active':''}" onclick="nav('matches')">Matches</button><button class="${active==='analysis'?'active':''}" onclick="nav('analysis')">Analyse</button><button class="${active==='development'?'active':''}" onclick="nav('development')">Entwicklung</button><button class="${active==='opponents'?'active':''}" onclick="nav('opponents')">Gegner</button></nav></div>`}
function nav(x){const m=match();if(m&&!m.finished&&!m.navParked){parkPrompt(x);return}go(x)}
function parkPrompt(x){const e=document.createElement('div');e.className='modal';e.innerHTML='<div class="modalbox"><h3>Laufendes Match</h3><p class="muted">Das Match wird einmalig gespeichert. Du kannst es anschließend im Menüpunkt Matches fortsetzen.</p><div class="modal-actions"><button onclick="this.closest(\'.modal\').remove()">Abbrechen</button><button class="primary" onclick="leave(true,\'${x}\')">Speichern</button></div><button class="secondary" style="margin-top:8px" onclick="leave(false,\'${x}\')">Verwerfen</button></div>';e.querySelector('.primary').onclick=()=>leave(true,x);e.querySelector('.secondary').onclick=()=>leave(false,x);document.body.appendChild(e)}
function leave(saveIt,x){const m=match();if(saveIt&&m){m.status='nicht beendet';m.navParked=true;m.paused=true;state.currentMatchId=null;save()}else if(m){state.matches=state.matches.filter(a=>a.id!==m.id);state.currentMatchId=null;save()}document.querySelector('.modal')?.remove();go(x)}
function go(x){if(x==='matches')home();else if(x==='analysis')analysis();else if(x==='development')development();else opponents()}
function settings(){if(running()){nav('settings');return}const p=player();hand=p?.hand||null;shell('Einstellungen',`<div class="card"><div class="section">Aktive Spieler/-in</div><input id="pn" class="input" value="${esc(p?.name||'')}" placeholder="Name"><div class="section">Spielhand</div><div class="grid"><button id="hr" class="${hand==='Rechts'?'selected':''}" onclick="pickHand('Rechts')">Rechtshändig</button><button id="hl" class="${hand==='Links'?'selected':''}" onclick="pickHand('Links')">Linkshändig</button></div><div class="section">LK</div><input id="plk" class="input" inputmode="decimal" value="${esc(p?.lk||'')}" placeholder="z. B. 20.8"><button class="primary" style="margin-top:14px" onclick="savePlayer()">SPIELER/-IN SPEICHERN</button></div><div class="card"><div class="section">Matchregeln</div><select id="start" class="input"><option value="0:0">0:0</option><option value="2:2">2:2</option></select><div class="section">Punktwertung</div><select id="ad" class="input"><option value="1">Mit Ad</option><option value="0">Ohne Ad (No-Ad)</option></select><div class="section">Dritter Satz</div><select id="third" class="input"><option value="match-tiebreak">Match-Tie-Break bis 10</option><option value="normal">Ganzer Satz</option></select><button class="primary" style="margin-top:14px" onclick="saveRules()">REGELN SPEICHERN</button></div>`,'') ;document.getElementById('start').value=state.settings.startScore;document.getElementById('ad').value=state.settings.ad?'1':'0';document.getElementById('third').value=state.settings.thirdSet}
function pickHand(x){hand=x;document.getElementById('hr').classList.toggle('selected',x==='Rechts');document.getElementById('hl').classList.toggle('selected',x==='Links')}
function savePlayer(){const n=document.getElementById('pn').value.trim(),lk=document.getElementById('plk').value.trim().replace(',','.');if(!n||!hand){toast('Name und Spielhand erforderlich.');return}let p=player();if(!p){p={id:id(),name:n,hand,lk};state.players.push(p);state.activePlayerId=p.id}else{p.name=n;p.hand=hand;p.lk=lk}save();home()}
function saveRules(){state.settings.startScore=document.getElementById('start').value;state.settings.ad=document.getElementById('ad').value==='1';state.settings.thirdSet=document.getElementById('third').value;save();toast('Gespeichert')}
function home(){const p=player(),u=state.matches.filter(m=>!m.finished);shell('Tennis Analysis',`<div class="card"><div class="section">Aktive Spieler/-in</div>${p?`<div class="input"><b>${esc(p.name)}</b> · ${esc(p.hand)} · LK ${esc(p.lk||'—')}</div><button class="primary" style="margin-top:14px;font-size:20px" onclick="newMatch()">＋ MATCH</button>`:'<button class="primary" onclick="settings()">Spieler/-in anlegen</button>'}</div>${u.length?'<div class="card"><div class="section">Nicht beendete Matches</div>'+u.map(m=>`<div class="row" style="align-items:center;gap:10px"><span style="flex:1">${esc(m.player)} – ${esc(m.opponent)}<br><span class="badge">nicht beendet</span></span><div style="display:flex;align-items:center;gap:8px;flex-shrink:0"><button class="primary" style="margin:0;padding:10px 12px;font-size:13px;white-space:nowrap" onclick="resume('${m.id}')">FORTSETZEN / ABSCHLIESSEN</button><button class="secondary" style="margin:0;width:42px;min-width:42px;padding:10px 0;font-size:18px" title="Match löschen" aria-label="Match löschen" onclick="confirmDeleteMatch('${m.id}')">🗑️</button></div></div>`).join('')+'</div>':''}`,'matches')}
function newMatch(){if(!player()){settings();return}mods={court:false,rally:false,serve:false,opponent:false};oppHand=null;shell('Neues Match',`<div class="card"><div class="section">Spieler/-in</div><div class="input">${esc(player().name)} · ${esc(player().hand)} · LK ${esc(player().lk||'—')}</div><div class="section">Gegner/-in</div><input id="on" class="input" placeholder="Name optional"><div class="section">Spielhand Gegner/-in</div><div class="grid"><button id="or" onclick="pickOpp('Rechts')">Rechtshändig</button><button id="ol" onclick="pickOpp('Links')">Linkshändig</button></div><div class="section">LK Gegner/-in</div><input id="olk" class="input" inputmode="decimal" placeholder="optional"><div class="section">Matchtyp</div><select id="type" class="input"><option value="">Nicht angegeben</option><option>Turnier</option><option>Punktspiel</option><option>Trainingsspiel</option></select><div class="section">Zusatzmodule</div><div class="grid"><button id="mc" onclick="mod('court')">Court</button><button id="mr" onclick="mod('rally')">Ballwechsel</button><button id="ms" onclick="mod('serve')">Aufschlag</button><button id="mo" onclick="mod('opponent')">Gegner</button></div><button class="primary" style="margin-top:14px" onclick="start()">MATCH STARTEN</button></div>`,'matches')}
function pickOpp(x){oppHand=x;document.getElementById('or').classList.toggle('selected',x==='Rechts');document.getElementById('ol').classList.toggle('selected',x==='Links')}
function mod(k){mods[k]=!mods[k];document.getElementById('m'+({court:'c',rally:'r',serve:'s',opponent:'o'}[k])).classList.toggle('selected',mods[k])}
function askFirstServer(){const m=match();shell('Matchbeginn',`<div class="card"><h2 style="text-align:center">Wer schlägt zuerst auf?</h2><p class="muted" style="text-align:center">Der Aufschläger wechselt nach jedem Spiel.</p><div class="grid"><button class="${m.server==='player'?'selected':''}" onclick="chooseServer('player')">🎾 ${esc(m.player)}</button><button class="${m.server==='opponent'?'selected':''}" onclick="chooseServer('opponent')">🎾 ${esc(m.opponent)}</button></div><button class="primary" style="margin-top:14px" onclick="confirmFirstServer()">MATCH STARTEN</button></div>`,'matches')}
function chooseServer(x){const m=match();m.server=x;m.firstServer=x;m.setFirstServers=m.setFirstServers||[];m.setFirstServers[0]=x;m.currentSet=1;save();askFirstServer()}
function confirmFirstServer(){if(!match().server){toast('Bitte Aufschläger auswählen.');return}point()}
function start(){const p=player(),g=state.settings.startScore.split(':').map(Number),m={id:id(),player:p.name,playerLK:p.lk,playerHand:p.hand,opponent:document.getElementById('on').value.trim()||'Gegner/-in',opponentLK:document.getElementById('olk').value.trim().replace(',','.'),opponentHand:oppHand,type:document.getElementById('type').value,mods:{...mods},sets:[0,0],games:g,gamePoints:[0,0],points:[],finished:false,status:'nicht beendet',paused:false,pending:null,court:null,rally:null,server:null,currentSet:1,setGames:[[...g],[0,0],[0,0]],completedSets:[],firstServer:null,setFirstServers:[],tiebreak:false,tiebreakPoints:[0,0],matchTiebreak:false,serveDraft:null};state.matches.push(m);state.currentMatchId=m.id;save();askFirstServer()}
function resume(x){state.currentMatchId=x;const m=match();if(!m)return;m.paused=true;m.navParked=false;save();scoreCorrection()}
function confirmDeleteMatch(x){
  const m=state.matches.find(a=>a.id===x);
  if(!m)return;
  const e=document.createElement('div');
  e.className='modal';
  e.innerHTML=`<div class="modalbox"><h3>Match löschen?</h3><p class="muted">${esc(m.player)} – ${esc(m.opponent)}<br>Die erfassten Daten werden dauerhaft entfernt.</p><div class="modal-actions"><button onclick="this.closest('.modal').remove()">Abbrechen</button><button class="primary" id="confirmDeleteBtn">Löschen</button></div></div>`;
  e.querySelector('#confirmDeleteBtn').onclick=()=>deleteMatch(x);
  document.body.appendChild(e);
}
function deleteMatch(x){
  state.matches=state.matches.filter(a=>a.id!==x);
  if(state.currentMatchId===x)state.currentMatchId=null;
  save();
  document.querySelector('.modal')?.remove();
  home();
}

function normalizedCompletedSet(m,i){
  const cs=m.completedSets?.[i];
  const sg=m.setGames?.[i];
  const tb=m.completedSetTiebreaks?.[i];

  // New-format data: a recorded set tiebreak always represents a 7:6 / 6:7 set.
  if(tb){
    return Number(tb[0])>Number(tb[1]) ? [7,6] : [6,7];
  }

  // Migration for older matches: the set was at 6:6 and the stored
  // "completedSets" value is actually the tie-break score.

    if(Number(cs[0])>Number(cs[1])) return [7,6];
    if(Number(cs[1])>Number(cs[0])) return [6,7];
  }

  // Another legacy pattern: impossible normal set results such as 7:0..7:4
  // were previously tie-break scores. Normalize only unambiguous cases.
  if(cs){
    const a=Number(cs[0]),b=Number(cs[1]);

function applyScoreCorrection(){

      if(!Number.isInteger(a)||!Number.isInteger(b)||a<0||b<0){

      }
      m.gamePoints=[0,0];
      m.tiebreak=true;
      m.matchTiebreak=false;

    }else{

        map[document.getElementById('rp0').value],

  const oppErr=rows.filter(p=>p.winner==='player'&&p.kind==='error').length;

  const notes=[`${pct(won,n)}% der erfassten Punkte gewonnen (${won} von ${n}).`];
  if(won){
    if(oppErr>ownWinner)notes.push('Mehr Punkte durch gegnerische Fehler als durch eigene Winner erzielt.');
    else if(ownWinner>oppErr)notes.push('Mehr Punkte durch eigene Winner als durch gegnerische Fehler erzielt.');
    else notes.push('Gewonnene Punkte verteilen sich gleich auf eigene Winner und gegnerische Fehler.');
  }
  const lost=n-won;

    </div>
    <div class="card"><div class="section">Kernwerte</div><div class="match-kpi-grid">
      ${matchKpi('Punkte gewonnen',pct(won,n)+'%',won+' / '+n)}
      ${matchKpi('Punkte verloren',pct(lost,n)+'%',lost+' / '+n)}
      ${matchKpi('Eigene Winner',String(ownWinner))}
      ${matchKpi('Eigene Fehler',String(ownErr))}
      ${matchKpi('Gegner-Winner',String(oppWinner))}
      ${matchKpi('Gegnerfehler',String(oppErr))}
    </div></div>
    <div class="card serve-section-card">
      <div class="serve-section-head"><div class="serve-section-title">Wie wurden die Punkte entschieden?</div></div>
      ${decisionBlock('Gewonnene Punkte',won,ownWinner,'Eigene Winner',oppErr,'Gegnerfehler')}
      ${decisionBlock('Verlorene Punkte',lost,oppWinner,'Gegner-Winner',ownErr,'Eigene Fehler')}
    </div>
    <button style="width:100%;margin-bottom:16px" onclick="analysis()">↩ ZURÜCK</button>
  `,'analysis');
}
function pct(a,b){return b?Math.round(a*100/b):0}
function serveRows(m){return (m?.points||[]).filter(p=>p.serveDetail&&p.serveDetail.complete)}
function serveUsed(detail){
  if(detail?.first?.in)return {no:1,data:detail.first};
  if(detail?.second?.in)return {no:2,data:detail.second};
  return null;
}
function serveKpi(label,value,sub=''){
  return `<div class="serve-kpi">
    <div class="serve-kpi-label">${esc(label)}</div>
    <div class="serve-kpi-value">${esc(value)}</div>
    ${sub?`<div class="serve-kpi-sub">${esc(sub)}</div>`:''}
  </div>`;
}
function serveMiniBar(label,count,total,win,showWin=true){
  const share=pct(count,total);
  return `<div class="serve-row">
    <div class="serve-row-top">
      <span class="serve-row-label">${esc(label)}</span>
      <span class="serve-row-metrics">${count} · ${share}%${showWin&&count?` · ${pct(win,count)}% Punkte`:''}</span>
    </div>
    <div class="serve-bar"><span style="width:${share}%"></span></div>
  </div>`;
}
function servePlacementBlock(rows,no){
  const attempts=[];
  rows.forEach(p=>{
    const d=p.serveDetail;
    const sd=no===1?d.first:d.second;
    const used=(no===1&&d.first?.in)||(no===2&&!d.first?.in&&d.second?.in);
    if(used&&sd?.placement)attempts.push({side:sd.side,zone:sd.placement,won:p.winner==='player'});
  });
  const sideBlock=(side,title)=>{
    const arr=attempts.filter(x=>x.side===side);
    return `<div class="serve-side">
      <div class="serve-side-title">${title}</div>
      ${['T','Mitte','Außen'].map(z=>{
        const zarr=arr.filter(x=>x.zone===z);
        return serveMiniBar(z,zarr.length,arr.length,zarr.filter(x=>x.won).length,true);
      }).join('')}
      ${!arr.length?'<div class="serve-empty">Noch keine Daten.</div>':''}
    </div>`;
  };
  return `<div class="card serve-section-card">
    <div class="serve-section-head">
      <div class="serve-section-title">${no}. Aufschlag · Platzierung</div>
      <div class="serve-pill">n=${attempts.length}</div>
    </div>
    ${sideBlock('right','Einstandseite')}
    ${sideBlock('left','Vorteilseite')}
  </div>`;
}
function serveEffectBlock(rows){
  const used=rows.map(p=>({p,u:serveUsed(p.serveDetail)})).filter(x=>x.u);
  const effects=[
    ['Direkter Punkt','direct'],
    ['Schwacher Return','weak'],
    ['Normaler Ballwechsel','neutral']
  ];
  return `<div class="card serve-section-card">
    <div class="serve-section-head"><div class="serve-section-title">Wirkung</div><div class="serve-pill">n=${used.length}</div></div>
    ${used.length?`<div class="serve-columns">
      ${effects.map(([lab,val])=>{
        const n=used.filter(x=>x.u.data.effect===val).length;
        const share=pct(n,used.length);
        return `<div class="serve-column-item">
          <div class="serve-column-wrap">
            <div class="serve-column" style="height:${Math.max(4,share)}%">
              <span class="serve-column-value">${share}%</span>
            </div>
          </div>
          <div class="serve-column-label">${lab}</div>
          <div class="serve-column-count">n=${n}</div>
        </div>`;
      }).join('')}
    </div>`:'<div class="serve-side"><div class="serve-empty">Noch keine Daten.</div></div>'}
  </div>`;
}
function serveErrorBlock(rows){
  const first=rows.filter(p=>p.serveDetail?.first?.in===false).map(p=>p.serveDetail.first.errorType).filter(Boolean);
  const second=rows.filter(p=>p.serveDetail?.first?.in===false&&p.serveDetail?.second?.in===false).map(p=>p.serveDetail.second.errorType).filter(Boolean);
  const colors=['#1f4d3a','#8da99a','#c8d6ce'];
  const make=(arr,title)=>{
    const cats=['Netz','Lang','Seitlich'];
    if(!arr.length)return `<div class="serve-donut-card"><div class="serve-donut-title">${title}</div><div class="serve-donut-empty">Keine Fehlerdaten</div></div>`;
    const counts=cats.map(x=>arr.filter(v=>v===x).length);
    const shares=counts.map(n=>pct(n,arr.length));
    let cursor=0;
    const stops=shares.map((share,i)=>{
      const start=cursor,end=cursor+share;cursor=end;
      return `${colors[i]} ${start}% ${end}%`;
    }).join(',');
    return `<div class="serve-donut-card">
      <div class="serve-donut-title">${title}</div>
      <div class="serve-donut" style="background:conic-gradient(${stops})">
        <div class="serve-donut-center"><strong>${arr.length}</strong><span>Fehler</span></div>
      </div>
      <div class="serve-donut-legend">
        ${cats.map((x,i)=>`<div class="serve-legend-row">
          <span class="serve-legend-name"><span class="serve-legend-dot" style="background:${colors[i]}"></span>${x}</span>
          <b>${counts[i]} · ${shares[i]}%</b>
        </div>`).join('')}
      </div>
    </div>`;
  };
  return `<div class="card serve-section-card">
    <div class="serve-section-head"><div class="serve-section-title">Fehlerbild</div></div>
    <div class="serve-donut-grid">${make(first,'1. Aufschlag')}${make(second,'2. Aufschlag')}</div>
  </div>`;
}
function serveInsights(rows){
  const notes=[];
  const firstIn=rows.filter(p=>p.serveDetail.first?.in).length;
  const secondAttempts=rows.filter(p=>p.serveDetail.first?.in===false).length;
  const secondIn=rows.filter(p=>p.serveDetail.first?.in===false&&p.serveDetail.second?.in).length;
  const successful=rows.map(p=>({p,u:serveUsed(p.serveDetail)})).filter(x=>x.u);
  const advantage=successful.filter(x=>['direct','weak'].includes(x.u.data.effect)).length;

  const zones=[];
  [1,2].forEach(no=>['right','left'].forEach(side=>['T','Mitte','Außen'].forEach(zone=>{
    const a=rows.filter(p=>{
      const d=p.serveDetail,sd=no===1?d.first:d.second;
      return ((no===1&&d.first?.in)||(no===2&&!d.first?.in&&d.second?.in))&&sd?.side===side&&sd?.placement===zone;
    });
    if(a.length>=3)zones.push({no,side,zone,n:a.length,wr:pct(a.filter(p=>p.winner==='player').length,a.length)});
  })));
  if(zones.length){
    zones.sort((a,b)=>b.wr-a.wr||b.n-a.n);
    const z=zones[0];
    notes.push(`${z.no}. Aufschlag ${z.zone} auf der ${z.side==='right'?'Einstand':'Vorteil'}seite ist aktuell am erfolgreichsten (${z.wr}% Punktgewinn, n=${z.n}).`);
  }
  if(rows.length>=5)notes.push(`1. Aufschlag: ${pct(firstIn,rows.length)}% im Feld.`);
  if(secondAttempts>=3)notes.push(`2. Aufschlag: ${pct(secondIn,secondAttempts)}% im Feld.`);
  if(successful.length>=5)notes.push(`${pct(advantage,successful.length)}% der erfolgreichen Aufschläge erzeugen direkt einen Punkt oder einen schwachen Return.`);
  return `<div class="card serve-hero"><div class="section">Erkenntnisse</div>${
    notes.length?notes.slice(0,3).map(x=>`<div class="serve-insight">${esc(x)}</div>`).join(''):
    '<p class="muted">Für belastbare Hinweise sind noch mehr Serve-Daten nötig.</p>'
  }</div>`;
}
function serveAnalysis(matchId){
  const eligible=state.matches.filter(m=>serveRows(m).length);
  if(!eligible.length){
    shell('Aufschlaganalyse',`<div class="card"><p class="muted">Noch keine Matches mit vollständigen Aufschlagdaten vorhanden.</p><button class="primary" onclick="analysis()">ZURÜCK ZUR ANALYSE</button></div>`,'analysis');
    return;
  }
  const m=eligible.find(x=>x.id===matchId)||eligible[eligible.length-1];
  const rows=serveRows(m);
  const firstAttempts=rows.length;
  const firstIn=rows.filter(p=>p.serveDetail.first?.in).length;
  const secondAttempts=rows.filter(p=>p.serveDetail.first?.in===false).length;
  const secondIn=rows.filter(p=>p.serveDetail.first?.in===false&&p.serveDetail.second?.in).length;
  const df=rows.filter(p=>p.serveDetail.first?.in===false&&p.serveDetail.second?.in===false).length;
  const firstWinRows=rows.filter(p=>p.serveDetail.first?.in);
  const secondWinRows=rows.filter(p=>p.serveDetail.first?.in===false&&p.serveDetail.second?.in);
  const firstPts=firstWinRows.filter(p=>p.winner==='player').length;
  const secondPts=secondWinRows.filter(p=>p.winner==='player').length;
  const successful=rows.map(p=>({p,u:serveUsed(p.serveDetail)})).filter(x=>x.u);
  const advantage=successful.filter(x=>['direct','weak'].includes(x.u.data.effect)).length;

  shell('Aufschlaganalyse',`
    <div class="card">
      <div class="section">Match</div>
      <select id="serveAnalysisMatch" class="input" onchange="serveAnalysis(this.value)">
        ${eligible.map(x=>`<option value="${x.id}" ${x.id===m.id?'selected':''}>${esc(x.player)} – ${esc(x.opponent)} · ${x.sets[0]}:${x.sets[1]}</option>`).join('')}
      </select>
      <div class="muted small" style="margin-top:8px">${rows.length} erfasste Aufschlagpunkte</div>
    </div>

    ${serveInsights(rows)}

    <div class="card">
      <div class="section">Kernwerte</div>
      <div class="serve-kpi-grid">
        ${serveKpi('1. Aufschlag drin',pct(firstIn,firstAttempts)+'%',firstIn+' / '+firstAttempts)}
        ${serveKpi('Punkte nach 1.',pct(firstPts,firstWinRows.length)+'%',firstPts+' / '+firstWinRows.length)}
        ${serveKpi('2. Aufschlag drin',secondAttempts?pct(secondIn,secondAttempts)+'%':'—',secondIn+' / '+secondAttempts)}
        ${serveKpi('Punkte nach 2.',secondWinRows.length?pct(secondPts,secondWinRows.length)+'%':'—',secondPts+' / '+secondWinRows.length)}
        ${serveKpi('Doppelfehler',String(df),firstAttempts?pct(df,firstAttempts)+'% der Punkte':'')}
        ${serveKpi('Serve-Vorteil',successful.length?pct(advantage,successful.length)+'%':'—','direkt + schwacher Return')}
      </div>
    </div>

    ${servePlacementBlock(rows,1)}
    ${servePlacementBlock(rows,2)}
    ${serveEffectBlock(rows)}
    ${serveErrorBlock(rows)}
    <button style="width:100%;margin-bottom:16px" onclick="analysis()">↩ ZURÜCK</button>
  `,'analysis');
}
function analysis(){shell('Analyse',`<div class="card"><div class="section">Analyse auswählen</div><select class="input" onchange="analysisPick(this.value)"><option value="">Bitte auswählen</option><option>Matchübersicht</option><option>Vorhand / Rückhand / Volley</option><option>Ballplatzierung</option><option>Ballwechsel</option><option>Aufschlag</option><option>Gegner 🔒</option></select></div><div class="card"><div class="section">Matches</div>${state.matches.length?state.matches.map(m=>`<div class="row"><span>${esc(m.player)} – ${esc(m.opponent)}<br><span class="badge">${m.finished?'beendet':'nicht beendet'}</span></span><span>${m.sets[0]}:${m.sets[1]}</span></div>`).join(''):'<p class="muted">Noch keine Matches.</p>'}`,'analysis')}
function analysisPick(x){if(x==='Matchübersicht'){matchOverview();return}if(x==='Aufschlag'){serveAnalysis();return}if(x)toast('Auswahl: '+x)}
function development(){shell('Entwicklung','<div class="card"><h2>Entwicklung</h2><p class="muted">Trend- und Matchvergleich wird auf der gespeicherten Datengrundlage aufgebaut.</p></div>','development')}
function opponents(){shell('Gegner','<div class="card"><h2>Gegneranalyse</h2><p class="muted">Eigene Maske: 1. fehlerhafter Schlag der Gegnerin, 2. Mias vorheriger Ball: kurz, tief, hoch oder Winkel.</p><button class="primary" onclick="oppCapture()">GEGNERFEHLER ERFASSEN</button></div>','opponents')}
function oppCapture(){let s=1,a=null,b=null;function draw(){if(s===1)shell('Gegneranalyse',`<div class="card"><div class="section">Wo passiert der Fehler der Gegnerin?</div><div class="grid">${['Aufschlag','Return','Vorhand','Rückhand','Volley'].map(x=>`<button class="${a===x?'selected':''}" onclick="window.oc('${x}')">${x}</button>`).join('')}</div><button class="primary" style="margin-top:14px" onclick="window.onext()">WEITER</button></div>`,'opponents');else shell('Gegneranalyse',`<div class="card"><div class="section">Wo kam Mias Ball vorher hin?</div><div class="grid">${['kurz','tief','hoch','Winkel'].map(x=>`<button class="${b===x?'selected':''}" onclick="window.ob('${x}')">${x}</button>`).join('')}</div><button class="primary" style="margin-top:14px" onclick="window.osave()">SPEICHERN</button></div>`,'opponents')}window.oc=x=>{a=x;draw()};window.onext=()=>{if(!a){toast('Schlag auswählen.');return}s=2;draw()};window.ob=x=>{b=x;draw()};window.osave=()=>{if(!b){toast('Ballcharakteristik auswählen.');return}toast('Gegnerfehler gespeichert.');opponents()};draw()}
(function boot(){const m=match();if(m)point();else if(player())home();else settings()})();
</script></body></html>
