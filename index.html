<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Tennis Analysis</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f3;color:#151515;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:90px}.top{display:flex;justify-content:space-between;padding:16px}.top h1{font-size:20px;margin:0}.content{padding:0 16px}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 1px 4px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button,select,input{font:inherit}button{border:0;border-radius:14px;padding:14px;min-height:54px;background:#fff;font-weight:650;box-shadow:0 1px 3px #0002}button.primary{background:#111827;color:white;width:100%}button.secondary{background:#e8e8e5}button.selected{background:#e4e7eb;outline:3px solid #111827}.section{font-size:12px;font-weight:800;letter-spacing:.07em;color:#6b7280;text-transform:uppercase;margin:16px 0 8px}.input{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:12px;background:white}.score{text-align:center;font-size:34px;font-weight:800}.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(4,1fr);padding:7px 6px;z-index:5}.nav button{box-shadow:none;background:transparent;font-size:12px;min-height:48px}.nav button.active{background:#eee}.court{position:relative;aspect-ratio:1/1;background:#e9eef0;border:3px solid #111;border-radius:8px;overflow:hidden}.zone{position:absolute;width:33.333%;height:33.333%;border-right:1px solid #777;border-bottom:1px solid #777}.z1{left:0;top:0}.z2{left:33.333%;top:0}.z3{left:66.666%;top:0;border-right:0}.z4{left:0;top:33.333%}.z5{left:33.333%;top:33.333%}.z6{left:66.666%;top:33.333%;border-right:0}.z7{left:0;top:66.666%;border-bottom:0}.z8{left:33.333%;top:66.666%;border-bottom:0}.z9{left:66.666%;top:66.666%;border-right:0;border-bottom:0}.court:after{content:"";position:absolute;left:0;right:0;top:50%;border-top:4px solid #111}.marker{position:absolute;width:28px;height:28px;border-radius:50%;background:#111827;border:4px solid white;transform:translate(-50%,-50%);z-index:3}.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 16px;border-radius:12px;z-index:20}.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;z-index:30}.modalbox{background:#fff;width:100%;padding:22px 16px 30px;border-radius:22px 22px 0 0}.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
</style></head><body><div id="app"></div><script>
const K="tennis_analysis_v3",D={players:[{name:"Mia",hand:"Rechts",lk:"20.8"}],matches:[],settings:{start:"0:0",ad:true,third:"match-tiebreak"}};let S=(()=>{try{return JSON.parse(localStorage.getItem(K))||D}catch(e){return D}})(),mods={court:false,rally:false,serve:false,opponent:false},hand="";
const $=s=>document.querySelector(s),save=()=>localStorage.setItem(K,JSON.stringify(S)),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])),toast=t=>{let e=document.createElement("div");e.className="toast";e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),1400)};
function shell(t,b,a="home"){app.innerHTML=`<div class="app"><header class="top"><h1>${t}</h1><button onclick="settings()">⚙</button></header><main class="content">${b}</main><nav class="nav"><button class="${a=="home"?"active":""}" onclick="home()">Matches</button><button class="${a=="analysis"?"active":""}" onclick="analysis()">Analyse</button><button class="${a=="development"?"active":""}" onclick="development()">Entwicklung</button><button class="${a=="opponents"?"active":""}" onclick="opponents()">Gegner</button></nav></div>`}
function home(){let m=S.matches.at(-1);shell("Tennis Analysis",`<div class="card"><div class="section">Spielerin</div><div class="input">${esc(S.players[0].name)} · LK ${S.players[0].lk}</div><button class="primary" style="margin-top:14px;font-size:20px" onclick="newMatch()">＋ MATCH</button></div>${m?`<div class="card"><div class="section">Letztes Match</div><h2>${esc(m.player)} – ${esc(m.opponent)}</h2><div class="score">${m.games}</div></div>`:""}`)}
function newMatch(){mods={court:false,rally:false,serve:false,opponent:false};hand="";shell("Neues Match",`<div class="card"><div class="section">Spielerin</div><div class="input">${S.players[0].name} · ${S.players[0].hand} · LK ${S.players[0].lk}</div><div class="section">Gegnerin</div><input id="opp" class="input" placeholder="Name optional"><div class="section">Spielhand Gegnerin</div><div class="grid"><button id="hr" onclick="pickHand('Rechts')">Rechts</button><button id="hl" onclick="pickHand('Links')">Links</button></div><div class="section">LK Gegnerin</div><input id="lk" class="input" placeholder="optional"><div class="section">Matchtyp</div><select id="typ" class="input"><option>Nicht angegeben</option><option>Turnier</option><option>Punktspiel</option><option>Trainingsspiel</option></select><div class="section">Module</div><div class="grid">${["court","rally","serve","opponent"].map(x=>`<button id="m${x}" onclick="tm('${x}')">${x=="serve"?"Aufschlag":x[0].toUpperCase()+x.slice(1)}</button>`).join("")}</div><div class="card"><b>Matchregeln</b><div>${S.settings.start} · ${S.settings.ad?"Ad":"No-Ad"} · ${S.settings.third=="normal"?"3. Satz normal":"Match-Tie-Break bis 10"}</div></div><button class="primary" onclick="start()">MATCH STARTEN</button></div>`)}
function pickHand(x){hand=x;hr.classList.toggle("selected",x=="Rechts");hl.classList.toggle("selected",x=="Links")}function tm(x){mods[x]=!mods[x];$("m"+x).classList.toggle("selected",mods[x])}
function start(){S.current={id:Date.now(),date:Date.now(),player:S.players[0].name,opponent:$("#opp").value||"Gegnerin",mods:{...mods},games:"0:0",gp:[0,0],points:[],pending:null};renderPoint()}
function score(){let p=S.current.gp,m=["0","15","30","40"];if(p[0]>=3&&p[1]>=3){if(S.settings.ad){if(p[0]==p[1])return"40:40";return p[0]>p[1]?"AD:40":"40:AD"}return"40:40"}return`${m[Math.min(p[0],3)]}:${m[Math.min(p[1],3)]}`}
function renderPoint(){let c=S.current,p=c.pending;let shots=["Vorhand","Rückhand","Volley","Aufschlag","Return"];shell(`${c.player} – ${c.opponent}`,`<div class="score">${score()}</div><div class="card"><div class="section">Wer hat den Punkt gemacht?</div><div class="grid"><button class="${p?.winner=="player"?"selected":""}" onclick="winner('player')">${c.player}</button><button class="${p?.winner=="opponent"?"selected":""}" onclick="winner('opponent')">${c.opponent}</button></div>${p?.winner?`<div class="section">${p.winner=="player"?"Wie hat Mia den Punkt gewonnen?":"Wie hat die Gegnerin den Punkt gewonnen?"}</div><div class="grid"><button class="${p.kind=="winner"?"selected":""}" onclick="kind('winner')">${p.winner=="player"?"Mia-Winner":"Gegner-Winner"}</button><button class="${p.kind=="error"?"selected":""}" onclick="kind('error')">${p.winner=="player"?"Gegnerfehler":"Mia-Fehler"}</button></div>`:""}${p?.kind?`<div class="section">${p.winner=="player"&&p.kind=="error"?"Nach welchem Schlag von Mia?":p.winner=="opponent"&&p.kind=="error"?"Welcher Schlag von Mia war der Fehler?":"Welcher Schlag von Mia?"}</div><div class="grid">${shots.map(x=>`<button class="${p.shot==x?"selected":""}" onclick="shot('${x}')">${x}</button>`).join("")}</div>`:""}${p?.shot=="Aufschlag"&&c.mods.serve?`<div class="section">Aufschlag</div><div class="grid"><button class="${p.serve=="1Sa"?"selected":""}" onclick="serve('1Sa')">Erster Aufschlag</button><button class="${p.serve=="1Sb"?"selected":""}" onclick="serve('1Sb')">Zweiter Aufschlag</button></div>`:""}</div><button class="primary" onclick="next()">WEITER</button><button class="secondary" style="width:100%;margin-top:8px" onclick="undoAsk()">↩ ZURÜCK</button>`)}
function winner(x){S.current.pending={winner:x};renderPoint()}function kind(x){S.current.pending={...S.current.pending,kind:x};renderPoint()}function shot(x){S.current.pending={...S.current.pending,shot:x};renderPoint()}function serve(x){S.current.pending={...S.current.pending,serve:x};renderPoint()}
function next(){let p=S.current.pending;if(!p?.winner||!p.kind||!p.shot||(p.shot=="Aufschlag"&&S.current.mods.serve&&!p.serve)){toast("Bitte vollständig erfassen.");return}if(p.winner=="opponent"&&p.kind=="error"){finish(p)}else if(S.current.mods.court){court()}else if(S.current.mods.rally){rally()}else finish(p)}
function court(){let p=S.current.pending,label=p.shot; shell("Court",`<div class="card"><div class="section">Ballplatzierung von Mias ${label}</div><div id="court" class="court">${[1,2,3,4,5,6,7,8,9].map(i=>`<div class="zone z${i}"></div>`).join("")}</div><div class="muted">Grundlinie unten · Netz oben</div><button style="width:100%;margin-top:10px" onclick="courtNS()">NICHT GESEHEN</button></div><button class="primary" onclick="courtNext()">WEITER</button><button style="width:100%;margin-top:8px" onclick="renderPoint()">↩ ZURÜCK</button>`);$("court").onclick=e=>{let r=e.currentTarget.getBoundingClientRect();S.current.court={x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height};let m=document.createElement("div");m.className="marker";m.style.left=S.current.court.x*100+"%";m.style.top=S.current.court.y*100+"%";$("court").querySelector(".marker")?.remove();$("court").append(m)}}
function courtNS(){S.current.court="Nicht gesehen";toast("Nicht gesehen")}
function courtNext(){if(S.current.mods.rally)rally();else finish(S.current.pending)}
function rally(){let v=S.current.rally;shell("Rally",`<div class="card"><div class="section">Dauer des Ballwechsels (eigene Schlagzahl)</div><div class="grid">${["1","2–3","4–6","7+"].map(x=>`<button class="${v==x?"selected":""}" onclick="rv('${x}')">${x} Schläge</button>`).join("")}</div><button class="${v=="Nicht gesehen"?"selected":""}" style="width:100%;margin-top:10px" onclick="rv('Nicht gesehen')">NICHT GESEHEN</button></div><button class="primary" onclick="finish(S.current.pending)">BESTÄTIGEN</button><button style="width:100%;margin-top:8px" onclick="renderPoint()">↩ ZURÜCK</button>`)}function rv(x){S.current.rally=x;rally()}
function finish(p){S.current.points.push({...p,court:S.current.court||null,rally:S.current.rally||null});let i=p.winner=="player"?0:1;S.current.gp[i]++;if(S.current.gp[i]>=4&&S.current.gp[i]-S.current.gp[1-i]>=1){let g=S.current.games.split(":").map(Number);g[i]++;S.current.games=g.join(":");S.current.gp=[0,0]}S.current.pending=null;S.current.court=null;S.current.rally=null;save();renderPoint()}
function undoAsk(){if(!S.current.points.length){toast("Noch kein Punkt erfasst.");return}document.body.insertAdjacentHTML("beforeend",`<div class="modal"><div class="modalbox"><h3>Wirklich zurück?</h3><p>Der zuletzt erfasste Punkt wird gelöscht.</p><div class="modal-actions"><button onclick="this.closest('.modal').remove()">Abbrechen</button><button class="primary" onclick="undo()">Zurück</button></div></div></div>`)}
function undo(){document.querySelector(".modal")?.remove();S.current.points.pop();S.current.gp=[0,0];S.current.games="0:0";for(let p of S.current.points){let i=p.winner=="player"?0:1;S.current.gp[i]++;if(S.current.gp[i]>=4&&S.current.gp[i]-S.current.gp[1-i]>=1){let g=S.current.games.split(":").map(Number);g[i]++;S.current.games=g.join(":");S.current.gp=[0,0]}}save();renderPoint()}
function analysis(){shell("Analyse",`<div class="card"><h2>Analyse</h2><p>Gespeicherte Matches und Einzelanalysen werden hier verfügbar.</p></div>`,"analysis")}function development(){shell("Entwicklung",`<div class="card"><h2>Muster & Trends</h2><p>Trend ab 2 Datenmengen; Muster ab 3; belastbarer Trend ab 4.</p></div>`,"development")}function opponents(){shell("Gegner",`<div class="card"><h2>Gegneranalyse</h2><p>Eigener Erfassungsablauf wird ergänzt.</p></div>`,"opponents")}function settings(){shell("Einstellungen",`<div class="card"><div class="section">Startstand</div><select id="st" class="input"><option value="0:0">0:0</option><option value="2:2">2:2</option></select><div class="section">Punktwertung</div><select id="ad" class="input"><option value="1">Ad</option><option value="0">No-Ad</option></select><div class="section">Dritter Satz</div><select id="third" class="input"><option value="match-tiebreak">Match-Tie-Break bis 10</option><option value="normal">Ganzer Satz</option></select><button class="primary" style="margin-top:14px" onclick="saveSet()">SPEICHERN</button></div>`);st.value=S.settings.start;ad.value=S.settings.ad?"1":"0";third.value=S.settings.third)}function saveSet(){S.settings.start=st.value;S.settings.ad=ad.value=="1";S.settings.third=third.value;save();toast("Gespeichert")}
home();
</script></body></html>
